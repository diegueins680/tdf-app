name: Isolated studio Feed recovery
on:
  push:
    branches: [verify/studio-feed-cold-restore-20261125]
permissions:
  contents: read
  actions: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: 45683210841
          pattern: studio-test-*
          path: executable
      - run: |
          chmod +x executable/*/tdf-hq-exe
          npm ci --ignore-scripts
          python3 rehearsal/recovery.py
      - uses: actions/upload-artifact@v7
        with:
          name: studio-feed-recovery-result
          path: studio-feed-recovery-result.json
          if-no-files-found: error
          retention-days: 30
