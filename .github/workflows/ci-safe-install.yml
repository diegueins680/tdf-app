name: CI Safe Install

on:
  pull_request:
    paths:
      - 'tdf-hq/**'
      - 'tdf-hq-ui/**'
      - 'tdf-mobile'
      - 'tdf-mobile/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'audit-ci.jsonc'
      - '.npmrc'
      - '.github/workflows/**'
  push:
    branches: [ main ]
    paths:
      - 'tdf-hq/**'
      - 'tdf-hq-ui/**'
      - 'tdf-mobile'
      - 'tdf-mobile/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'audit-ci.jsonc'
      - '.npmrc'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      NPM_CONFIG_IGNORE_SCRIPTS: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Clean install
        run: npm ci
      - name: npm audit
        run: ./node_modules/.bin/audit-ci --config ./audit-ci.jsonc
      - name: Build (if present)
        run: npm run -s --if-present build
      - name: Test (if present)
        run: npm run -s --if-present test
