name: Server campaign platform
on:
  pull_request:
    paths:
      - 'services/campaign-platform/**'
      - '.github/workflows/campaign-platform.yml'
  push:
    branches: [main]
    paths:
      - 'services/campaign-platform/**'
      - '.github/workflows/campaign-platform.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r services/campaign-platform/requirements.txt
      - run: python -m unittest discover -s services/campaign-platform/tests -v
      - run: python services/campaign-platform/model_check.py
      - run: node --check services/campaign-platform/ui/app.js
      - run: node --check services/campaign-platform/ui/tiktok.js
