name: Check Messaging Token

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'check'
        type: choice
        options:
          - check

permissions:
  contents: read

jobs:
  check-token:
    runs-on: ubuntu-latest
    steps:
      - name: Check notification configuration
        id: notification-config
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate requested action
        env:
          WORKFLOW_EVENT: ${{ github.event_name }}
          REQUESTED_ACTION: ${{ inputs.action }}
        run: |
          case "$WORKFLOW_EVENT:$REQUESTED_ACTION" in
            schedule:|workflow_dispatch:check) ;;
            *) echo '::error::Unsupported messaging-token action'; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check Messaging Token (read-only)
        env:
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID || secrets.META_APP_ID || '1098715965613487' }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET || secrets.META_APP_SECRET }}
          INSTAGRAM_MESSAGING_TOKEN: ${{ secrets.INSTAGRAM_MESSAGING_TOKEN }}
          FACEBOOK_MESSAGING_TOKEN: ${{ secrets.FACEBOOK_MESSAGING_TOKEN }}
        run: node scripts/check-messaging-token.mjs --check

      - name: Notify on Failure
        if: failure() && steps.notification-config.outputs.enabled == 'true'
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "🚨 Messaging token health check failed! Rotate credentials in the current Hetzner deployment and synchronize the GitHub check credentials; Fly refresh is retired.\nApp: tdf-hq\nWorkflow: ${{ github.workflow }}\nRun: ${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Report unavailable failure notification
        if: failure() && steps.notification-config.outputs.enabled == 'false'
        run: echo "::warning::SLACK_WEBHOOK_URL is not configured; workflow failure was not sent to Slack."
