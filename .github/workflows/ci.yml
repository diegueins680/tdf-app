name: CI

on:
  # Every PR must reach source admission, including new runtime/ops roots and
  # canonical specification-only edits. Component jobs are selected below.
  pull_request:
  workflow_dispatch:
    inputs:
      inspect_payment_staging:
        description: Read-only metadata and secret-name inspection of the two fixed staging apps.
        required: false
        default: false
        type: boolean
      force_backend:
        description: Build the backend even when path classification would skip it.
        type: boolean
        default: false
      publish_backend_artifact:
        description: Retain the tested backend executable for one day.
        type: boolean
        default: false
      native_android_run:
        description: Successful TDF-mobile Android test-build run matching the checked-in mobile commit.
        type: string
        default: ''
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      FLY_STAGING_API_TOKEN:
        required: false
      FLY_STAGING_WEB_TOKEN:
        required: false
      KOYEB_API_TOKEN:
        required: false
    inputs:
      force_backend:
        description: Always build and test the backend, even when path classification would skip it.
        required: false
        default: false
        type: boolean
      publish_backend_artifact:
        description: Upload the tested backend executable for the image packaging workflow.
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  payment-staging-inspection:
    if: github.event_name == 'workflow_dispatch' && inputs.inspect_payment_staging == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify staging target and redaction guards
        run: node --test scripts/__tests__/payment-staging-inspection.test.mjs
      - name: Install official Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: '0.4.103'
      - name: Inspect only existing staging metadata
        env:
          FLY_STAGING_API_TOKEN: ${{ secrets.FLY_STAGING_API_TOKEN }}
          FLY_STAGING_WEB_TOKEN: ${{ secrets.FLY_STAGING_WEB_TOKEN }}
          KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
          NO_COLOR: '1'
        run: node scripts/inspect-payment-staging.mjs
      - name: Upload allowlisted staging access report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: payment-staging-access-${{ github.sha }}
          path: artifacts/payment-staging/access-report.json
          if-no-files-found: ignore
          retention-days: 7

  changes:
    runs-on: ubuntu-latest
    outputs:
      repo: ${{ steps.scope.outputs.repo }}
      ui: ${{ steps.scope.outputs.ui }}
      mobile: ${{ steps.scope.outputs.mobile }}
      backend: ${{ steps.scope.outputs.backend }}
      contracts: ${{ steps.scope.outputs.contracts }}
      migrations: ${{ steps.scope.outputs.migrations }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FORCE_BACKEND: ${{ (inputs.force_backend || (github.event_name == 'workflow_dispatch' && inputs.native_android_run != '')) && 'true' || 'false' }}
        run: |
          args=(--base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT")
          if [ "$FORCE_BACKEND" = 'true' ]; then args+=(--force-backend); fi
          node scripts/ci-change-scope.mjs "${args[@]}"

  repo-quality:
    needs: changes
    if: needs.changes.outputs.repo == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: submodule.tdf-mobile.update
          GIT_CONFIG_VALUE_0: checkout
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install image conformance tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install pinned recovery encryption tools
        run: |
          mkdir -m 700 "${RUNNER_TEMP}/tdf-recovery-private"
          tdf_recovery_tools="${RUNNER_TEMP}/tdf-recovery-private/age"
          python3 scripts/install-recovery-tools.py --destination "$tdf_recovery_tools"
          printf 'TDF_RECOVERY_TOOLS=%s\n' "$tdf_recovery_tools" >> "$GITHUB_ENV"

      - name: Run repository checks
        run: npm run quality:repo

      - name: Require canonical mappings for new implementation surfaces
        env:
          SPECIFICATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          if [ -z "$SPECIFICATION_BASE_SHA" ] || [ "$SPECIFICATION_BASE_SHA" = '0000000000000000000000000000000000000000' ]; then
            SPECIFICATION_BASE_SHA="$(git merge-base origin/main HEAD)"
          fi
          python3 scripts/check-new-specification-surfaces.py --base "$SPECIFICATION_BASE_SHA"

      - name: Verify private upload persistence across container replacement
        timeout-minutes: 8
        run: python3 scripts/test-persistent-uploads-container.py

      - name: Verify synthetic cold PostgreSQL recovery and negative controls
        timeout-minutes: 8
        run: |
          tdf_physical_image='pgvector/pgvector@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21'
          docker pull "$tdf_physical_image"
          sudo install -d -m 700 /opt/tdf/backups
          sudo env TDF_PHYSICAL_TEST_IMAGE="$tdf_physical_image" PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-physical-postgres-docker.py

  ui-quality:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run UI checks
        run: npm run quality:ui

  persona-web-e2e:
    needs: changes
    if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.repo == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run isolated persona web journeys
        run: npm run test:e2e:web

      - name: Verify default-off deletion rollout
        env:
          PLAYWRIGHT_ACCOUNT_DELETION_FORM_ENABLED: 'false'
          PLAYWRIGHT_ARTIFACT_DIR: artifacts/persona-playwright/deletion-rollout-off
        run: npx playwright test e2e/web/account-deletion-rollout.spec.mjs

      - name: Upload sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: persona-web-e2e-${{ github.run_id }}
          path: artifacts/persona-playwright
          retention-days: 14

  mobile-quality:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    env:
      REQUIRE_MOBILE_WORKSPACE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # Opt in to mobile; web hosts use .gitmodules' update=none default.
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: submodule.tdf-mobile.update
          GIT_CONFIG_VALUE_0: checkout
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm --prefix tdf-mobile ci

      - name: Verify shared notification destinations
        run: node scripts/generate-notification-navigation.mjs --check

      - name: Run mobile checks
        run: npm run quality:mobile

  # Public Docker Hub pulls use GitHub-hosted runner credentials. An explicit
  # global login overrides that identity and caused pre-build pull-rate failures.
  backend-quality:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    container:
      image: haskell:9.10.3-bookworm
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: tdf_hq_automatic_migration_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d tdf_hq_automatic_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      REQUIRE_STACK: '1'
      TDF_TEST_POSTGRES_HOST: postgres
      TDF_TEST_POSTGRES_PASSWORD: postgres
      STACK_ROOT: ${{ github.workspace }}/.stack-root
      BACKEND_BINARY_OUT: ${{ github.workspace }}/tdf-hq/.release/tdf-hq-exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libpq-dev postgresql-client python3 pkg-config git curl ca-certificates

      - name: Trust the exact container checkout for evidence Git reads
        # Container paths resolve to /__w while checkout may trust the host alias.
        # Never disable the ownership check with a wildcard.
        run: git config --global --add safe.directory "$(pwd -P)"

      - name: Setup backend verification Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install backend verification dependencies
        run: npm ci --ignore-scripts

      - name: Restore immutable Stack dependencies
        uses: actions/cache@v6
        with:
          path: .stack-root
          key: stack-deps-v1-ghc-9.10.3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tdf-hq/stack.yaml', 'tdf-hq/stack.yaml.lock', 'tdf-hq/tdf-hq.cabal') }}
          restore-keys: |
            stack-deps-v1-ghc-9.10.3-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore incremental backend objects
        uses: actions/cache@v6
        with:
          path: tdf-hq/.stack-work
          key: stack-work-v1-ghc-9.10.3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tdf-hq/stack.yaml', 'tdf-hq/stack.yaml.lock', 'tdf-hq/tdf-hq.cabal') }}
          restore-keys: |
            stack-work-v1-ghc-9.10.3-${{ runner.os }}-${{ runner.arch }}-

      - name: Build and test backend once
        run: bash scripts/quality-backend.sh

      - name: Verify authenticated account deletion and auditable resolution
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
          TDF_AUDIT_E2E_BACKEND_EXE: ${{ env.BACKEND_BINARY_OUT }}
          TDF_AUDIT_E2E_DATABASE: tdf_account_deletion_test
        run: |
          export TDF_AUDIT_E2E_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          sh scripts/test-studio-internship-audit-api-e2e.sh

      - name: Inspect the compiled Servant API against documented operations
        run: |
          mkdir -p tmp/specification
          node scripts/inspect-compiled-api.mjs --binary "$BACKEND_BINARY_OUT" --output tmp/specification/compiled-api

      - name: Verify booking object scope and concurrent resource calendar
        env:
          TDF_BOOKING_TEST_PG_HOST: postgres
          TDF_BOOKING_TEST_PG_PORT: '5432'
          TDF_BOOKING_TEST_PG_ROLE: postgres
          TDF_BOOKING_TEST_PG_PASSWORD: postgres
          TDF_BOOKING_TEST_SERVER_BIN: ${{ env.BACKEND_BINARY_OUT }}
          TDF_BOOKING_TEST_OUTPUT: tmp/specification/booking-conformance
        run: python3 scripts/test-booking-conformance.py

      - name: Verify artist self-service transactions and migration
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./scripts/test-artist-self-service.sh

      - name: Verify social session revocation and model-derived HTTP fixtures
        env:
          PGPASSWORD: postgres
          TDF_SOCIAL_HTTP_EMPTY_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_hq_social_session_test
        run: |
          createdb -h postgres -U postgres tdf_hq_social_session_test
          bash scripts/social/test-http.sh
      - name: Verify event operations HTTP runner safety guards
        run: node --test scripts/__tests__/event-operations-http-runner.test.mjs

      - name: Verify event operations authenticated HTTP boundary
        run: sh scripts/test-event-operations-http-ci.sh

      - name: Verify authenticated artist merch HTTP runtime
        env:
          PGPASSWORD: postgres
          TDF_MERCH_RUNTIME_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_hq_merch_runtime_test
        run: |
          createdb -h postgres -U postgres tdf_hq_merch_runtime_test
          ./scripts/test-artist-merch-runtime.sh

      - name: Verify provider identity authentication and concurrent linking
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: sh scripts/test-provider-identity.sh

      - name: Verify atomic Live Session identity intake
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: sh scripts/test-live-intake-identity.sh

      - name: Verify source-scoped course contacts and registration retries
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: sh scripts/test-course-identity.sh

      - name: Verify ticket payment endpoints refuse once event sales close
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: sh scripts/test-ticket-payment-gate.sh

      - name: Verify trial enquiries and actor-scoped student creation
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: sh scripts/test-trial-identity.sh

      - name: Verify marketplace contact identity and evidence retries
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: sh scripts/test-marketplace-contact-identity.sh


      - name: Verify reversible identity reconciliation
        env:
          PGPASSWORD: postgres
          TDF_IDENTITY_TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_identity_reconciliation_test
        run: |
          createdb -h postgres -U postgres tdf_identity_reconciliation_test
          bash scripts/test-identity-reconciliation.sh
          node --test scripts/__tests__/identity-reconciliation.test.mjs

      - name: Verify resumable video ingestion and migration invariants
        env:
          PGPASSWORD: postgres
          TDF_RECORDS_TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_records_runtime_test
        run: |
          createdb -h postgres -U postgres tdf_records_runtime_test
          ./scripts/test-records-ingestion-runtime.sh

      - name: Verify shared event pilot and publication boundaries
        env:
          PGPASSWORD: postgres
          TDF_EVENT_BOUNDARY_TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_event_boundary_test
        run: |
          createdb -h postgres -U postgres tdf_event_boundary_test
          ./scripts/test-event-ingestion-boundaries.sh

      - name: Verify atomic ticket admission on PostgreSQL
        env:
          PGPASSWORD: postgres
          TICKET_ADMISSION_TEST_DSN: postgresql://postgres:postgres@postgres:5432/tdf_ticket_admission_test
        run: |
          createdb -h postgres -U postgres tdf_ticket_admission_test
          bash scripts/test-ticket-admission.sh
          node --test scripts/__tests__/ticket-admission-model.test.mjs

      - name: Verify staff bank transfer review on the production schema
        env:
          PGPASSWORD: postgres
          TICKET_MANUAL_REVIEW_TEST_DSN: postgresql://postgres:postgres@postgres:5432/tdf_ticket_manual_review_test
        run: |
          createdb -h postgres -U postgres tdf_ticket_manual_review_test
          bash scripts/test-ticket-manual-review.sh

      - name: Verify durable ticket confirmations and concurrent workers
        env:
          PGPASSWORD: postgres
          TICKET_CONFIRMATION_TEST_DSN: postgresql://postgres:postgres@postgres:5432/tdf_ticket_confirmation_worker_test
        run: |
          createdb -h postgres -U postgres tdf_ticket_confirmation_worker_test
          bash scripts/test-ticket-confirmation.sh
          python3 scripts/test-ticket-confirmation-smtp.py

      - name: Verify automatic migrations against the production schema
        env:
          TDF_AUTOMIG_TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_hq_automatic_migration_test
          TDF_AUTOMIG_SERVER_BIN: ${{ env.BACKEND_BINARY_OUT }}
        run: bash scripts/test-automatic-migrations-production-schema.sh

      - name: Verify directory artist listings and canonical preview images
        env:
          PGPASSWORD: postgres
          TDF_ARTIST_LISTINGS_TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_artist_listings_test
          TDF_ARTIST_LISTINGS_SERVER_BIN: ${{ env.BACKEND_BINARY_OUT }}
        run: |
          createdb -h postgres -U postgres tdf_artist_listings_test
          bash scripts/test-directory-artist-listings.sh

      - name: Verify canonical provider retry concurrency and compatibility
        env:
          PGPASSWORD: postgres
          TDF_PROVIDER_RETRY_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_provider_retry_test
        run: |
          createdb -h postgres -U postgres tdf_provider_retry_test
          sh scripts/test-provider-retry-runtime.sh
      - name: Verify invoice worker claim, submission mark and lease fencing
        env:
          TDF_IDENTITY_HTTP_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_hq_automatic_migration_test
        run: sh scripts/test-invoice-worker.sh

      - name: Verify contact HTTP concurrency, authorization, archival and rollback
        env:
          TDF_IDENTITY_HTTP_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_hq_automatic_migration_test
          TDF_IDENTITY_HTTP_SERVER_BIN: ${{ env.BACKEND_BINARY_OUT }}
        run: |
          sh scripts/test-operations-inbound-capture.sh
          bash scripts/test-auth-recovery-migration.sh
          sh scripts/test-meta-redelivery.sh
          node scripts/__tests__/identity-http-runtime.mjs
          sh scripts/test-whatsapp-redelivery.sh
          sh scripts/test-credential-lifecycle.sh
          sh scripts/test-ticket-manual-review-concurrency.sh
          sh scripts/test-whatsapp-consent.sh
          sh scripts/test-index-declarations.sh
          sh scripts/test-interaction-write-budget.sh

      - name: Verify single assignment of an event without an organizer
        env:
          TDF_IDENTITY_HTTP_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_hq_automatic_migration_test
        run: sh scripts/test-event-organizer.sh

      - name: Verify checkout monetary snapshots and invalid-schema controls
        env:
          TDF_CHECKOUT_AMOUNT_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_hq_automatic_migration_test
        run: node scripts/__tests__/checkout-amount-postgres.mjs


      - name: Verify the production migration batch, ledger atomicity and lock refusal
        env:
          TDF_MIGRATION_BATCH_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_hq_automatic_migration_test
        run: node scripts/__tests__/migration-batch-postgres.mjs
