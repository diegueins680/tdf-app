name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      inspect_payment_staging:
        description: Read-only metadata and secret-name inspection of the two fixed staging apps.
        required: false
        default: false
        type: boolean
      force_backend:
        description: Build the backend even when path classification would skip it.
        type: boolean
        default: false
      publish_backend_artifact:
        description: Retain the tested backend executable for one day.
        type: boolean
        default: false
      native_android_run:
        description: Successful TDF-mobile Android test-build run matching the checked-in mobile commit.
        type: string
        default: ''
  workflow_call:
    inputs:
      force_backend:
        description: Always build and test the backend, even when path classification would skip it.
        required: false
        default: false
        type: boolean
      publish_backend_artifact:
        description: Upload the tested backend executable for the image packaging workflow.
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  payment-staging-inspection:
    if: github.event_name == 'workflow_dispatch' && inputs.inspect_payment_staging == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify staging target and redaction guards
        run: node --test scripts/__tests__/payment-staging-inspection.test.mjs
      - name: Install official Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: '0.4.103'
      - name: Inspect only existing staging metadata
        env:
          FLY_STAGING_API_TOKEN: ${{ secrets.FLY_STAGING_API_TOKEN }}
          FLY_STAGING_WEB_TOKEN: ${{ secrets.FLY_STAGING_WEB_TOKEN }}
          KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
          NO_COLOR: '1'
        run: node scripts/inspect-payment-staging.mjs
      - name: Upload allowlisted staging access report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: payment-staging-access-${{ github.sha }}
          path: artifacts/payment-staging/access-report.json
          if-no-files-found: ignore
          retention-days: 7

  changes:
    runs-on: ubuntu-latest
    outputs:
      repo: ${{ steps.scope.outputs.repo }}
      ui: ${{ steps.scope.outputs.ui }}
      mobile: ${{ steps.scope.outputs.mobile }}
      backend: ${{ steps.scope.outputs.backend }}
      contracts: ${{ steps.scope.outputs.contracts }}
      migrations: ${{ steps.scope.outputs.migrations }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FORCE_BACKEND: ${{ (inputs.force_backend || (github.event_name == 'workflow_dispatch' && inputs.native_android_run != '')) && 'true' || 'false' }}
        run: |
          args=(--base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT")
          if [ "$FORCE_BACKEND" = 'true' ]; then args+=(--force-backend); fi
          node scripts/ci-change-scope.mjs "${args[@]}"

  repo-quality:
    needs: changes
    if: needs.changes.outputs.repo == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run repository checks
        run: npm run quality:repo

  ui-quality:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run UI checks
        run: npm run quality:ui

  persona-web-e2e:
    needs: changes
    if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.repo == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run isolated persona web journeys
        run: npm run test:e2e:web

      - name: Upload sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: persona-web-e2e-${{ github.run_id }}
          path: artifacts/persona-playwright
          retention-days: 14

  mobile-quality:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    env:
      REQUIRE_MOBILE_WORKSPACE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # Opt in to mobile; web hosts use .gitmodules' update=none default.
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: submodule.tdf-mobile.update
          GIT_CONFIG_VALUE_0: checkout
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm --prefix tdf-mobile ci

      - name: Verify shared notification destinations
        run: node scripts/generate-notification-navigation.mjs --check

      - name: Run mobile checks
        run: npm run quality:mobile

  backend-quality:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    container: haskell:9.10.3-bookworm
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: tdf_hq_automatic_migration_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d tdf_hq_automatic_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      REQUIRE_STACK: '1'
      TDF_TEST_POSTGRES_HOST: postgres
      TDF_TEST_POSTGRES_PASSWORD: postgres
      STACK_ROOT: ${{ github.workspace }}/.stack-root
      BACKEND_BINARY_OUT: ${{ github.workspace }}/tdf-hq/.release/tdf-hq-exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libpq-dev postgresql-client nodejs python3 pkg-config git curl ca-certificates

      - name: Restore immutable Stack dependencies
        uses: actions/cache@v6
        with:
          path: .stack-root
          key: stack-deps-v1-ghc-9.10.3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tdf-hq/stack.yaml', 'tdf-hq/stack.yaml.lock', 'tdf-hq/tdf-hq.cabal') }}
          restore-keys: |
            stack-deps-v1-ghc-9.10.3-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore incremental backend objects
        uses: actions/cache@v6
        with:
          path: tdf-hq/.stack-work
          key: stack-work-v1-ghc-9.10.3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tdf-hq/stack.yaml', 'tdf-hq/stack.yaml.lock', 'tdf-hq/tdf-hq.cabal') }}
          restore-keys: |
            stack-work-v1-ghc-9.10.3-${{ runner.os }}-${{ runner.arch }}-

      - name: Build and test backend once
        run: bash scripts/quality-backend.sh

      - name: Verify artist self-service transactions and migration
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./scripts/test-artist-self-service.sh

      - name: Verify social session revocation and model-derived HTTP fixtures
        env:
          PGPASSWORD: postgres
          TDF_SOCIAL_HTTP_EMPTY_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_hq_social_session_test
        run: |
          createdb -h postgres -U postgres tdf_hq_social_session_test
          bash scripts/social/test-http.sh
      - name: Verify event operations HTTP runner safety guards
        run: node --test scripts/__tests__/event-operations-http-runner.test.mjs

      - name: Verify event operations authenticated HTTP boundary
        run: sh scripts/test-event-operations-http-ci.sh

      - name: Verify authenticated artist merch HTTP runtime
        env:
          PGPASSWORD: postgres
          TDF_MERCH_RUNTIME_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_hq_merch_runtime_test
        run: |
          createdb -h postgres -U postgres tdf_hq_merch_runtime_test
          ./scripts/test-artist-merch-runtime.sh

      - name: Verify provider identity authentication and concurrent linking
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: sh scripts/test-provider-identity.sh

      - name: Verify atomic Live Session identity intake
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: sh scripts/test-live-intake-identity.sh

      - name: Verify source-scoped course contacts and registration retries
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: sh scripts/test-course-identity.sh

      - name: Verify trial enquiries and actor-scoped student creation
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: sh scripts/test-trial-identity.sh

      - name: Verify marketplace contact identity and evidence retries
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: sh scripts/test-marketplace-contact-identity.sh


      - name: Verify reversible identity reconciliation
        env:
          PGPASSWORD: postgres
          TDF_IDENTITY_TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_identity_reconciliation_test
        run: |
          createdb -h postgres -U postgres tdf_identity_reconciliation_test
          bash scripts/test-identity-reconciliation.sh
          node --test scripts/__tests__/identity-reconciliation.test.mjs

      - name: Verify resumable video ingestion and migration invariants
        env:
          PGPASSWORD: postgres
          TDF_RECORDS_TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_records_runtime_test
        run: |
          createdb -h postgres -U postgres tdf_records_runtime_test
          ./scripts/test-records-ingestion-runtime.sh

      - name: Verify shared event pilot and publication boundaries
        env:
          PGPASSWORD: postgres
          TDF_EVENT_BOUNDARY_TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_event_boundary_test
        run: |
          createdb -h postgres -U postgres tdf_event_boundary_test
          ./scripts/test-event-ingestion-boundaries.sh

      - name: Verify atomic ticket admission on PostgreSQL
        env:
          PGPASSWORD: postgres
          TICKET_ADMISSION_TEST_DSN: postgresql://postgres:postgres@postgres:5432/tdf_ticket_admission_test
        run: |
          createdb -h postgres -U postgres tdf_ticket_admission_test
          bash scripts/test-ticket-admission.sh
          node --test scripts/__tests__/ticket-admission-model.test.mjs

      - name: Verify automatic migrations against the production schema
        env:
          TDF_AUTOMIG_TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_hq_automatic_migration_test
          TDF_AUTOMIG_SERVER_BIN: ${{ env.BACKEND_BINARY_OUT }}
        run: bash scripts/test-automatic-migrations-production-schema.sh

      - name: Verify canonical provider retry concurrency and compatibility
        env:
          PGPASSWORD: postgres
          TDF_PROVIDER_RETRY_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_provider_retry_test
        run: |
          createdb -h postgres -U postgres tdf_provider_retry_test
          sh scripts/test-provider-retry-runtime.sh
      - name: Verify contact HTTP concurrency, authorization, archival and rollback
        env:
          TDF_IDENTITY_HTTP_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_hq_automatic_migration_test
          TDF_IDENTITY_HTTP_SERVER_BIN: ${{ env.BACKEND_BINARY_OUT }}
        run: node scripts/__tests__/identity-http-runtime.mjs

      - name: Verify artist claim preparation concurrency and privacy
        env:
          TDF_CLAIM_TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_hq_automatic_migration_test
          TDF_CLAIM_SERVER_BIN: ${{ env.BACKEND_BINARY_OUT }}
        run: bash scripts/test-artist-claim-target-http.sh

      - name: Verify public catalog persistence contract and database round trips
        env:
          TDF_PUBLIC_CATALOG_TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_hq_automatic_migration_test
          TDF_PUBLIC_CATALOG_SERVER_BIN: ${{ env.BACKEND_BINARY_OUT }}
        run: node scripts/__tests__/public-catalog-http-runtime.mjs
      - name: Verify calendar runtime schema and admin HTTP contract
        env:
          TDF_CALENDAR_TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_hq_automatic_migration_test
          TDF_CALENDAR_SERVER_BIN: ${{ env.BACKEND_BINARY_OUT }}
        run: node scripts/__tests__/calendar-http-runtime.mjs

      - name: Verify navigation first-visit concurrency and account isolation
        env:
          TDF_NAVIGATION_TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_hq_automatic_migration_test
          TDF_NAVIGATION_SERVER_BIN: ${{ env.BACKEND_BINARY_OUT }}
        run: node scripts/__tests__/navigation-http-runtime.mjs

      - name: Verify paused experiment authority and concurrent HTTP persistence
        env:
          TDF_EXPERIMENT_TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_hq_automatic_migration_test
          TDF_EXPERIMENT_SERVER_BIN: ${{ env.BACKEND_BINARY_OUT }}
        run: node scripts/__tests__/experiment-http-runtime.mjs

      - name: Exercise public booking HTTP idempotency and resource conflicts
        env:
          TDF_PUBLIC_BOOKING_HTTP_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tdf_hq_automatic_migration_test
          TDF_PUBLIC_BOOKING_HTTP_SERVER_BIN: ${{ env.BACKEND_BINARY_OUT }}
        run: bash scripts/test-public-booking-http-concurrency.sh

      - name: Verify universal interactions through real HTTP sessions
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
          TDF_INTERACTION_SERVER_BIN: ${{ env.BACKEND_BINARY_OUT }}
        run: bash scripts/interactions/test-http.sh

      - name: Upload tested backend executable
        if: inputs.publish_backend_artifact == true || (github.event_name == 'workflow_dispatch' && inputs.native_android_run != '')
        uses: actions/upload-artifact@v7
        with:
          name: tdf-hq-binary-${{ github.sha }}
          path: tdf-hq/.release/tdf-hq-exe
          if-no-files-found: error
          retention-days: 1

  native-android-e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.native_android_run != ''
    needs: backend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: submodule.tdf-mobile.update
          GIT_CONFIG_VALUE_0: checkout
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v8
        with:
          name: tdf-hq-binary-${{ github.sha }}
          path: artifacts/interaction-backend
      - name: Verify and download the matching native test artifact
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE_RUN: ${{ inputs.native_android_run }}
        run: |
          [[ "$MOBILE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/diegueins680/TDF-mobile/actions/runs/$MOBILE_RUN" > "$RUNNER_TEMP/mobile-run.json"
          python3 - <<'PYVERIFY'
          import json, os, pathlib, subprocess
          run=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'mobile-run.json').read_text())
          expected=subprocess.check_output(['git','-C','tdf-mobile','rev-parse','HEAD'],text=True).strip()
          assert run['conclusion']=='success' and run['path']=='.github/workflows/interaction-android.yml'
          source=run['head_sha']
          assert len(source)==40 and all(c in '0123456789abcdef' for c in source)
          if source != expected:
              subprocess.run(['git','-C','tdf-mobile','fetch','--no-tags','--depth=1','origin',source],check=True)
              changed=subprocess.check_output(['git','-C','tdf-mobile','diff','--name-only',source,expected],text=True).splitlines()
              # Only Maestro YAML may differ. App, dependencies, native projects,
              # release scripts and build workflows must remain byte-identical.
              assert changed and all(p.startswith('e2e/interactions/') and p.endswith('.yaml') for p in changed), 'Native artifact application source differs'
          print('Verified native application source; test fixtures may advance independently')
          PYVERIFY
          gh run download "$MOBILE_RUN" --repo diegueins680/TDF-mobile --pattern 'interaction-android-*' --dir artifacts/interaction-apk
      - name: Install test runtime and verified Maestro CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client libpq5 libgmp10 libnuma1
          chmod +x artifacts/interaction-backend/tdf-hq-exe
          ldd artifacts/interaction-backend/tdf-hq-exe
          curl --fail --location --silent --show-error https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.5.1/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          printf '%s  %s\n' '2d924bfd37cccabca438a727213648cbfe4f8bb711559ec8e9d199dc09a5ce52' "$RUNNER_TEMP/maestro.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable hardware virtualization on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run installed Android discussion journeys
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          TDF_INTERACTION_SERVER_BIN: ${{ github.workspace }}/artifacts/interaction-backend/tdf-hq-exe
          TDF_INTERACTION_SERVER_PORT: '18128'
          TDF_INTERACTION_NATIVE_DEVICE: emulator-5554
          TDF_INTERACTION_NATIVE_APP_ID: com.tdf.records
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          cores: 2
          ram-size: 2048M
          profile: pixel_6
          disable-animations: true
          script: |
            adb install "$(find artifacts/interaction-apk -name '*.apk' -print -quit)"
            adb reverse tcp:18128 tcp:18128
            adb shell am start -W -n com.tdf.records/.MainActivity
            bash scripts/interactions/test-http.sh || { adb logcat -b crash -d; find "$HOME/.maestro/tests" -name '*.png' -exec cp {} /tmp/ \;; exit 1; }
      - name: Retain synthetic native screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interaction-android-evidence-${{ github.sha }}
          path: |
            /tmp/tdf-interaction-native-*.png
            /tmp/screenshot-*.png
          if-no-files-found: ignore
          retention-days: 7

  quality:
    if: always()
    needs:
      - changes
      - repo-quality
      - ui-quality
      - persona-web-e2e
      - mobile-quality
      - backend-quality
      - native-android-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected quality job to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          REPO_RESULT: ${{ needs.repo-quality.result }}
          UI_RESULT: ${{ needs.ui-quality.result }}
          PERSONA_WEB_E2E_RESULT: ${{ needs.persona-web-e2e.result }}
          MOBILE_RESULT: ${{ needs.mobile-quality.result }}
          BACKEND_RESULT: ${{ needs.backend-quality.result }}
          NATIVE_ANDROID_RESULT: ${{ needs.native-android-e2e.result }}
        run: |
          for result in "$CHANGES_RESULT" "$REPO_RESULT" "$UI_RESULT" "$PERSONA_WEB_E2E_RESULT" "$MOBILE_RESULT" "$BACKEND_RESULT" "$NATIVE_ANDROID_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Selected quality job did not pass: $result" >&2; exit 1 ;;
            esac
          done

  api-contract-tests:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    env:
      REQUIRE_MOBILE_WORKSPACE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # Opt in to mobile; web hosts use .gitmodules' update=none default.
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: submodule.tdf-mobile.update
          GIT_CONFIG_VALUE_0: checkout
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm --prefix tdf-mobile ci

      - name: Regenerate shared API clients
        run: npm run generate:api

      - name: Verify generated clients are committed
        run: git diff --exit-code -- tdf-hq-ui/src/api/generated/types.ts tdf-mobile/src/api/generated/types.ts

  api-contracts:
    if: always()
    needs:
      - changes
      - api-contract-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require API contract validation when selected
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CONTRACT_RESULT: ${{ needs.api-contract-tests.result }}
        run: |
          test "$CHANGES_RESULT" = success
          case "$CONTRACT_RESULT" in success|skipped) ;; *) exit 1 ;; esac

  migration-tests:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: tdf_hq_migration_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tdf_hq_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:5432/tdf_hq_migration_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test the production release contract
        run: npm run test:production-release

      - name: Rehearse access-request notification compatibility migration
        run: npm run test:access-request-notification-migration

      - name: Rehearse notification navigation and history-preserving rollback
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: sh scripts/test-notification-navigation-migration.sh

      - name: Rehearse Party selector rate-limit scope migration
        run: npm run test:party-selector-rate-limit-migration

      - name: Rehearse the studio internship audit migration and rollback
        run: sh scripts/test-studio-internship-audit-migration.sh

      - name: Rehearse service-storefront checkout runtime migration
        run: ./scripts/test-service-storefront-checkout-runtime-migration.sh

      - name: Rehearse checkout event and refund runtime migration
        run: ./scripts/test-checkout-event-refund-runtime-migration.sh

      - name: Rehearse provider event operations migration
        run: ./scripts/test-provider-event-operations-migration.sh

      - name: Rehearse provider execution and reconciliation migration
        run: ./scripts/test-provider-execution-runtime-migration.sh

      - name: Rehearse contextual reputation staging worker migration
        run: ./scripts/test-contextual-reputation-worker-migration.sh

      - name: Rehearse merch reputation migration with synthetic evidence
        run: ./scripts/test-merch-reputation-migration.sh

      - name: Rehearse merch checkout expiry and storefront migration
        run: ./scripts/test-artist-merch-storefronts-migration.sh

      - name: Rehearse service booking checkout runtime migration
        run: ./scripts/test-service-booking-checkout-runtime-migration.sh

      - name: Rehearse public tentative booking idempotency migration
        run: ./scripts/test-public-booking-tentative-idempotency-migration.sh

      - name: Rehearse course checkout runtime migration
        run: ./scripts/test-course-checkout-runtime-migration.sh

      - name: Rehearse Domo quote and deposit checkout runtime migration
        run: ./scripts/test-domo-quote-checkout-runtime-migration.sh

      - name: Rehearse marketplace customer operations and deposit settlement migration
        run: ./scripts/test-marketplace-operations-migration.sh

      - name: Rehearse verified experience review migration
        run: sh ./scripts/test-verified-experience-reviews-migration.sh

      - name: Verify public ticket checkout policy limits and rollback
        env:
          TDF_TICKET_PGURL: postgresql://postgres:postgres@127.0.0.1:5432/tdf_public_ticket_checkout_test
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE tdf_public_ticket_checkout_test'
          npm run test:public-ticket-checkout-migration

      - name: Create production baseline fixture
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/__tests__/fixtures/production-schema-20260814.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/__tests__/fixtures/catalog-production-source-fixture.sql

      - name: Verify pristine production preflight
        run: |
          node scripts/render-production-schema-preflight.mjs | psql "$PGURL" -v ON_ERROR_STOP=1
          security_report="$(psql "$PGURL" -X -qAt -v ON_ERROR_STOP=1 -f tdf-hq/sql/preflight_security_emergency_readiness.sql)"
          node -e 'const report=JSON.parse(process.argv[1]); if (report.schemaMode!=="legacy" || !report.preMigrationReady || report.authenticatableParties!==2) process.exit(1)' "$security_report"

      - name: Apply the authoritative migration batch twice
        env:
          SOURCE_COMMIT: '0000000000000000000000000000000000000000'
        run: |
          node scripts/render-production-migration-batch.mjs | psql "$PGURL" -v ON_ERROR_STOP=1
          node scripts/render-production-migration-batch.mjs | psql "$PGURL" -v ON_ERROR_STOP=1
          expected_migrations="$(node -p "require('./scripts/production-migrations.json').migrations.length")"
          test "$(psql "$PGURL" -Atqc 'SELECT COUNT(*) FROM public.tdf_schema_migration')" = "$expected_migrations"
          security_report="$(psql "$PGURL" -X -qAt -v ON_ERROR_STOP=1 -f tdf-hq/sql/preflight_security_emergency_readiness.sql)"
          node -e 'const report=JSON.parse(process.argv[1]); if (report.schemaMode!=="canonical" || !report.databaseReady || report.databaseCoherentPaths!==2) process.exit(1)' "$security_report"

      - name: Verify catalog dry-runs and raw cutover idempotency
        env:
          TDF_CATALOG_TEST_DATABASE_URL: ${{ env.PGURL }}
          TDF_CATALOG_TEST_REVISION: catalog-ci-idempotency-v1
        run: scripts/test-catalog-production-cutover.sh

      - name: Verify raw migration idempotency and the release schema contract
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -f tdf-hq/sql/2026-07-12_ticketing_runtime_schema.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f tdf-hq/sql/2026-07-12_ticket_checkout_idempotency.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f tdf-hq/sql/2026-07-12_event_discovery_imports.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f tdf-hq/sql/2026-07-15_social_sync_runtime_schema.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f tdf-hq/sql/2026-07-15_social_discovery_reviews.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f tdf-hq/sql/2026-07-29_campaign_automation.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f tdf-hq/sql/2026-08-02_ddex_catalog_core.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f tdf-hq/sql/2026-08-06_feature_access_requests.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f tdf-hq/sql/2026-08-06_feature_navigation_preferences.sql
          node scripts/render-production-schema-verification.mjs | psql "$PGURL" -v ON_ERROR_STOP=1
          node scripts/render-production-schema-preflight.mjs | psql "$PGURL" -v ON_ERROR_STOP=1

      - name: Reject a changed applied migration
        env:
          SOURCE_COMMIT: '0000000000000000000000000000000000000000'
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -c "UPDATE public.tdf_schema_migration SET checksum = repeat('f', 64) WHERE migration_id = '2026-07-12_ticketing_runtime_schema'"
          if node scripts/render-production-migration-batch.mjs | psql "$PGURL" -v ON_ERROR_STOP=1; then
            echo "checksum mismatch was accepted" >&2
            exit 1
          fi

      - name: Verify artist enrichment migration rollback preserves base profiles
        env:
          PGROLLBACK: postgresql://postgres:postgres@127.0.0.1:5432/artist_enrichment_rollback_test
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE artist_enrichment_rollback_test'
          psql "$PGROLLBACK" -v ON_ERROR_STOP=1 -c 'CREATE TABLE party (id BIGSERIAL PRIMARY KEY); CREATE TABLE artist_profile (id BIGSERIAL PRIMARY KEY, artist_party_id BIGINT REFERENCES party(id), slug TEXT);'
          psql "$PGROLLBACK" -v ON_ERROR_STOP=1 -f tdf-hq/sql/2026-08-05_artist_enrichment.sql
          psql "$PGROLLBACK" -v ON_ERROR_STOP=1 -f tdf-hq/sql/2026-08-05_artist_enrichment.sql
          psql "$PGROLLBACK" -v ON_ERROR_STOP=1 -c "INSERT INTO party DEFAULT VALUES; INSERT INTO artist_profile (artist_party_id, slug) VALUES (1, 'rollback-proof');"
          psql "$PGROLLBACK" -v ON_ERROR_STOP=1 -f tdf-hq/sql/2026-08-05_artist_enrichment_rollback.sql
          test "$(psql "$PGROLLBACK" -Atqc "SELECT count(*) FROM artist_profile WHERE slug = 'rollback-proof'")" = '1'
          test "$(psql "$PGROLLBACK" -Atqc "SELECT count(*) FROM pg_class WHERE relnamespace = 'public'::regnamespace AND relname IN ('artist_profile_enrichment','artist_inventory_reference','artist_research_source','artist_enrichment_suggestion','artist_field_change','artist_enrichment_run','artist_identity_candidate','artist_media_asset')")" = '0'

  production-migrations:
    if: always()
    needs:
      - changes
      - migration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require production migration validation when selected
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          MIGRATION_RESULT: ${{ needs.migration-tests.result }}
        run: |
          test "$CHANGES_RESULT" = success
          case "$MIGRATION_RESULT" in success|skipped) ;; *) exit 1 ;; esac
