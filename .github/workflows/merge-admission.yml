name: Main integration admission

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed, edited]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

# Development and CI remain parallel. Only this metadata controller is serial.
concurrency:
  group: protected-main-integration-admission
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # pull_request_target must never execute source from the PR head.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Admit one PR without changing reviews or quality checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/merge-admission.py --apply
