name: Refresh Instagram Token
run-name: "Instagram lifecycle: ${{ inputs.action || 'check' }}"

permissions:
  contents: read
  actions: read

concurrency:
  group: instagram-token-lifecycle
  cancel-in-progress: false

on:
  schedule:
    # Existing schedule: read-only checks on the 1st and (when present) 31st.
    - cron: '0 3 */30 * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'check'
        type: choice
        options:
          - check
          - refresh
          - setup

jobs:
  refresh-token:
    runs-on: ubuntu-latest
    steps:
      - name: Check notification configuration
        id: notification-config
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Resolve latest lifecycle checkpoint
        if: inputs.action != 'setup'
        id: lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/instagram-lifecycle-artifact.mjs

      - name: Download encrypted lifecycle checkpoint
        if: inputs.action != 'setup'
        uses: actions/download-artifact@v8
        with:
          name: instagram-lifecycle-v1
          run-id: ${{ steps.lifecycle.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/instagram-lifecycle/input

      - name: Bootstrap from approved OAuth authorization
        if: inputs.action == 'setup'
        env:
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          INSTAGRAM_AUTHORIZATION_CODE: ${{ secrets.INSTAGRAM_AUTHORIZATION_CODE }}
          INSTAGRAM_REDIRECT_URI: ${{ vars.INSTAGRAM_REDIRECT_URI }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          INSTAGRAM_LIFECYCLE_OUTPUT_FILE: ${{ runner.temp }}/instagram-lifecycle/output/state.enc.json
        run: node scripts/refresh-instagram-token.mjs --setup

      - name: Check/Refresh Token
        if: inputs.action != 'setup'
        env:
          ACTION: ${{ inputs.action || 'check' }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          INSTAGRAM_LIFECYCLE_STATE_FILE: ${{ runner.temp }}/instagram-lifecycle/input/state.enc.json
          INSTAGRAM_LIFECYCLE_OUTPUT_FILE: ${{ runner.temp }}/instagram-lifecycle/output/state.enc.json
        run: |
          node scripts/refresh-instagram-token.mjs "--$ACTION"

      - name: Persist authenticated encrypted lifecycle checkpoint
        if: inputs.action == 'setup' || inputs.action == 'refresh'
        uses: actions/upload-artifact@v7
        with:
          name: instagram-lifecycle-v1
          path: ${{ runner.temp }}/instagram-lifecycle/output/state.enc.json
          if-no-files-found: error
          retention-days: 90

      - name: Notify on Failure
        if: failure() && steps.notification-config.outputs.enabled == 'true'
        uses: slackapi/slack-github-action@v1.24.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          payload: |
            {
              "text": "⚠️ Instagram token refresh failed! Manual intervention required."
            }

      - name: Report unavailable failure notification
        if: failure() && steps.notification-config.outputs.enabled == 'false'
        run: echo "::warning::SLACK_WEBHOOK_URL is not configured; workflow failure was not sent to Slack."
