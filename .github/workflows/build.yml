name: Build Image

on:
  push:
    branches:
      - main
    paths:
      - 'tdf-hq/**'
      - '.dockerignore'
      - '.github/workflows/build.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      image_repo:
        description: Docker image repository override
        required: false
        type: string
      image_tag:
        description: Docker image tag override
        required: false
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

env:
  DOCKER_IMAGE_REPO: ${{ inputs.image_repo || github.event.inputs.image_repo || 'diegueins680/tdf-hq' }}
  DOCKER_IMAGE_TAG: ${{ inputs.image_tag || github.event.inputs.image_tag || github.sha }}

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-tests:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      force_backend: true
      publish_backend_artifact: true

  docker:
    needs: [required-tests, legacy-shutdown-counterexample]
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.image-build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download tested backend executable
        uses: actions/download-artifact@v8
        with:
          name: tdf-hq-binary-${{ github.sha }}
          path: tdf-hq/.release

      - name: Verify backend artifact
        run: |
          test -s tdf-hq/.release/tdf-hq-exe
          chmod +x tdf-hq/.release/tdf-hq-exe

      - name: Resolve image build metadata
        id: image-metadata
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          commit_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          [[ "$commit_epoch" =~ ^[0-9]+$ ]]
          build_time="$(node -p "new Date(Number(process.argv[1]) * 1000).toISOString().replace('.000Z', 'Z')" "$commit_epoch")"
          [[ "$build_time" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          printf 'build_time=%s\n' "$build_time" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: image-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./tdf-hq/Dockerfile.runtime
          push: true
          cache-from: type=gha,scope=tdf-hq-backend
          cache-to: type=gha,mode=max,scope=tdf-hq-backend
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.image-metadata.outputs.build_time }}
          tags: |
            ${{ env.DOCKER_IMAGE_REPO }}:${{ env.DOCKER_IMAGE_TAG }}

      - name: Verify cold recovery and isolated application together
        timeout-minutes: 12
        env:
          TDF_CANARY_TEST_IMAGE: ${{ env.DOCKER_IMAGE_REPO }}@${{ steps.image-build.outputs.digest }}
          TDF_CANARY_TEST_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          tdf_physical_image='pgvector/pgvector@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21'
          docker pull "$tdf_physical_image"
          docker pull "$TDF_CANARY_TEST_IMAGE"
          sudo install -d -m 700 /opt/tdf/backups
          sudo env PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-recovered-application-content.py
          sudo env PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-coordinated-capture.py
          sudo install -d -m 700 /opt/tdf/recovery-test-tools
          sudo python3 scripts/install-recovery-tools.py --destination /opt/tdf/recovery-test-tools/age
          sudo env TDF_RECOVERY_TOOLS=/opt/tdf/recovery-test-tools/age PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-coordinated-encryption.py
          sudo env TDF_RECOVERY_TOOLS=/opt/tdf/recovery-test-tools/age PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-coordinated-retrieval.py
          sudo env TDF_PHYSICAL_TEST_IMAGE="$tdf_physical_image" \
            TDF_CANARY_TEST_IMAGE="$TDF_CANARY_TEST_IMAGE" \
            TDF_CANARY_TEST_REVISION="$TDF_CANARY_TEST_REVISION" \
            PYTHONDONTWRITEBYTECODE=1 \
            timeout --signal=TERM --kill-after=15 660 \
            python3 scripts/test-physical-application-docker.py

  original-recovery:
    name: Original database, API and TLS edge recovery
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Exercise original runtime recovery on an empty owned runner
        env:
          TDF_CANARY_TEST_IMAGE: ${{ env.DOCKER_IMAGE_REPO }}@${{ needs.docker.outputs.image_digest }}
        run: |
          set -euo pipefail
          tdf_physical_image='pgvector/pgvector@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21'
          docker pull "$tdf_physical_image"
          docker pull "$TDF_CANARY_TEST_IMAGE"
          docker pull caddy@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
          test -z "$(docker ps --all --quiet)"
          sudo install -d -m 700 /opt/tdf/backups
          SOURCE_COMMIT="$GITHUB_SHA" node scripts/render-production-migration-batch.mjs > synthetic-fixture-migrations.sql
          sudo env TDF_SYNTHETIC_WRITER_FENCE_HOST="$(cat /etc/machine-id)" \
            TDF_PHYSICAL_TEST_IMAGE="$tdf_physical_image" \
            TDF_CANARY_TEST_IMAGE="$TDF_CANARY_TEST_IMAGE" \
            TDF_TEST_ORIGINAL_DB_RECOVERY=1 TDF_TEST_ORIGINAL_APPLICATION_RECOVERY=1 TDF_TEST_ORIGINAL_EDGE_RECOVERY=1 TDF_TEST_ORIGINAL_TIMER_RECOVERY=1 TDF_TEST_ORIGINAL_RECOVERY_COMPLETION=1 \
            TDF_TEST_DISPOSABLE_ABORT_RECOVERY=1 \
            TDF_TEST_REQUIRE_CLEAN_APPLICATION_STOP=1 \
            PYTHONDONTWRITEBYTECODE=1 \
            timeout --signal=TERM --kill-after=15 660 \
            python3 scripts/test-production-writer-fence-linux.py

  legacy-shutdown-counterexample:
    name: Reject interrupted legacy application capture
    needs: required-tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Observe interrupted HTTP mutation on the pinned legacy image
        run: |
          set -euo pipefail
          tdf_physical_image='pgvector/pgvector@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21'
          tdf_legacy_image='diegueins680/tdf-hq@sha256:38e6264b82db2d81a5b51c3a78740b6a305538b4cdae8d53ced067ccbb1e8fe0'
          docker pull "$tdf_physical_image"
          docker pull "$tdf_legacy_image"
          test -z "$(docker ps --all --quiet)"
          sudo install -d -m 700 /opt/tdf/backups
          SOURCE_COMMIT="$GITHUB_SHA" node scripts/render-production-migration-batch.mjs > synthetic-fixture-migrations.sql
          sudo env TDF_SYNTHETIC_WRITER_FENCE_HOST="$(cat /etc/machine-id)" \
            TDF_PHYSICAL_TEST_IMAGE="$tdf_physical_image" TDF_CANARY_TEST_IMAGE="$tdf_legacy_image" \
            TDF_TEST_ORIGINAL_DB_RECOVERY=1 TDF_TEST_ORIGINAL_APPLICATION_RECOVERY=1 \
            PYTHONDONTWRITEBYTECODE=1 \
            timeout --signal=TERM --kill-after=15 660 \
            python3 scripts/test-legacy-shutdown-linux.py
