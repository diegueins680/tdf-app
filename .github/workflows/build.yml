name: Build Image

on:
  push:
    branches:
      - main
    paths:
      - 'tdf-hq/**'
      - '.dockerignore'
      - '.github/workflows/build.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      image_repo:
        description: Docker image repository override
        required: false
        type: string
      image_tag:
        description: Docker image tag override
        required: false
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

env:
  DOCKER_IMAGE_REPO: ${{ inputs.image_repo || 'diegueins680/tdf-hq' }}
  DOCKER_IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-tests:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      force_backend: true
      publish_backend_artifact: true

  docker:
    outputs:
      digest: ${{ steps.image-build.outputs.digest }}
    needs: required-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download tested backend executable
        uses: actions/download-artifact@v8
        with:
          name: tdf-hq-binary-${{ github.sha }}
          path: tdf-hq/.release

      - name: Verify backend artifact
        run: |
          test -s tdf-hq/.release/tdf-hq-exe
          chmod +x tdf-hq/.release/tdf-hq-exe

      - name: Resolve image build metadata
        id: image-metadata
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          commit_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          [[ "$commit_epoch" =~ ^[0-9]+$ ]]
          build_time="$(node -p "new Date(Number(process.argv[1]) * 1000).toISOString().replace('.000Z', 'Z')" "$commit_epoch")"
          [[ "$build_time" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          printf 'build_time=%s\n' "$build_time" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: image-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./tdf-hq/Dockerfile.runtime
          push: true
          cache-from: type=gha,scope=tdf-hq-backend
          cache-to: type=gha,mode=max,scope=tdf-hq-backend
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.image-metadata.outputs.build_time }}
          tags: |
            ${{ env.DOCKER_IMAGE_REPO }}:${{ env.DOCKER_IMAGE_TAG }}

  qualify-image-shutdown:
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Download the exact tested executable
        uses: actions/download-artifact@v8
        with:
          name: tdf-hq-binary-${{ github.sha }}
          path: tdf-hq/.release
      - name: Check isolated fixture admission and negative controls
        run: |
          python3 scripts/test-current-image-shutdown.py
          python3 scripts/test-candidate-image-shutdown.py
      - name: Qualify immutable image on synthetic isolated resources
        env:
          IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="$DOCKER_IMAGE_REPO@$IMAGE_DIGEST"
          docker pull "$image"
          docker pull pgvector/pgvector@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
          mkdir -m700 "$RUNNER_TEMP/candidate-image-shutdown"
          python3 scripts/qualify-candidate-image-shutdown.py "$image" "$GITHUB_SHA" tdf-hq/.release/tdf-hq-exe "$RUNNER_TEMP/candidate-image-shutdown"
      - name: Retain candidate qualification, including failed observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-image-shutdown-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-image-shutdown
          if-no-files-found: ignore
