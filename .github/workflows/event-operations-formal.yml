name: Event operations verification

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: event-operations-formal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specification-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: submodule.tdf-mobile.update
          GIT_CONFIG_VALUE_0: checkout
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Initialize arithmetic execution receipt
        run: |
          mkdir "${{ runner.temp }}/payment-proof"
          printf '%s\n' '{"status":"not-executed","reason":"Prerequisite checks or installation have not completed"}' > "${{ runner.temp }}/payment-proof/result.json"
      - name: Check specification inventory and evidence admission
        run: |
          python -m pip install -r formal/system/requirements-verification.txt
          python scripts/specification-inventory.py --check
          python scripts/test-specification-inventory.py
          python scripts/test-requirement-declarations.py
          python scripts/specification-conformance.py --check
          python scripts/test-specification-conformance.py
          python scripts/check-public-routes.py
          python scripts/test-public-routes.py
          python scripts/check-state-machines.py --static
          python scripts/test-state-machines.py --static
          node --test scripts/__tests__/verification-evidence.test.mjs scripts/__tests__/legacy-escrow-contract.test.mjs
      - name: Verify actual payment arithmetic and negative controls
        run: |
          python scripts/verify-payment-arithmetic.py > "${{ runner.temp }}/payment-proof/solver-output.json"
          mv "${{ runner.temp }}/payment-proof/solver-output.json" "${{ runner.temp }}/payment-proof/result.json"
          python scripts/test-payment-arithmetic-verifier.py
      - name: Preserve solver result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: payment-proof-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/payment-proof
          if-no-files-found: error

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify completion client model wiring
        run: node --test scripts/__tests__/event-task-completion-client.test.mjs

      - name: Download pinned formal tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tdf-formal-tools"
          curl --fail --location --retry 3 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.2/tla2tools.jar \
            --output "${RUNNER_TEMP}/tdf-formal-tools/tla2tools-1.7.2.jar"
          curl --fail --location --retry 3 \
            https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar \
            --output "${RUNNER_TEMP}/tdf-formal-tools/alloy-6.2.0.jar"

      - name: Check event operations models
        env:
          TLA2TOOLS_JAR: ${{ runner.temp }}/tdf-formal-tools/tla2tools-1.7.2.jar
          ALLOY_JAR: ${{ runner.temp }}/tdf-formal-tools/alloy-6.2.0.jar
        run: node scripts/verify-system-evidence.mjs --output "${{ runner.temp }}/formal-evidence"

      - name: Preserve verification evidence, including failed executions
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: formal-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/formal-evidence
          if-no-files-found: error

      - name: Verify editor guard and isolated browser configuration
        run: node --test scripts/__tests__/event-raci-web-editor.test.mjs

  postgres-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check event operations foundation migration
        run: npm run test:event-operations-foundation-migration

  postgres-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check event operations API migration
        run: npm run test:event-operations-api-migration

  postgres-task-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check task commit constraints and concurrent writers
        run: npm run test:event-task-commit-migration

  postgres-task-read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check scoped task projection and concurrent authorization
        run: npm run test:event-task-read-migration

  postgres-task-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check revision runner isolation and mandatory verification
        run: node --test scripts/__tests__/event-task-revision-runner.test.mjs
      - name: Check aggregate task revisions and concurrent commands
        run: sh scripts/test-event-task-revision-migration.sh

  postgres-task-revisioned-read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check revisioned reader test isolation and prerequisite ordering
        run: node --test scripts/__tests__/event-task-revisioned-read-runner.test.mjs
      - name: Check task revision snapshots, expiry and concurrent writers
        run: sh scripts/test-event-task-revisioned-read-migration.sh

  postgres-raci-reassignment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check RACI command runner isolation and formal gates
        run: node --test scripts/__tests__/event-raci-reassignment-runner.test.mjs
      - name: Check atomic reassignment, retries, rollback and concurrent authority
        run: sh scripts/test-event-raci-reassignment-migration.sh

  postgres-raci-editor-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify editor context isolation and formal gates
        run: node --test scripts/__tests__/event-raci-editor-context-runner.test.mjs
      - name: Verify editor context scope, pagination, rollback and concurrent readers
        run: sh scripts/test-event-raci-editor-context-migration.sh

  postgres-task-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify completion runner isolation and formal gates
        run: node --test scripts/__tests__/event-task-completion-runner.test.mjs
      - name: Verify completion guards, rollback and concurrent writers
        run: sh scripts/test-event-task-completion-migration.sh

  postgres-complete-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check rehearsal isolation and authoritative default
        run: npm run test:event-operations-schema-runner
      - name: Rehearse event migration chain against the complete repository schema
        run: npm run test:event-operations-schema-rehearsal
