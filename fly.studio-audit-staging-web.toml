app = "tdf-studio-audit-staging-web"
primary_region = "gru"

[build]
  dockerfile = "tdf-hq-ui/Dockerfile.staging"

  [build.args]
    VITE_API_BASE = "https://tdf-hq-studio-audit-staging.fly.dev"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_start_machines = true
  auto_stop_machines = true
  min_machines_running = 0

  [services.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 40

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/health"
    protocol = "http"

[deploy]
  strategy = "rolling"
  max_unavailable = 1
