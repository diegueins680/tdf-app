                - /url: /raulmolina/p/DbHb5gXFZrF/
                - 'img "Quise hacer un disco al Guayaquil del domingo por la tarde. A esa ciudad que todos amamos pero nos cuesta regresar. A los recuerdos de días mejores y a la suerte de llevar esa bandera en mi música. En el 2021 viviendo en la yoni llega a mí la siguiente pregunta, como un empujón para vencer el reto: ¿Cómo les explico a los gringos que vengo de Guayaquil? 5 años más tarde, la respuesta. La portada tuvo colaboraciones maravillosas de @nunezdelarco y el lienzo que es la foto de @richiboq que sin saber que existía, era la imagen que viene a mi cabeza al terminar la grabación del disco. Esta va por ti Guayaquil. Disponible en todas las plataformas @creatividad_ec" [ref=f132e936]'
