                      - generic [ref=e412]:
                        - paragraph [ref=e676]: Continúa automáticamente la campaña «Tu Escena Conectada» de TDF Records todos los días. Inicia a las 08:00 America/Guayaquil, incluidos domingos, sin fecha de fin. Reporta en español.
                        - paragraph [ref=e677]: "AUTORIZACIÓN VIGENTE DE DIEGO: el 6/oct autorizó nuevas invitaciones diarias sin aprobar lote por lote; el 8/oct autorizó la plantilla «historial» para relaciones anteriores; el 10/oct aclaró que el máximo son 20 PERFILES, no 20 mensajes; el 12/oct eliminó la línea «Si no te interesa…»; el 14/oct reiteró «Continue with the \"Tu Escena Conectada\" campaign automatically every day» y amplió el cierre finalmente a 23:00. Estas instrucciones sustituyen los límites y prohibiciones de nuevos destinatarios del piloto del 4/oct y los seguimientos vencidos del 5–7/oct. No reutilices aprobaciones, precios ni eventos antiguos."
                        - paragraph [ref=e678]: "VENTANA Y CUPO: enviar solo entre 08:00 y 23:00 America/Guayaquil. Objetivo al menos 10 perfiles elegibles/día y hasta 20 cuando haya candidatos verificados y acceso disponible. Máximo 20 perfiles únicos contactados por día local, sumando canales y operadores. Una invitación o plantilla historial consume cupo por perfil; ayuda de registro y respuesta de seguimiento dentro de un hilo ya abierto no consume cupo. Antes de actuar cuenta los envíos ya realizados hoy. No reinicies cupo al reanudar ni repitas invitaciones de días anteriores. Si faltan candidatos o tiempo, informa el déficit sin relajar los filtros."
                        - paragraph [ref=e679]:
                          - text: "ACCESO: verifica navegador autorizado autenticado como @tdf.records.label y CRM"
                          - link [ref=e680] [cursor=pointer]:
                            - /url: https://www.tdfrecords.net/crm/contactos
                            - generic [ref=e681]: https://www.tdfrecords.net/crm/contactos
                          - text: . Una ejecución cloud no debe asumir acceso al navegador local o al repositorio. Si faltan sesión, herramientas, CRM o historial suficiente, detén la operación afectada y reporta claramente el bloqueo; no declares envíos ni capacidad autónoma no comprobados, no solicites contraseñas/códigos ni eludas rechazos. Cada revisión y envío de Instagram se realiza individualmente por su interfaz visible; no usar APIs privadas de Instagram, bots externos ni envíos masivos. Evita operadores simultáneos. Si un perfil de navegador está ocupado por otra sesión, no interrumpas trabajo ajeno sin comprobar su estado.
                        - paragraph [ref=e683]: "FUENTES: si están disponibles, lee instrucciones de /Users/diegosaa/GitHub/tdf-app, MEMORY.md, memoria reciente y docs/campaigns/tu-escena-conectada-revision-2026-09-30.md. Sin repo, usa estas reglas y comprueba CRM/hilos vivos; los datos de este prompt son antecedentes, no sustituyen las comprobaciones actuales. Respeta instrucciones posteriores verificadas de Diego."
                        - paragraph [ref=e684]: "ORDEN DIARIO:"
                        - list [ref=e414]:
                          - listitem [ref=e415]: Revisar respuestas de campaña. Contestar ayuda básica de registro/perfil/primera acción con producto verificado. Precios, condiciones, visitas, booking, alianzas o reclamos sensibles se escalan a Diego, sin ofrecer compromisos.
                          - listitem [ref=e423]: Revisar CRM y registro del día; normalizar handles quitando @, espacios y mayúsculas. Coincidencia EXACTA en campo instagram; no excluir por parecido de nombre. Si tiene cuenta, omitir nueva invitación; si existe sin cuenta, conservar su ficha y notas. Comprobar paginación y no tratar una respuesta truncada como base completa.
                          - listitem [ref=e685]: "Seleccionar seguidores/interacciones pertinentes a música y la comunidad de TDF, priorizando vínculo local verificable. Leer perfil e hilo, comprobar identidad, pertinencia y ausencia de dudas de edad. Excluir menores/edad incierta, falsos o datos insuficientes. No inferir idioma por nombre, nacionalidad o apariencia: usar idioma declarado o demostrado en contenido propio/respuestas; si falta, dejar pendiente. No aceptar solicitudes de mensaje pendientes automáticamente."
                          - listitem [ref=e686]: "Deduplicar documentos/CRM/hilo antes de cada envío. Si ya recibió invitación de campaña, no repetir. Historial anterior ajeno a la campaña NO excluye automáticamente: usar plantilla historial cuando corresponda. Rechazo/no-contacto: exclusión permanente, sin más promoción. No enviar recordatorios nuevos por una aprobación histórica vencida."
                          - listitem [ref=e687]: "Preparar texto personalizado fiel a evidencia, comprobar destinatario, idioma, enlaces, texto exacto y guiones bajos antes del envío. Después comprobar el panel de ese hilo, no la vista previa de la bandeja: un único mensaje visible, compositor vacío y ausencia de fallo o estado Sending. Un resultado incierto se comprueba antes de cualquier reintento; no repetir a ciegas."
                          - listitem [ref=e688]: "Solo tras envío confirmado, crear/actualizar CRM y añadir nota fechada sin sobrescribir: handle, nombre público, segmento/plantilla, hora Ecuador, campaña, mensaje exacto, estado y evidencia mínima. No copiar cédulas, teléfonos, correos u otros datos privados de conversaciones antiguas. No crear cuentas por los destinatarios. Si usas el endpoint CRM con Idempotency-Key, usa 16–128 letras ASCII, dígitos, guiones o guiones bajos; los puntos del handle no son válidos en esa cabecera."
                          - listitem [ref=e689]: Registrar cierre diario, total de perfiles y respuestas de ayuda por separado, pendientes y bloqueos. Distinguir envío visible, lectura, interés, registro, perfil completo y activación; nunca inferir conversiones, clics o métricas.
                        - paragraph [ref=e690]: "PLANTILLAS: mantener saludo con nombre público y referencia cierta al trabajo observado; personalizar solo hechos comprobados. Nuevas invitaciones: 4 líneas, con enlace en la última y cierre «— TDF Records». NO incluir «Si no te interesa…» ni variantes. Para DJ: «Tu escena necesita un espacio propio: queremos que las conexiones de la pista también tengan continuidad fuera de ella.» + «En TDF puedes explorar perfiles y seguir artistas para volver a su música; este enlace abre el registro con intención profesional:». Para músicos: «Tu escena necesita un espacio propio, con lugar para los cruces entre instrumentos y géneros.» + invitar a explorar artistas/lanzamientos y abrir cuenta general. Artistas/bandas: invitar a crear perfil con bio/enlaces y explorar otros proyectos. Fans: descubrir y seguir perfiles. Aliados: explorar y comentar qué les serviría; una conversación inicial no es una alianza acordada. Adaptar plural e idioma demostrado sin cambiar los destinos técnicos."
                        - paragraph [ref=e691]: "HISTORIAL (5 líneas, adaptar nombre/plural/idioma):Hola, [nombre] 👋 Te escribimos de TDF Records.Estamos abriendo la plataforma de TDF para la escena: perfiles de artistas, lanzamientos y nuestra app móvil.¿Nos ayudas a probarla? Abre tu cuenta aquí: [registro general, utm_content=historial_cuenta]Y consulta cómo probar la app móvil aquí: [enlace /app, utm_content=historial_app]Cualquier comentario nos sirve muchísimo. — TDF Records"
                        - paragraph [ref=e692]:
                          - text: "ENLACES: solo"
                          - link [ref=e693] [cursor=pointer]:
                            - /url: https://www.tdfrecords.net
                            - generic [ref=e694]: https://www.tdfrecords.net
                          - text: ", destinos comprobados y UTM sin handles, nombres, correos, IDs personales ni referidos. Rechazar borradores con pages.dev. No invitar a eventos pasados ni prometer funciones, permisos automáticos o disponibilidad no comprobados. Explicar acceso móvil desde /app antes de promover instalación.Todos llevan utm_source=instagram&utm_medium=dm&utm_campaign=tu_escena_conectada_piloto.Artista: /login?signup=1&intent=artist_profile&roles=Artista&redirect=%2Fmi-artista&utm_source=instagram&utm_medium=dm&utm_campaign=tu_escena_conectada_piloto&utm_content=artista_aDJ: /login?signup=1&intent=professional_tools&roles=DJ&redirect=%2Ffans&utm_source=instagram&utm_medium=dm&utm_campaign=tu_escena_conectada_piloto&utm_content=dj_productor_aMúsico general: /login?signup=1&redirect=%2Ffans&utm_source=instagram&utm_medium=dm&utm_campaign=tu_escena_conectada_piloto&utm_content=musico_aFan: /login?signup=1&intent=follow_artists&roles=Fan&redirect=%2Ffans&utm_source=instagram&utm_medium=dm&utm_campaign=tu_escena_conectada_piloto&utm_content=fan_aAliado: /login?signup=1&redirect=%2Ffans&utm_source=instagram&utm_medium=dm&utm_campaign=tu_escena_conectada_piloto&utm_content=aliado_aHistorial cuenta: /login?signup=1&redirect=%2Ffans&utm_source=instagram&utm_medium=dm&utm_campaign=tu_escena_conectada_piloto&utm_content=historial_cuentaHistorial app: /app?utm_source=instagram&utm_medium=dm&utm_campaign=tu_escena_conectada_piloto&utm_content=historial_app"
                        - paragraph [ref=e696]: "ESTADO CONFIRMADO 14/oct/2026 22:51 Ecuador: diez perfiles contactados en la continuación local, todos verificados en hilo y CRM: djfaricho (301), djchristianleft (303), siniestrodj (304), mcbreker (305), metal.01.dj (306), dj_cristian.viveros (307), djcesargarcia23 (308), nax.dj.ec (309), djbrooww_ec (310), dj.luxopunk (311). Ayuda a djgavez (302), sin consumir cupo. No repetirlos. Último CRM304 contactos completos; verificar dato vivo antes de operar. MAEZ/daddymaez tiene solicitud pendiente, no aceptada; k_dj_project y dj_zyborg aún requieren más revisión. Los lotes previos del 12 y 13/oct también fueron enviados: revisar documento/CRM/hilos, no suponer pendientes. El Reel del piloto ya está publicado: no republicar. Estado del acceso cloud aún sin prueba de ejecución; si no dispone de navegador autenticado/CRM, reportar bloqueo sin enviar."
