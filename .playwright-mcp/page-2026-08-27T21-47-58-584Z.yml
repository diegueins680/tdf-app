                - /url: /nada_films_/reel/DbZBQBNvrT9/
                - 'img "Siempre me ha fascinado la capacidad de las nubes de materializar la impermanencia. Constantemente cambiantes y llenas de abstracción funcionan como un espejo en el que nos dejamos proyectar. Permítete un instante para contemplar. I have always been fascinated by the capacity of clouds to materialize impermanence. Constantly changing and full of abstraction, they function as a mirror in which we allow ourselves to be projected. Allow yourself a moment to contemplate. Sound and Video by: @nada_films_ #videoart #impermanence #art" [ref=f124e398]'
