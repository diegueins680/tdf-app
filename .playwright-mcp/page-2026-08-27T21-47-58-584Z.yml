                - /url: /nada_films_/reel/DT0BT-mjYNi/
                - 'img "Hoy presentaré esta instalación en la sala inmersiva del IasLab en La Salle, Barcelona. Es una mezcla de artes performáticas, cine, sistemas de audio modulares, audio 360, luces LED audioreactivas y proyección holográfica diseñadas para crear una experiencia intensa Si están por BCN pásense. Muchas gracias a mis amigos y colaboradores por ayudarme a llevarla a la realidad: @miguelrodriguezrevelo @hadihopsasa @thegladscientist @sarabiotic @nancyelazzi Today I will present this installation in the immersive room at IasLab, La Salle, Barcelona. It is a blend of performing arts, cinema, modular audio systems, 360° audio, audio-reactive LED lighting, and holographic projection, designed to create an intense experience. If you’re in BCN, come by #digitalart #inmersiveexperience #inmersive #expandedcinema #modularsystem #eurorack #artstudio #theater #digitaltheatre" [ref=f124e380]'
