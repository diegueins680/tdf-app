              - link [ref=f124e420] [cursor=pointer]:
                - /url: /td_bcn/p/DUdYlFZjDJe/
                - img "Tonight, we start at midnight with @nada_films_ 🌜 His performance, Altered States Triggers uses ancient shamanic elements of sound, image, light and performance to try to create a cathartic experience in the audience. Patricio Capelo, also known as @nada_films_ , is a multidisciplinary artist and educator with a background in cinema, particularly science fiction, as well as literature and music. He has experience across both documentary and fiction, while his authorial practice as a filmmaker centers on sci-fi. His practice nowadays focuses on the creation of experiences that use sound, visuals, light, and performative triggers to induce altered states of consciousness in audiences. 🖼️ @thegladscientist + @nancyelazzi" [ref=f124e423]
