                - /url: /69segundosofficial/reel/DZfYz-uxoH2/
                - 'img "28 años de melodías hardcore se resumen en una sola noche destructiva. Este Sábado 27 de Junio, 69 Segundos se toma la @galeriaivancasanovagiler. Será nuestro único show en la ciudad antes de arrancar la gira nacional y encerrarnos en el estudio a terminar el nuevo disco. Si te lo pierdes, nos vemos en 2028. Para reventar la casa, nos acompañan desde la capital los panas de @la_bomb_ con todo el poder del skatepunk.🔥 ⚠️ CUIDADO TE QUEDAS FUERA. CAPACIDAD LIMITADA A SOLO 100 PERSONAS. Precios de Preventa Exclusiva (Solo con reserva): $15 (Hasta el miércoles 24 de junio) $20 (Jueves 25 y viernes 26 de junio) 🛑 Sábado 27: TAQUILLA CERRADA. No se venderán entradas el día del evento. No dejes que te lo cuenten. Escribe ahora mismo a @artivancasanova por interno y asegura tu preventa antes de que hagamos Sold Out. 🐜🔥👽" [ref=f52e603]'
                - generic:
                  - generic:
                    - generic:
                      - img "Clip"
            - generic [ref=f52e605]:
              - link [ref=f52e607] [cursor=pointer]:
                - /url: /69segundosofficial/reel/DZXz7u4R4AU/
                - 'img "🔥 ¡28 AÑOS DE 69 SEGUNDOS! 🔥 Amigos, los esperamos este sábado 27 de junio para celebrar junto a ustedes nuestros 28 años de vida musical. 🎸 Tocaremos más de 17 canciones recorriendo toda nuestra discografía, desde los primeros años hasta nuestros temas más recientes. Las entradas están en $15 hasta el miércoles 24 de junio. Jueves 25 y viernes 26 pasan a valer $20 y el sábado 27 de junio ya no venderemos más entradas. Capacidad limitada para 100 personas. 📩 Escríbele a @artivancasanova y asegura tu entrada de inmediato. No te quedes fuera de esta celebración. 🚨 Importante: después de este show no volveremos a tocar en Guayaquil hasta el 2028, cuando celebremos nuestros 30 años como banda. Gracias por acompañarnos durante todos estos años. Ahora nos toca celebrar juntos. ¡Nos vemos el 27 de junio! 🤘" [ref=f52e610]'
