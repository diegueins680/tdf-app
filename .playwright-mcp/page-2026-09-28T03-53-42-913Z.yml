            - generic [ref=f15e496]: Static egress IPs for Machines provide dedicated outbound IP addresses for your Machines. When you allocate a static egress IP, you’ll get both an IPv4 and IPv6 address for this single price.
            - list [ref=f15e497]:
              - listitem [ref=f15e498]: $0.005 per hour (~$3.60/month)
              - listitem [ref=f15e499]: Machines do not have a static IP by default
