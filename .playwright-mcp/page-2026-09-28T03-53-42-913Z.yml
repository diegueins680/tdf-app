              - text: is a PostgreSQL database that you create and then manage yourself. Fly Postgres clusters are Fly Apps that consist of Machines, volumes, and any configured extra memory.
            - generic [ref=f15e559]:
              - text: The
              - link "Machine price" [ref=f15e560] [cursor=pointer]:
                - /url: "#compute"
              - text: and
              - link "volume price" [ref=f15e561] [cursor=pointer]:
                - /url: "#persistent-storage-volumes"
              - text: for Fly Postgres are the same as any other Machine and volume you’d run on Fly.io. Assuming the Machines are running all the time, the cost for the preset configurations is about $2/month for a single node cluster for dev projects and from about $82 to $164/month for a three-node production cluster. You don’t need to keep the preset configurations, you can
              - link "scale your Fly Postgres Machines" [ref=f15e562] [cursor=pointer]:
