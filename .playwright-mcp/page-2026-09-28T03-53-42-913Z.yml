      - main [ref=f15e254]:
        - generic [ref=f15e255]:
          - generic [ref=f15e257]:
            - generic [ref=f15e258]: About
            - heading "Fly.io Resource Pricing" [level=1] [ref=f15e260]
          - generic [ref=f15e261]:
            - img "Illustration by Annie Ruygt of Frankie the hot air balloon demonstrating a pricing chart on a whiteboard" [ref=f15e265]
            - button "Expand image"
            - heading "Navigate to header How it works" [level=2] [ref=f15e266]:
              - link "Navigate to header" [ref=f15e267] [cursor=pointer]:
                - /url: "#how-it-works"
              - generic [ref=f15e272] [cursor=pointer]: How it works
            - generic [ref=f15e273]:
              - text: Fly.io services are billed per organization, with
              - link "Linked Organizations" [ref=f15e274] [cursor=pointer]:
                - /url: /about/billing#unified-billing
              - text: reporting resource usage to their parent Billing Organization. Plans get complicated, so we just charge based on usage. Pick and choose which pieces you need for your application; that’s all you’ll see on your invoice.
            - generic [ref=f15e275]:
              - text: Organizations are administrative entities on Fly.io that let you add members, share app development environments, and manage billing.
              - link "Billing" [ref=f15e276] [cursor=pointer]:
                - /url: /about/billing
              - text: is based on the resources provisioned for your apps, pro-rated for the time they are provisioned.
            - generic [ref=f15e277]: Organizations may be subject to automated scaling limits to prevent abuse or to help with capacity planning. Email the address in the error message if you run into such a limit and it’s getting in your way.
            - generic [ref=f15e278]:
              - text: All organizations (except for Linked Organizations) require a
              - link "credit card" [ref=f15e279] [cursor=pointer]:
                - /url: /about/billing#payment-options
              - text: on file.
            - heading "Navigate to header Compute" [level=2] [ref=f15e280]:
              - link "Navigate to header" [ref=f15e281] [cursor=pointer]:
                - /url: "#compute"
              - generic [ref=f15e286] [cursor=pointer]: Compute
            - generic [ref=f15e287]:
              - text: We charge for started and stopped Machines differently. For more details about how costs are calculated, see
              - link "Machine billing" [ref=f15e288] [cursor=pointer]:
                - /url: /about/billing#machine-billing
              - text: . To understand the difference between
              - code [ref=f15e289]: performance
              - text: and
              - code [ref=f15e290]: shared
              - text: CPU types in Machines, see
              - link "CPU performance" [ref=f15e291] [cursor=pointer]:
                - /url: /machines/cpu-performance
              - text: .
            - heading "Navigate to header Started Fly Machines" [level=3] [ref=f15e292]:
              - link "Navigate to header" [ref=f15e293] [cursor=pointer]:
                - /url: "#started-fly-machines"
              - generic [ref=f15e298] [cursor=pointer]: Started Fly Machines
            - heading "Navigate to header Stopped Fly Machines" [level=3] [ref=f15e299]:
              - link "Navigate to header" [ref=f15e300] [cursor=pointer]:
                - /url: "#stopped-fly-machines"
              - generic [ref=f15e305] [cursor=pointer]: Stopped Fly Machines
            - generic [ref=f15e306]:
              - text: For stopped Machines we charge only for the root file system (rootfs) needed for each Machine. Each 1GB of rootfs for a Machine stopped for 30 days is $0.15. The amount of rootfs needed is defined by your OCI image generated on your app plus a few
              - link "containerd" [ref=f15e307] [cursor=pointer]:
                - /url: https://containerd.io/
              - text: tweaks on the underlying file system.
            - heading "Navigate to header Machine reservation blocks" [level=3] [ref=f15e308]:
              - link "Navigate to header" [ref=f15e309] [cursor=pointer]:
                - /url: "#machine-reservation-blocks"
              - generic [ref=f15e314] [cursor=pointer]: Machine reservation blocks
            - generic [ref=f15e315]:
              - text: You’ll get a 40% discount when you reserve a block of compute time, either for
              - code [ref=f15e316]: performance
              - text: Machines or
              - code [ref=f15e317]: shared
              - text: Machines, in a specific region. Reservations apply to any number of Machines of the specified CPU class, in the specified region, in any of your organisation’s apps.
            - generic [ref=f15e318]: "The available reservation sizes are:"
            - strong [ref=f15e320]: Performance Machines
            - list [ref=f15e321]:
              - listitem [ref=f15e322]: $144/year for $20/month of usage
              - listitem [ref=f15e323]: $1,440/year for $200/month of usage
              - listitem [ref=f15e324]: $14,400/year for $2,000/month of usage
            - strong [ref=f15e326]: Shared Machines
            - list [ref=f15e327]:
              - listitem [ref=f15e328]: $36/year for $5/month of usage
              - listitem [ref=f15e329]: $360/year for $50/month of usage
              - listitem [ref=f15e330]: $3,600/year for $500/month of usage
            - generic [ref=f15e331]: You pay the “per year” amount upfront, and each month receive a credit worth the “per month” amount. The credit does not rollover; it’s only valid for the month in which it’s granted. The credit applies only to CPU and additional RAM charges.
            - generic [ref=f15e332]: There’s no limit on the number or combinations of blocks that can be purchased. Reservations are backdated to the first day of the month in which they’re purchased.
            - generic [ref=f15e333]:
              - text: For example, if you purchase a $36/year
              - code [ref=f15e334]: shared
              - text: Machines block in
              - code [ref=f15e335]: cdg
              - text: ", you’ll pay $36 upfront and receive $5/month of credits applicable to"
              - code [ref=f15e336]: shared
              - text: Machines in
              - code [ref=f15e337]: cdg
              - text: for 12 months, starting with the month of the purchase. Amortised over 12 months, the $36 upfront cost is $3/month, which is a 40% discount on the $5/month of credits you receive.
            - generic [ref=f15e338]:
              - text: You can set up reservations via self-service in the billing section of your Fly.io
              - link "dashboard" [ref=f15e339] [cursor=pointer]:
                - /url: https://fly.io/dashboard
              - text: . They apply to usage starting on the 1st, so setting up reservations any time in the month will give you the credits the entire month.
            - heading "Navigate to header Managed Postgres" [level=2] [ref=f15e340]:
              - link "Navigate to header" [ref=f15e341] [cursor=pointer]:
                - /url: "#managed-postgres"
              - generic [ref=f15e346] [cursor=pointer]: Managed Postgres
            - generic [ref=f15e347]: The price of running Fly.io Managed Postgres depends on your selected Managed Postgres Plan and the amount of storage your databases use.
            - generic [ref=f15e348]:
              - text: Current pricing for Managed Postgres plans and storage is available
              - link "here" [ref=f15e349] [cursor=pointer]:
                - /url: /postgres#pricing
              - text: .
            - note "Warning" [ref=f15e350]:
              - generic [ref=f15e355]:
                - strong [ref=f15e356]: "Important:"
                - text: Managed Postgres lives outside your apps. Deleting an app won’t delete its database. Have a look in your Dashboard when you’re cleaning up. A quick check can save you a surprise charge later.
            - heading "Navigate to header Persistent Storage Volumes" [level=2] [ref=f15e357]:
              - link "Navigate to header" [ref=f15e358] [cursor=pointer]:
                - /url: "#persistent-storage-volumes"
              - generic [ref=f15e363] [cursor=pointer]: Persistent Storage Volumes
            - heading "Navigate to header Volumes" [level=3] [ref=f15e364]:
              - link "Navigate to header" [ref=f15e365] [cursor=pointer]:
                - /url: "#volumes"
              - generic [ref=f15e370] [cursor=pointer]: Volumes
            - generic [ref=f15e371]:
              - link "Fly Volumes" [ref=f15e372] [cursor=pointer]:
                - /url: /volumes
              - text: are local persistent storage for Machines.
            - list [ref=f15e373]:
              - listitem [ref=f15e374]: $0.15/GB per month of provisioned capacity
            - generic [ref=f15e375]:
              - link "Volume billing" [ref=f15e376] [cursor=pointer]:
                - /url: /about/billing#volume-billing
              - text: is pro-rated to the hour.
            - generic [ref=f15e377]: You’ll be charged for volumes that you create, whether they are attached to a Machine or not, including when an attached Machine is stopped.
            - heading "Navigate to header Volume Snapshots" [level=3] [ref=f15e378]:
              - link "Navigate to header" [ref=f15e379] [cursor=pointer]:
                - /url: "#volume-snapshots"
              - generic [ref=f15e384] [cursor=pointer]: Volume Snapshots
            - note "Info" [ref=f15e385]:
              - generic [ref=f15e389]:
                - strong [ref=f15e391]: New charges
                - paragraph [ref=f15e392]:
                  - generic [ref=f15e393]:
                    - text: Starting January 1st 2026, we’re introducing charges for
                    - link "volume snapshot" [ref=f15e394] [cursor=pointer]:
                      - /url: /volumes/snapshots
                    - text: storage. You’ll see the first charges on the invoice issued at the start of February 2026.
                - paragraph [ref=f15e395]:
                  - generic [ref=f15e396]:
                    - text: If you’re an existing customer, you can check your usage in the
                    - strong [ref=f15e397]: Billing
                    - text: section of the
                    - link "dashboard" [ref=f15e398] [cursor=pointer]:
                      - /url: https://fly.io/dashboard/personal/billing
                    - text: on your Upcoming Invoice and in the Cost Explorer.
            - list [ref=f15e399]:
              - listitem [ref=f15e400]: $0.08/GB per month
              - listitem [ref=f15e401]: First 10GB free each month
            - generic [ref=f15e402]:
              - link "Volume Snapshot billing" [ref=f15e403] [cursor=pointer]:
                - /url: /about/billing#volume-snapshot-billing
              - text: is pro-rated to the hour.
            - generic [ref=f15e404]:
              - text: Automatic daily snapshots with 5 days retention are enabled by default on new volumes. This can be
              - link "adjusted" [ref=f15e405] [cursor=pointer]:
                - /url: /volumes/snapshots#set-or-change-the-snapshot-retention-period
              - text: or
              - link "disabled" [ref=f15e406] [cursor=pointer]:
                - /url: /volumes/snapshots#disable-automatic-daily-snapshots
              - text: .
            - generic [ref=f15e407]: Usage is calculated based on the total stored size of the snapshots, not the provisioned volume size. You’re only charged for the actual data stored - if you’ve written 1GB to a 10GB volume, you’ll be charged for around 1GB of snapshot storage.
            - generic [ref=f15e408]: Snapshots for each volume are stored incrementally, so you’ll only be charged for data that has changed since the previously stored snapshot.
            - heading "Navigate to header Network prices" [level=2] [ref=f15e409]:
              - link "Navigate to header" [ref=f15e410] [cursor=pointer]:
                - /url: "#network-prices"
              - generic [ref=f15e415] [cursor=pointer]: Network prices
            - heading "Navigate to header Anycast IP addresses" [level=3] [ref=f15e416]:
              - link "Navigate to header" [ref=f15e417] [cursor=pointer]:
                - /url: "#anycast-ip-addresses"
              - generic [ref=f15e422] [cursor=pointer]: Anycast IP addresses
            - generic [ref=f15e423]:
              - text: Each application receives a
              - link "shared IPv4 address" [ref=f15e424] [cursor=pointer]:
                - /url: /networking/services#shared-ipv4
              - text: and unlimited
              - link "Anycast IPv6" [ref=f15e425] [cursor=pointer]:
                - /url: /networking/services#ipv6
              - text: addresses for global load balancing.
            - generic [ref=f15e426]: Dedicated IPv4 addresses are $2/mo.
            - heading "Navigate to header Managed SSL certificates" [level=3] [ref=f15e427]:
              - link "Navigate to header" [ref=f15e428] [cursor=pointer]:
                - /url: "#managed-ssl-certificates"
              - generic [ref=f15e433] [cursor=pointer]: Managed SSL certificates
            - generic [ref=f15e434]: We use Let’s Encrypt to issue certificates, and donate half of our SSL fees to them at the end of each calendar year.
            - list [ref=f15e435]:
              - listitem [ref=f15e436]: "Single hostname certificates: $0.10/mo"
              - listitem [ref=f15e437]: "Wildcard certificates: $1/mo"
            - generic [ref=f15e438]: Every organization’s first 10 single hostname certificates are free.
            - heading "Navigate to header Data transfer pricing" [level=3] [ref=f15e439]:
              - link "Navigate to header" [ref=f15e440] [cursor=pointer]:
                - /url: "#data-transfer-pricing"
              - generic [ref=f15e445] [cursor=pointer]: Data transfer pricing
            - generic [ref=f15e446]: "We bill for data leaving your app destined for the public internet or for apps or Machines in other regions, including:"
            - list [ref=f15e447]:
              - listitem [ref=f15e448]: Data egress to the Internet, from Machine to edge server to Internet
              - listitem [ref=f15e449]: Data transfer over private network between regions, from Machine to edge server and edge server to Machine
              - listitem [ref=f15e450]: Data transfer to some extensions like Upstash Redis
            - generic [ref=f15e451]: "The following types of traffic are free:"
            - list [ref=f15e452]:
              - listitem [ref=f15e453]: All inbound data transfer
              - listitem [ref=f15e454]: Data transfer between apps or Machines in the same region (for organizations using granular data transfer rates)
              - listitem [ref=f15e455]: Data transfer from apps without an assigned IP address (for organizations not using granular data transfer rates)
            - generic [ref=f15e456]: Fly.io pricing is per region group for outbound data transfer. You’ll see a more detailed breakdown of cost per region and per traffic type on your monthly invoice.
            - note "Info" [ref=f15e457]:
              - generic [ref=f15e462]:
                - strong [ref=f15e463]: "Important:"
                - text: Organizations created after July 18 2024 are automatically opted-in to use the granular data transfer rates and are billed at a different rate for private network data transfer between regions, per the following table. Organizations not using granular data transfer rates are billed for all data transfer (excluding that listed as free above) at the “Egress to public internet” rate.
