            - generic [ref=f3e225]:
              - link [ref=f3e227] [cursor=pointer]:
                - /url: /labrigadadelruido/p/DXXcK4Okgv1/
                - 'img "Disponible en Youtube y en todas las plataformas de streaming. En este episodio nos vamos directo al corazón de Ecuador Tuvimos el placer de conversar con Juan Báez, guitarrista de la banda Los Argonautas desde Quito, Ecuador 🇪🇨. Hablamos de formacion de la banda, historia, los planes a futuro y todo lo que hay detrás de mantenerse fiel a un sonido con identidad. Además, nos sumergimos en parte de su música con estos temas: 🎶 Poción de Medea 🎶 In the Heat of the Night 🎶 Tema de Orfeo 🎶 Gigantes de Tesalia Si te gusta el ska, la música independiente o simplemente escuchar historias reales de músicos que están dándolo todo, este episodio es para ti. Dale play, súbele volumen y acompáñanos en este viaje 🌎🔥 #ska #podcast #youtube #spotify #losargonautas" [ref=f3e230]'
              - link [ref=f3e233] [cursor=pointer]:
                - /url: /radio_bahia/reel/DT0vJddFBjU/
                - 'img "¿Cómo grabas un vinilo para Francia, con las horas contadas y con apagones de 16 horas en Ecuador? Esta es la odisea de Los Argonautas Ec, quienes fusionando ska y soul vencieron la oscuridad para lanzar \"Audionáutica\" junto a leyendas mundiales. Un viaje mitológico que hoy resuena desde Quito hasta Japón, demostrando que el arte no tiene fronteras. Radio Bahía recomienda esta joya; búscala ya en plataformas y descubre el vellocino de oro del ska jazz. @losargonautas.ec #dub #reggaetonchallenge #reggaemusic #funkmusic #soulmusic #SkaJazz #LosArgonautas #radiobahia #SkaEcuador #VinylCulture #MusicaIndependiente" [ref=f3e236]'
                - generic:
                  - generic:
                    - generic:
                      - img "Clip"
              - link [ref=f3e239] [cursor=pointer]:
                - /url: /losargonautas.ec/reel/DTlomXQjrE0/
