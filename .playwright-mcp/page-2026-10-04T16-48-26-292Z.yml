              - link [ref=f3e214] [cursor=pointer]:
                - /url: /rabiatto_pizzeria/p/DaX6GihOD6A/
                - img "¡Este jueves celebramos el Cumple del Gabo como se debe! 🔥 buena música, buena pizzas y buenos amigos 🎸 Los Argonautas en vivo 🎧 Nico Jervis como DJ invitado 🎁 Sorteos de tattoo y piercing Además, estaremos receptando donaciones para enviar a Venezuela. ❤️🇻🇪 Cada aporte cuenta y puede hacer la diferencia." [ref=f3e217]
              - link [ref=f3e220] [cursor=pointer]:
                - /url: /losargonautas.ec/p/DZFmH0qDgF6/
                - 'img "Una alegría compartir que Audionautica (2025), nuestro nuevo álbum, aparece reseñado en la edición #92 de Reggae Vibes, reconocida revista francesa especializada en música jamaiquina. La reseña fue publicada en la página 122 dentro de la sección “Chroniques” Reggae-Ska. Gracias a los amigos de Reggae Vibes por escribir sobre nuestro trabajo y a todos quienes escuchan y acompañan este viaje." [ref=f3e223]'
                - generic:
                  - generic:
