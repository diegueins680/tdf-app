              - link [ref=f6e207] [cursor=pointer]:
                - /url: /mrproduccionesecuador/p/Dd1auQyuJ0m/
                - 'img "🎶🔥 ¡Seguimos conectando música con grandes escenarios y medios! Desde MR Producciones acompañamos a Pakul feat. La Gran Sociedad en su gira de medios con su tema “Canción Común”. 🎤🎷 📻 ¿Tienes un programa o espacio y quieres recibir a nuestros artistas? ¡Recomiéndanos tu programa o presenta tu espacio! 🙌 📲 Booking oficial MR Producciones 099 981 1566 – Gabby Muñoz #MRProducciones #GiraDeMedios #Pakul #LaGranSociedad #CanciónComún 🔴⚫️MR PRODUCCIONES🔴⚫️" [ref=f6e210]'
              - link [ref=f6e213] [cursor=pointer]:
                - /url: /pakul_music/p/Dc1V2wOxeOj/
                - img "🔥 Este sábado nos vemos en KIF Kultural 🔥 Voy a estar tocando a las 12 del día 🎶🎤, así que si están por La Floresta, caigan a darse una vuelta, escuchar musiquita y pasarla chévere. 📍 Génova y Rubio de Arévalo — La Floresta 🗓️ Sábado 5 de septiembre ⏰ 12:00 del día 🎟️ Entrada gratis Hay un montón de artistas y bandas durante todo el día, así que apoyemos la escena local ❤️‍🔥 ¡Nos vemos por ahí! 🍻🎶" [ref=f6e216]
              - link [ref=f6e219] [cursor=pointer]:
                - /url: /pakul_music/p/Daa2TwpRzeA/
                - 'img "🎶 Nos vemos este 10 de julio 🎶 Hay canciones que se disfrutan más cuando se viven de cerca. Este viernes quiero invitarlos a compartir una noche íntima, llena de música, historias y buena energía. 🎤 Concierto Acústico 🗓️ 10 de julio 🕗 20:00 📍 Guayunga Rooftop (José Antepara E4-27 y Vicente León, Quito) Me acompañarán grandes músicos invitados: 🎸 Nicolás Espinoza 🎸 Sergio Espinoza 🎸 Juan Yánez Será un espacio para cantar, sentir y conectar. Los espero para compartir una noche que promete ser muy especial. ❤️ ¡Nos vemos en Guayunga Rooftop! #PakulLlucho #ConciertoAcústico #MúsicaEnVivo #Quito #GuayungaRooftop MúsicaEcuatoriana" [ref=f6e222]'
            - generic [ref=f6e224]:
              - link [ref=f6e226] [cursor=pointer]:
                - /url: /jhosimar.actor/reel/DaWNV36p_c3/
                - 'img "Hay canciones que simplemente se escuchan y otras que te hacen pensar. 🎶 Les comparto un poco de lo que se vivió detrás de cámaras del videoclip de \"Canción común\", el nuevo tema de Pakul junto a La Gran Sociedad. Una canción que habla de esas cosas que vivimos todos, de lo cotidiano, de lo que muchas veces sentimos y no decimos. Qué bacán haber sido parte de este proyecto junto a un equipazo. 📷 Dirección de fotografía: @hakanstagram_ 🎨 Dirección de arte: @t_d_hormigas 🎥 Asistencia de fotografía, asistencia de arte y making of: Jhosimar Moposita Gracias por la confianza. Siempre es un gusto estar detrás de cámara y registrar esos momentos que la gente no ve, pero que hacen posible el resultado final. Si aún no la escuchan, vayan a darle una oportunidad a \"Canción común\". Seguro alguna parte de la letra les va a llegar. 🎧🇪🇨 #Pakul #LaGranSociedad #CanciónComún #BTS #BehindTheScenes" [ref=f6e229]'
                - generic:
                  - generic:
                    - generic:
                      - img "Clip"
              - link [ref=f6e232] [cursor=pointer]:
                - /url: /pakul_music/p/DaDbtxIRATd/
                - 'img "🔥 ¡HOY ES LA NOCHE! 🔥 La espera terminó. Hoy nos encontramos para vivir una Peña Bailable llena de música, baile y buena vibra. 🎶💃🕺 🎤 Pacul “El Príncipe de Cocha” junto a La Gran Sociedad en vivo. ✨ Además, celebraremos el lanzamiento oficial del videoclip de “Canción Común”. 📍 La Bolera – C.C. El Bosque 🕗 8:00 p. m. 🎧 DJ toda la noche 🎟️ Entradas en puerta: $15 🚗 Parqueadero: $1 toda la noche ¡No te quedes fuera! Ven con tu familia y amigos y hagamos de esta una noche inolvidable. ¡Te esperamos! 🎉🔥" [ref=f6e235]'
              - link [ref=f6e238] [cursor=pointer]:
                - /url: /pakul_music/p/DZ5tjIGGt8p/
                - img "Es esta semana 💃🕺💃🕺💃🕺💃🕺💃🕺" [ref=f6e241]
            - generic [ref=f6e243]:
              - link [ref=f6e245] [cursor=pointer]:
                - /url: /pakul_music/reel/DZVBa8DRZUi/
                - 'img "🔥 ¡LA PEÑA BAILABLE YA TIENE FECHA! 🔥 Este viernes 26 de junio nos vemos en La Bolera del C.C. El Bosque para una noche llena de música, baile y celebración. 🎤 PAKUL “El Príncipe de Cocha” 🎺 Orquesta La Gran Sociedad 🎬 Lanzamiento oficial del videoclip de “Canción Común” 🎧 DJ toda la noche 🕗 8:00 PM 🎟 Preventa: $10 🎟 Día del evento: $15 Ven a cantar, bailar y ser parte de una noche muy especial para nosotros. ¡No te quedes fuera del lanzamiento de Canción Común y vivamos juntos una fiesta inolvidable! #Pakul #LaGranSociedad #CanciónComún #PeñaBailable #LaBolera MusicaEnVivo Cochabamba LanzamientoOficial" [ref=f6e248]'
                - generic:
