                - 'img "El #jazz se toma la ciudad y el Ananké también 🤩❤️🌋 - Este #miércoles 23 en la Gonzalez Suárez Felipe Cornejo, Fran Laurito e Ignacio Navarro nos presentan un repertorio de jazz tradicional y contemporáneo. Tres de los músicos más representativos de escena quiteña en un trio sin batería, lo que abre un abanico de posibilidades y texturas muy interesantes. Un trío imperdible !!! - A las 20h30 en la Gonzalez Suárez - - - - #jazzlife #jazzenlagz #jazzenvivo" [ref=f111e694]'
