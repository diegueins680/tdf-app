                        - paragraph [ref=e449]: "DETENCIÓN INMEDIATA sin eludir ni reintentar: advertencia/CAPTCHA/verificación/restricción, solicitud de credenciales, acceso desordenado a interacciones, navegador inesperado, envío incierto, duplicación accidental, dos solicitudes de no contacto dentro del piloto o indicio de incumplimiento Instagram. El fallo histórico de Hugo ya fue excluido; no reintentar."
                        - paragraph [ref=e450]: "Informe diario: evaluados/seleccionados/excluidos/contactados, mensajes por segmento y A/B, positivas/neutrales/negativas, clics/registro/perfil/activación, seguimientos pendientes, objeciones, riesgos y recomendación. Distingue comprobado/no disponible/inferencia. Base previa: cuatro positivas escritas (Carla,Alejandro,Sol,Rommel breve), Neil neutral; Carla reportó registro con captura pero identidad de cuenta/perfil completo/activación no confirmados. PostHog/clics no verificados. No declarar ganador estadístico ni ampliación autorizada. Para proponer ampliación: cero advertencias/duplicados/menores/denuncias spam; ≥4positivas, ≥2registros, ≥1activación, <2rechazos por pertinencia. A/B solo ventaja provisional si duplica respuestas positivas o registros."
