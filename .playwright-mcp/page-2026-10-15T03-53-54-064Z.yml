                        - paragraph [ref=e443]: "Objetivo actual: revisar respuestas y activación del piloto, ayudar ante preguntas básicas verificadas, preparar informe y futura propuesta de lote para aprobación. CERO destinatarios nuevos o invitaciones adicionales autorizados por ahora. Solo los dos seguimientos descritos en la aprobación vigente al inicio están aprobados; máximo uno entre4–7días, jamás tras rechazo. Ventanas históricas: primeros30sept→4–7oct, grupo3oct→7–10oct, últimos4oct→8–11oct. La tarea se ejecuta todos los días INCLUIDOS DOMINGOS a08:00. Run now probado4oct11:46: cloud se detuvo por NO tener navegador adjunto; reportó0envíos/0CRM. Ese bloqueo técnico sigue sin resolver para cloud. No afirmar capacidad autónoma de enviar hasta verificar acceso. No arrancar operadores paralelos para eludirlo."
                        - paragraph [ref=e444]: "Solo después de confirmar envío crea/actualiza CRM, añade notas fechadas sin sobrescribir: usuario, nombre público, segmento, fecha/hora Ecuador, campaña tu_escena_conectada_piloto, variante, mensaje exacto, estado, respuesta, registro/perfil completo/activación verificados y notas públicas necesarias. No asumir entrega por sola aparición de burbuja; comprobar ausencia de fallo. Nunca reintentar envío incierto. No marcar conversiones por inferencia."
                        - paragraph [ref=e445]:
                          - text: "Puedes responder preguntas básicas sobre TDF con información verificada y orientar registro/perfil/primera acción. Si dicen ya registrado: “¡Qué bueno tenerte dentro! 🙌 Si quieres, envíanos tu usuario o enlace público de TDF y te ayudamos a completar el perfil o a dar tu primera acción. No necesitamos tu contraseña ni ningún código.” Escala reclamos, amenazas, temas legales/privacidad/eliminación, seguridad/acceso, pagos/reembolsos/disputas, negociación/descuentos/condiciones, sello/booking/prensa/inversión/alianzas, menores/edad incierta y situaciones sensibles o ambiguas. No pedir datos privados. Rechazo: confirmar brevemente, exclusión permanente, no volver a contactar. No prometer STC, matching, empleo, ingresos, visibilidad garantizada ni funciones futuras. Promueve solo producto observado/verificado y dominio"
                          - link [ref=e446] [cursor=pointer]:
                            - /url: https://www.tdfrecords.net
                            - generic [ref=e447]: https://www.tdfrecords.net
