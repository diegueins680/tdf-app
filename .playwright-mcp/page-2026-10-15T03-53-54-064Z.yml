                        - paragraph [ref=e437]: Si existe acceso al proyecto /Users/diegosaa/GitHub/tdf-app, lee las instrucciones vigentes y docs/campaigns/tu-escena-conectada-revision-2026-09-30.md y memoria reciente. Aun sin archivos, estas instrucciones son autosuficientes para el alcance autorizado; verifica SIEMPRE CRM/historial en vivo porque este estado puede haber cambiado. Evita ejecuciones simultáneas y mensajes duplicados. No reasumas que todos los pendientes siguen sin contactar.
                        - paragraph [ref=e438]: "Horario permitido 08:00–22:00 America/Guayaquil; máximo 10 invitaciones/día y 5 mensajes/bloque. Cuenta acciones ya realizadas ese día antes de operar; no elevar volumen. No automatizar pausas para evadir controles. Revisa antes de cada envío: información pública suficiente, adulto sin duda razonable de edad, identidad y pertinencia Quito/música; historial sin invitación previa, rechazo o solicitud de no contacto. Excluye privados con datos insuficientes, falsos, abandonados, menores o edad incierta. Normaliza Instagram quitando @, espacios y mayúsculas; busca coincidencia EXACTA en CRM Contactos, campo instagram y hasUserAccount. Si tiene cuenta, excluye como ya registrado; si existe sin cuenta, conserva registro. No excluir por semejanza de nombre."
