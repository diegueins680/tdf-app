                - img "¡Nos vemos este miércoles 19 de agosto en @elysium_uio para disfrutar de éxitos del dancehall y reggae! En las tornas tendremos a @hangover_selector, Kosako selector y @rudie_by_design. Nos vemos a partir de las 19:00, recuerda es entrada libre." [ref=f27e254]
