                            - generic [ref=f16e235]: https://www.tdfrecords.net/crm/contactos
                          - text: . Una tarea cloud no debe asumir que tiene acceso al navegador local ni al repo. Si faltan acceso, sesión o historial completo suficiente, detente y reporta el bloqueo, sin enviar, sin pedir credenciales ni códigos, sin crear una base paralela ni buscar un navegador alternativo. No uses scraping, bots externos, extensiones, macros, APIs de Instagram o scripts ejecutados en Instagram. Cada revisión y envío se hace individualmente por la interfaz visible.
                        - paragraph [ref=f16e239]: Si existe acceso al proyecto /Users/diegosaa/GitHub/tdf-app, lee las instrucciones vigentes y docs/campaigns/tu-escena-conectada-revision-2026-09-30.md y memoria reciente. Aun sin archivos, estas instrucciones son autosuficientes para el alcance autorizado; verifica SIEMPRE CRM/historial en vivo porque este estado puede haber cambiado. Evita ejecuciones simultáneas y mensajes duplicados. No reasumas que todos los pendientes siguen sin contactar.
                        - paragraph [ref=f16e240]: "Horario permitido 08:00–22:00 America/Guayaquil; máximo 10 invitaciones/día y 5 mensajes/bloque. Cuenta acciones ya realizadas ese día antes de operar; no elevar volumen. No automatizar pausas para evadir controles. Revisa antes de cada envío: información pública suficiente, adulto sin duda razonable de edad, identidad y pertinencia Quito/música; historial sin invitación previa, rechazo o solicitud de no contacto. Excluye privados con datos insuficientes, falsos, abandonados, menores o edad incierta. Normaliza Instagram quitando @, espacios y mayúsculas; busca coincidencia EXACTA en CRM Contactos, campo instagram y hasUserAccount. Si tiene cuenta, excluye como ya registrado; si existe sin cuenta, conserva registro. No excluir por semejanza de nombre."
                        - paragraph [ref=f16e241]:
                          - text: "Estado actualizado al domingo 4/oct/2026 11:52 America/Guayaquil: el lote TDF-TEC-20261001-01 NO TIENE invitaciones pendientes. 19 contactos con envío visible confirmado sin fallo observado (A10/B9), un intento fallido excluido (Hugo B). Los cuatro últimos fueron enviados por el operador local autorizado hoy: gura.a.music 11:47 CRM281; losargonautas.ec 11:48 CRM282; elbloque_oficial 11:49 CRM2; franlaurito 11:51 CRM283. Todos con notas CRM verificadas. NO repetir esos envíos. Ya invitados además: neilarmasmusic, carlaromanmusica, pakul_music, alejandrosoria_music, emmanu__music, lysergicman_music, solcordovamusic, quitoskasociety, quitobohemio, vdjjac, rommel_unda, joelduenasc, felipe.cornejo.bermeo, flautatraviesa, raulmolina. hugocaicedop excluido por fallo privacidad, nunca reintentar. dannnaa.__ escalada por edad no comprobable, no contactar. Reel ya publicado"
