                - /url: /milangacorp.ec/p/DceAZnvOEdj/
                - 'img "THE LAST ELEKTRONIK DANCE ⚡ Hay noches que se sienten diferentes porque sabes que algo está por cambiar. Este viernes 28 de agosto vivimos nuestra última fiesta ELEKTRONIK de la temporada. Una fecha para volver a encontrarnos en la pista, subir el volumen y despedir esta etapa como merece. 🔊🖤 Esta noche también es para ellos: nuestros amigos DJ´s y parte esencial de esta historia, quienes durante todo este tiempo nos hicieron bailar, vibrar y llenar la pista de momentos que quedan. Gracias por creer, por acompañarnos y por ser parte de este proyecto desde la música. 🎧⚡ Y sí… se acerca nuestro cierre de temporada. Pero esa historia merece ser contada bien. Muy pronto les vamos a contar todo. FRIDAY 28.08 THE LAST ELECTRONIK DANCE Una última noche de electrónica… toda la energía." [ref=f45e498]'
