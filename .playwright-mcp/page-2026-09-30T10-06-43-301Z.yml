                - 'img "Nick Sully - Vocals & Guitars 🎤🎸 Biography: Nick Sully, also known as I Armada, is a Calgary-based Canadian vocalist, guitarist, songwriter, and co-founder of Fusion Imperium. Nick began his musical journey with academic and choral vocal training before picking up the guitar at 14. Over the years, he expanded into songwriting, bass, recording, and home-studio production, developing a sound influenced by industrial metal, electronic music, and ambient soundscapes. His style centres around melodic clean vocals, heavy machine-tight riffs, deep bass, electronic textures, and atmospheric arrangements. His major influences include Rammstein, Emigrate, Bi-2, Otto Dix, and Devin Townsend. 👉 Follow Nick on IG @iarmada.official . . . . . #vocalist #guitarist #songwriter #industrialmusic #dancemetal" [ref=f27e2594]'
              - link [ref=f27e2597] [cursor=pointer]:
