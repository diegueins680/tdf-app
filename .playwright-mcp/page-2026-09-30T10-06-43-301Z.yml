                - 'img "Introducing Fusion Imperium: Calgary’s Newest Industrial Dance Metal Act CALGARY, AB — Calgary’s heavy music landscape welcomes a formidable new addition with the official launch of Fusion Imperium. Bridging the gap between crushing heavy metal instrumentation and high-energy industrial electronic production, the project delivers a driving, precise, and authoritative sonic profile. Backed by technical precision and aggressive synth arrangements, Fusion Imperium is currently preparing a slate of major project updates and live performance dates for the region. The band is; NiK S. - Vocals, Guitars David E. Drums - Drums Rob Carr - Guitars Quelong Lee - Keyboards Follow on IG @fusionimperium . . . . #fusionimperium #industrial #dancemetal #electronic #edmmusic" [ref=f27e2581]'
