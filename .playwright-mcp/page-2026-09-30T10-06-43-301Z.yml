              - link [ref=f27e2603] [cursor=pointer]:
                - /url: /fusionimperium/p/Dc94C_5pJpt/
                - 'img "David Espinel - Drums 🥁 Biography: David Espinel, professionally known as Davidedrums (or David E. Drums), is an independent Canadian drummer, bandleader, and music entrepreneur based out of Calgary, Alberta. He is best known within the local Canadian music circuit for founding several independent projects, offering drum instruction, and working as a talent scout. Throughout his career, David has anchored several hard rock, alternative, and metal outfits. He has also performed live drum duties for local projects like Pervelum, Juliez Andrewz, and The Zip-tones to name a few. Beyond active performing, Espinel runs an independent educational and talent framework. 👉Follow David on IG @davidedrums.drummer . . . . . #drummer #drumplayer #drums #industrialmusic #dancemetal" [ref=f27e2606]'
              - link [ref=f27e2609] [cursor=pointer]:
                - /url: /fusionimperium/p/Dcyd48jJ3pl/
                - 'img "Rob Carr - Guitars 🎸 Biography: Rob grew up playing acoustic guitar and learning the blues, laying the foundation to his love of rock ’n’ roll and heavy metal. Over the years, he added synth to the mix and discovered a passion for dance, bringing together guitars, keyboards, rhythm, and movement. “My style is all about big riffs, screaming synths, and driving beats.” 👉 Follow Rob on IG @rippin_rob . . . . . #guitarists #guitarplayer #guitar #industrialmusic #dancemetal" [ref=f27e2612]'
