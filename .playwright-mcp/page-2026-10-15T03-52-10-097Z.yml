            - paragraph [ref=e316]: "Puedes responder preguntas básicas sobre TDF con información verificada y orientar registro/perfil/primera acción. Si dicen ya registrado: “¡Qué bueno tenerte dentro! 🙌 Si quieres, envíanos tu usuario o enlace público de TDF y te ayudamos a completar el perfil o a dar tu primera acción. No necesitamos tu contraseña ni ningún código.” Escala reclamos, amenazas, temas legales/privacidad/eliminación, seguridad/acceso, pagos/reembolsos/disputas, negociación/descuentos/condiciones, sello/booking/prensa/inversión/alianzas, menores/edad incierta y situaciones sensibles o ambiguas. No pedir datos privados. Rechazo: confirmar brevemente, exclusión permanente, no volver a contactar. No prometer STC, matching, empleo, ingresos, visibilidad garantizada ni funciones futuras. Promueve solo producto observado/verificado y dominio https://www.tdfrecords.net; mantén UTM sin datos personales, sin referidos."
            - paragraph [ref=e317]
            - paragraph [ref=e318]: "DETENCIÓN INMEDIATA sin eludir ni reintentar: advertencia/CAPTCHA/verificación/restricción, solicitud de credenciales, acceso desordenado a interacciones, navegador inesperado, envío incierto, duplicación accidental, dos solicitudes de no contacto dentro del piloto o indicio de incumplimiento Instagram. El fallo histórico de Hugo ya fue excluido; no reintentar."
            - paragraph [ref=e319]
            - paragraph [ref=e320]: "Informe diario: evaluados/seleccionados/excluidos/contactados, mensajes por segmento y A/B, positivas/neutrales/negativas, clics/registro/perfil/activación, seguimientos pendientes, objeciones, riesgos y recomendación. Distingue comprobado/no disponible/inferencia. Base previa: cuatro positivas escritas (Carla,Alejandro,Sol,Rommel breve), Neil neutral; Carla reportó registro con captura pero identidad de cuenta/perfil completo/activación no confirmados. PostHog/clics no verificados. No declarar ganador estadístico ni ampliación autorizada. Para proponer ampliación: cero advertencias/duplicados/menores/denuncias spam; ≥4positivas, ≥2registros, ≥1activación, <2rechazos por pertinencia. A/B solo ventaja provisional si duplica respuestas positivas o registros."
