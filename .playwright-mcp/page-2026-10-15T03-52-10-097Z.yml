                                                          - paragraph: "APROBACIÓN VIGENTE — Diego respondió «Aprobado» el 4/oct/2026 a19:50 America/Guayaquil después de ver estos DOS textos completos. Autoriza UN SOLO seguimiento por destinatario, EXCLUSIVAMENTE entre el 5 y el 7/oct/2026, dentro de08:00–22:00Ecuador. No enviar antes5oct ni después7oct. No volver a pedir aprobación de esos mismos textos; no modificar mensajes ni añadir destinatarios. Previo al envío revisa historial vivo, que no se haya enviado ya este seguimiento por otro operador, no respuesta que lo haga innecesario, no rechazo/no-contacto, y CRM exacto hasUserAccount=false, más resto de exclusiones y controles. Si ya tiene cuenta, cambió situación o hay duda, omitir y reportar. Si cloud no tiene navegador adjunto/CRM, parar: la aprobación no soluciona acceso. Registro en CRM solo después del envío verificado, conservar notas. Al terminar estosdos o vencer7oct, cero seguimientos adicionales aprobados."
