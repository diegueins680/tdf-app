                - 'img "🌙 MOON ya está aquí. El nuevo lanzamiento de Blue Records presenta a GaBBy Gonzalez y Juano Ledesma en una experiencia sonora que viaja entre el Minimal House y el Micro House. Grooves hipnóticos, bajos profundos y texturas espaciales crean una atmósfera elegante, minimal y totalmente inmersiva. Una pista diseñada para perder la noción del tiempo y dejar que el ritmo tome el control. 🚀 NEW RELEASE • AGOSTO 2026 Escúchala, compártela y cuéntanos desde dónde la estás escuchando. 🎧 MOON — GaBBy Gonzalez & Juano Ledesma 🔵 Blue Records #Moon #GaBByGonzalez #JuanoLedesma #BlueRecords #NewRelease MinimalHouse MicroHouse HouseMusic ElectronicMusic UndergroundHouse DeepGroove MinimalGroove DJ ClubMusic ElectronicGroove NowPlaying" [ref=f81e532]'
