              - link [ref=f3e363] [cursor=pointer]:
                - /url: /neilarmasmusic/p/DdotvENTdTI/
                - img "Llevo mi música a tus eventos. 🎤✨ Cantamos, bailamos, reímos y hacemos de cada show una experiencia de concierto para disfrutar juntos. El repertorio se adapta a tus gustos musicales, al tipo de evento y, sobre todo, a las ganas que tengamos de pasarla bien. ❤️ 🎉 Matrimonios, cumpleaños, eventos corporativos y celebraciones privadas. 📍 Shows en Quito y todo el Ecuador. 📲 Escríbeme y organizamos nuestro siguiente evento 🔥" [ref=f3e366]
