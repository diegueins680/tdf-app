                - /url: /neilarmasmusic/p/Ddow8c2hnqw/
                - 'img "Esta historia también se construye con ustedes. ❤️ Si eres de los que aman la música, persiguen sus sueños y luchan por lo que quieren; de los que dedican canciones para decir lo que a veces no pueden explicar con palabras y, por supuesto, escuchan música de despecho sin estar despechados 😂❤️‍🩹… bienvenido al club. Por aquí compartimos canciones, conciertos, calles, viajes, backstage y todo lo que pasa mientras seguimos haciendo realidad esta historia. Sé parte del camino. 📱 Instagram · TikTok · Facebook: @neilarmasmusic 🎧 YouTube · Spotify: Neil Armas Nos vemos por aquí. ❤️ Solo hice un cambio que me #neilarmasec #musicaenvivo🎶 #musicosenquito #fyp #musicosenecuador" [ref=f3e354]'
