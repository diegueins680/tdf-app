              - link [ref=f69e747] [cursor=pointer]:
                - /url: /pifrecuency/reel/Ddt8IIgRuhx/
                - 'img "Este pasado domingo salió “Regalito”, una hermosa canción inédita de @solcordovamusic , y la tercera Live Session de Pi Frecuency Prods! Vayan a verla en Youtube! Link en la bio e historias destacadas! Voz, guitarra y composición: Sol Córdova Cámara y color: @cristobalpinamusic Producción: Pi Frecuency Prods Pronto saldrán nuevas, así que atentxs! #livesession #originalmusic #folk #folkore #tonada" [ref=f69e748]'
                - generic:
                  - generic:
                    - generic:
                      - img "Clip"
            - generic [ref=f69e392]:
              - link [ref=f69e749] [cursor=pointer]:
                - /url: /solcordovamusic/reel/DdozlJrxGMW/
                - 'img "Ya está disponible en YouTube esta sesión orgánica y con sonido natural que hicimos junto a @pifrecuency 🎶✨ ¡Vayan a escucharla y me cuentan qué sintieron! #livesessions #singersongwriter #quitoecuador #santiagodechile #folklorechileno" [ref=f69e750]'
                - generic:
                  - generic:
                    - generic:
                      - img "Clip"
              - link [ref=f69e751] [cursor=pointer]:
                - /url: /solcordovamusic/p/Ddh6OhwEXkK/
                - 'img "Hay un proceso muy íntimo y profundo detrás de la escritura de una canción. Un proceso en donde las emociones se transforman en palabras, ritmo, armonía y melodía. Yo partí mi vida musical realizando ese proceso acompañada de una guitarra. A pesar de que la guitarra no se transformó en mi instrumento principal, cada vez que me siento alienada o que pierdo el camino, siempre vuelvo a esa raíz. Como dice mi mami: volver a empezar de cero una vez más, porque uno empieza de cero mil veces en la vida. Y en uno de esos empezar de cero, compuse esta canción, “Regalito”, que es una canción bebé, una canción nueva, y que tuve la oportunidad de grabarla en las sesiones orgánicas, crudas, @pifrecuency ✨ Así que, si quieren ir a conocer el resultado de este proceso, vayan a YouTube y disfruten de la canción.🎧 #cantautoraecuatoriana #livesession #ecuador" [ref=f69e752]'
                - generic:
                  - generic:
                    - generic:
                      - img "Carousel"
              - link [ref=f69e753] [cursor=pointer]:
                - /url: /pifrecuency/p/DdcUr4Fn9jm/
                - 'img "Este domingo ya sale una nueva sesión en vivo de Pi Frecuency Prods! Esta vez con el estreno de una hermosa canción inédita de @solcordovamusic !! No se la pueden perder! Pronto se vienen nuevas Live Sessions! #folklore #songwriter #livesession #originalmusic #folk" [ref=f69e754]'
                - generic:
                  - generic:
                    - generic:
                      - img "Carousel"
            - generic [ref=f69e411]:
              - link [ref=f69e755] [cursor=pointer]:
                - /url: /solcordovamusic/p/DdSb6CQka6_/
                - 'img "Les comparto algunos momentos de este camino gestionando mi proyecto independiente, con poco presupuesto, mucha fe e ideas poco convencionales. A veces, preguntándome si vale la pena intentar llegar al mundo con mis canciones; a veces teniendo la convicción de que lo vale, a veces a punto de abortar misión. Lo cierto es que, pase lo que pase, he seguido el llamado y he hecho todo lo que está en mis manos, lo demás ya depende un poco de la suerte o del destino. De todas formas, la vida es un poco así ¿no? Gracias por quienes siempre están sosteniendo y resonando, porque ahí es cuando el canto tiene sentido. #elcantotienesentido #singersongwriter #cantautora #quitoecuador🇪🇨♥️" [ref=f69e756]'
                - generic:
                  - generic:
                    - generic:
                      - img "Carousel"
              - link [ref=f69e757] [cursor=pointer]:
                - /url: /solcordovamusic/reel/Dc33oivRyxF/
                - 'img "Quería saber si luego de tanto dolor, volvería a sentirme bien y a brillar. El Tarot lo confirmó, yo lo canté y luego dibujé mis propias cartas. ¿Acaso la creatividad tiene límites? ¿Acaso el arte no ayuda a sanar? 💔❤️‍🩹💛 Este vídeo fue durante mi show en el @islavivagalapagos 2025 🎶 #tarotenvivo #tarot #musicaytarot #cantautora #solcordovamusic" [ref=f69e758]'
                - generic:
