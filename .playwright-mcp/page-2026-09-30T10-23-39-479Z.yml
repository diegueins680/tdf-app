                - /url: /solcordovamusic/reel/DdJ56t7xTid/
                - 'img "Me he pasado el último año componiendo y produciendo cancioncitas, cumpliendo de alguna manera el deseo de hacer mis propias producciones con mis pocos recursos, pero también entendiendo ese sonido auténtico. Algunas de estas canciones verán la luz otras no. Pero ya quiero comenzar a compartirles fragmentos y amores de lo que voy construyendo 🌳 #mujerproductora #womenproducers #singersongwriter #quitoecuador" [ref=f69e738]'
                - generic:
                  - generic:
                    - generic:
                      - img "Pinned post icon"
              - link [ref=f69e739] [cursor=pointer]:
                - /url: /axha.musica/reel/DaDmp10Ri51/
                - 'img "“MADRE CUMBIA” - Link en bio Ya disponible en todas las plataformas Letra (poema): @xavi.vinueza Producción: @axha.no.existe Voces, melodías y arreglo vocal: @solcordovamusic Mezcla y máster: @gabosarria96 Video: @pifrecuency Δ" [ref=f69e740]'
                - generic:
                  - generic:
                    - generic:
                      - img "Pinned post icon"
              - link [ref=f69e741] [cursor=pointer]:
                - /url: /solcordovamusic/reel/DXha88mkQWp/
                - 'img "Hace tiempo le pedí ayuda a @inticuri para traducir el Eterno Sol 🌞 al Kichwa y sigo muy agradecida. Como instructora de kundalini yoga en esos años había encontrado versiones en muchos idiomas, y además cantaba mantras en sánscrito y Gurmukhi. Me pareció hermoso y necesario crear una versión en Kichwa como una promesa de reconexión con nuestra raíz. Esta canción también ha sido un puente entre la identidad artística y la espiritual con @devjot_medicinemusic , haciendo que todo mi ser musical se unifique. Pronto se encontrará nuevamente esta versión en plataformas digitales. #medicinemusic #kichwa #womaninmusic #mantra #eternosol" [ref=f69e742]'
                - generic:
                  - generic:
                    - generic:
                      - img "Pinned post icon"
            - generic [ref=f69e373]:
              - link [ref=f69e743] [cursor=pointer]:
                - /url: /ananau_botanique/p/Dd20ghxkSHR/
                - 'img "Se acerca el día y los sentimientos se alborotan!! No les voy a mentir... A veces pienso: y si nadie llega? Pero estamos organizando este espacio y este evento con tanta dedicación y cariño que tengo la esperanza de verles por montones aquí este finde! Gracias a todos quienes se han sumado y se siguen sumando para hacer de esta inauguración algo tan especial! Deje su deseo de buena suerte en los comentarios ✨✨✨" [ref=f69e744]'
                - generic:
