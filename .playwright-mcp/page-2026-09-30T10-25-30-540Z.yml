                - /url: /elysium_uio/p/Dbjwi4jTt9X/
                - 'img "🎶 Los miércoles tienen un nuevo ritual. 🎶 El sonido del vinilo vuelve a cobrar vida en ELYSIUM GastroPub. 📀✨ Durante todo agosto, disfruta una selección de Ska, Reggae, Cumbia y Dancehall en una noche donde la música se escucha como fue creada: con alma, historia y mucho groove. 🔥 Este miércoles: 🎧 Sound Bwoy Selektor 🆚 Hangover Selector Ven a compartir con buena música, coctelería de autor, gastronomía y el ambiente único que solo ELYSIUM puede ofrecer. 📍 Whymper N27-81 y Av. Orellana 🕖 Desde las 19:00 Las mejores noches no se reproducen… se viven. Nos vemos en ELYSIUM. 🍸🎵 #ElysiumGastroPub #MiércolesDeVinilos #VinylNight #Quito" [ref=f78e394]'
