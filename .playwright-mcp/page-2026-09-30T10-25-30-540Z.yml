                - img "¡Queremos que tu marca sea parte de la décima edición del Festival Ska del Ecuador! 😎🇪🇨 Si estás interesado en participar en la Feria de Emprendimientos del Ska Ba Boom, escríbenos." [ref=f78e344]
              - link [ref=f78e347] [cursor=pointer]:
                - /url: /quitoskasociety/p/Ddr2F5yxiD1/
                - 'img "🎺🔥 ¡10 AÑOS DEL SKA BA BOOM! 🔥🎺 El festival ska del Ecuador celebra su DÉCIMA EDICIÓN y llega con una noche cargada de ska, reggae, two tone y sonidos que harán vibrar la ciudad. 🇪🇨🇦🇷 📅 Sábado 24 de octubre ⏰ 18:00 📍 La Base — Francisco Salazar y Tamayo, Quito 🎟️ Entrada: $10 🎶 En el escenario: 🇦🇷 Mariano Goldenstein (Argentina) junto a The Rude Monkey Bones 🎷 Quito Ska Jazz 🔥 Los Barrelshots 💥 Los Malandronians 🎺 Los Mozos de Mariangula (MDMA) 🎧 Musicalizando la noche desde Argentina: 🇦🇷 Una Isla Club Records Una década de historias, música, baile y cultura alrededor del ska. Cumplimos 10 ediciones y queremos celebrarlo contigo. 🕴️ Ponte tus botas, prepara los pasos y ven a bailar. #SkaBaBoom #Ska #Quito #SkaEcuador #SkaMusic Rocksteady TwoTone LaBase" [ref=f78e350]'
              - link [ref=f78e353] [cursor=pointer]:
