                - /url: /quitoskasociety/p/DcuSzjKxl9b/
                - img "¡Celebraremos 10 años del festival Ska del Ecuador, junto a @marrian_ska_goldenstein, de Sombrero Club desde Argentina, junto a @rudemonkeybones cómo backing band. 🇦🇷🏁 Queremos agradecer a @soylabase por hacer posible este décimo aniversario del festival Ska del Ecuador. Nos vemos el 24 de octubre en nuestra 10ª edición." [ref=f78e363]
