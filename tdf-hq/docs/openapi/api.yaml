          example: admin@tdf.com
        password:
          type: string
          format: password
    GoogleLoginRequest:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken:
          type: string
          description: Google ID token returned by Google Identity Services
        marketingOptIn:
          type: boolean
          description: Optional consent to receive TDF product and marketing updates when creating an account.
        termsAccepted:
          type: boolean
          description: Account terms acceptance when Google is used from signup.
        termsVersion:
          type: string
          maxLength: 100
          description: Version of the account terms accepted during Google signup.
    SignupRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
          example: Diego
        lastName:
          type: string
          example: Saá
        email:
          type: string
          format: email
          example: ops@tdfrecords.com
        phone:
          type: string
          nullable: true
          example: "+1 415 555 2671"
        password:
          type: string
          format: password
          example: changeme123
        marketingOptIn:
          type: boolean
          description: Optional consent to receive TDF product and marketing updates.
        termsAccepted:
          type: boolean
          description: Account terms acceptance. New first-party clients send true with termsVersion.
        termsVersion:
          type: string
          maxLength: 100
          description: Version of the account terms accepted during signup.
        fanArtistIds:
          type: array
          items:
            type: integer
            format: int64
          description: Artist or band ids to follow after account creation; this does not assign a security role.
        claimArtistId:
          type: integer
          format: int64
          nullable: true
          description: Optional existing artist profile to claim when it is not already assigned to a user. A verified email match applies the persisted artist-claim policy server-side.
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Bearer token for authenticated requests when a client is not using cookies.
        partyId:
          type: integer
          format: int64
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        modules:
          type: array
          items:
            type: string
            description: Enabled modules for the user.
        accountCreated:
          type: boolean
          description: Present on Google authentication to distinguish a newly created account from an existing login.
    SessionResponse:
      type: object
      required: [username, displayName, partyId, roles, modules, featureFlags, preferences]
      properties:
        username:
          type: string
        displayName:
          type: string
        partyId:
          type: integer
          format: int64
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        modules:
          type: array
          items:
            type: string
            description: Enabled modules for the user.
        featureFlags:
          type: array
          description: Enabled public feature-flag identifiers; never contains configuration secrets.
          items:
            type: string
        preferences:
          $ref: '#/components/schemas/LocalePreferences'
    LocalePreferences:
      type: object
      required: [localeId, locale, currencyId, currency, timezone]
      properties:
        localeId:
          type: string
          format: uuid
          description: Canonical persisted locale identity.
        locale:
          type: string
          readOnly: true
          description: Presentation code resolved from localeId; never accepted as write identity.
          example: en
        currencyId:
          type: string
          format: uuid
          description: Canonical persisted currency identity.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          readOnly: true
          description: ISO presentation code resolved from currencyId; never accepted as write identity.
          example: USD
        timezone:
          type: string
          example: Europe/Berlin
        countryId:
          type: string
          format: uuid
          nullable: true
          description: Canonical persisted country identity selected by the user.
        countryCode:
          type: string
          nullable: true
          pattern: '^[A-Z]{2}$'
          readOnly: true
          description: Presentation and external-wire code resolved from countryId; legacy rows may use preserved migration evidence until backfilled.
    LocalePreferencesUpdate:
      type: object
      additionalProperties: false
      required: [localeId, currencyId, timezone]
      properties:
        localeId:
          type: string
          format: uuid
          description: Canonical active deployment-enabled locale identity.
        currencyId:
          type: string
          format: uuid
          description: Canonical active deployment-enabled currency identity.
        timezone:
          type: string
        countryId:
          type: string
          format: uuid
          nullable: true
          description: Canonical active country identity. Null explicitly clears the preference.
