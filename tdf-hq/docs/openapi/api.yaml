      operationId: getPublicRecordsFeed
      security: [ ]
      parameters:
        - name: locale
          in: query
          schema:
            type: string
        - name: If-None-Match
          in: header
          description: Previously received Records feed ETag.
          schema:
            type: string
      responses:
        '200':
