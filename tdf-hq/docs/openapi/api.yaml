openapi: 3.0.0
info:
  title: TDF Records API
  version: 1.0.0
  description: Full API for TDF Records platform

servers:
  - url: http://localhost:8080
    description: Development server

paths:
  /social-events/events:
    get:
      tags: [Social events]
      summary: List social events using canonical catalog identifiers
      operationId: listSocialEvents
      security:
        - bearerAuth: [ ]
      parameters:
        - name: event_type_id
          in: query
          description: Stable UUID of a persisted event type. Codes, labels, and slugs are not accepted as relationships.
          schema:
            type: string
            format: uuid
        - name: workflow_state_id
          in: query
          description: Stable UUID of an active state in the persisted `social-event-lifecycle` workflow.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Matching events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SocialEvent'
        '422':
          description: Unknown event type identifier
    post:
      tags: [Social events]
      summary: Create a social event using a canonical event type identifier
      operationId: createSocialEvent
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialEvent'
      responses:
        '200':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialEvent'
        '422':
          description: Event type is unknown, inactive, ineffective, deprecated, or unpublished
  /social-events/events/{eventId}/moments/{momentId}/reactions:
    post:
      tags: [Social events]
      summary: Toggle a persisted reaction type on an event moment
      operationId: reactToSocialEventMoment
      security:
        - bearerAuth: [ ]
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - name: momentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventMomentReactionRequest'
      responses:
        '200':
          description: Moment with canonical reaction references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventMoment'
        '422':
          description: Reaction type UUID is unknown, inactive, deprecated, or unpublished
  /version:
    get:
      summary: Get API Version
      description: Returns version and build information for the running API server.
      operationId: getVersion
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /health:
    get:
      summary: Health Check
      description: Checks the health of the API server and its database connection.
      operationId: getHealth
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /login:
    post:
      summary: Login with username or email
      description: Authenticates a user, sets a session cookie, and returns a bearer token plus role metadata.
      operationId: login
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated successfully
          headers:
            Set-Cookie:
              description: Session cookie for browser-based clients.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
  /login/google:
    post:
      summary: Login with Google
      description: Validates a Google ID token, sets a session cookie, and issues a session. Creates a Customer/Fan account when the email is new.
      operationId: loginWithGoogle
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: Authenticated successfully
          headers:
            Set-Cookie:
              description: Session cookie for browser-based clients.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid or expired Google token
  /signup:
    post:
      summary: Create an account
      description: Registers a new party + credential pair, sets a session cookie, and returns a ready-to-use token.
      operationId: signup
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '200':
          description: Account created
          headers:
            Set-Cookie:
              description: Session cookie for browser-based clients.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '409':
          description: Email already registered
  /session:
    get:
      summary: Get current session
      description: Returns the authenticated user snapshot resolved by the backend, including published modules, or null when there is no valid session.
      operationId: getSession
      responses:
        '200':
          description: Current authenticated session, or null when the request is anonymous
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SessionResponse'
                nullable: true
  /session/logout:
    post:
      summary: Clear current session
      description: Clears the browser session cookie for the current user.
      operationId: logoutSession
      responses:
        '200':
          description: Session cleared
          headers:
            Set-Cookie:
              description: Expired session cookie.
              schema:
                type: string
  /session/preferences:
    get:
      summary: Get locale preferences
      operationId: getLocalePreferences
      responses:
        '200':
          description: Current user locale, currency, and timezone preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalePreferences'
        '401':
          description: Authentication required
  /session/currency-conversions:
    post:
      summary: Record an audited currency conversion
      operationId: recordCurrencyConversion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrencyConversionAuditCreate'
      responses:
        '200':
          description: Conversion recorded
        '400':
          description: Invalid currency, amount, rate, or source
        '401':
          description: Authentication required
    put:
      summary: Update locale preferences
      operationId: updateLocalePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalePreferencesUpdate'
      responses:
        '200':
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalePreferences'
        '400':
          description: Unsupported locale, currency, timezone, or country
        '401':
          description: Authentication required
  /public/courses/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Courses]
      summary: Get course metadata
      description: Returns public metadata for a course landing page.
      operationId: getCourseMetadata
      security: [ ]
      responses:
        '200':
          description: Course metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseMetadata'
        '404':
          description: Course not found
  /public/courses/{slug}/registrations:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Courses]
      summary: Create course registration
      description: Stores a registration for the specified course. Landing submissions use source=landing and include UTM tags.
      operationId: createCourseRegistration
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseRegistrationRequest'
      responses:
        '201':
          description: Registration stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseRegistrationResponse'
        '400':
          description: Invalid payload
        '404':
          description: Course not found
  /webhooks/whatsapp:
    get:
      tags: [Webhooks]
      summary: Verify WhatsApp webhook
      description: Echoes the hub.challenge parameter when the verify token matches.
      operationId: verifyWhatsAppWebhook
      security: [ ]
      parameters:
        - name: hub.mode
          in: query
          required: false
          schema:
            type: string
        - name: hub.verify_token
          in: query
          required: false
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Challenge echoed
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Verify token mismatch
    post:
      tags: [Webhooks]
      summary: Receive WhatsApp webhook
      description: Consumes WhatsApp Cloud API message payloads and triggers keyword-based enrollment.
      operationId: handleWhatsAppWebhook
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppWebhook'
      responses:
        '204':
          description: Processed
  /instagram/reply:
    post:
      tags: [Instagram]
      summary: Send Instagram reply
      description: Sends a manual Instagram reply and stores it.
      operationId: sendInstagramReply
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [irSenderId, irMessage]
              properties:
                irSenderId:
                  type: string
                irMessage:
                  type: string
                irExternalId:
                  type: string
                  description: Optional externalId of the inbound message to mark it as replied.
      responses:
        '200':
          description: Reply status
          content:
            application/json:
              schema:
                type: object
  /instagram/messages:
    get:
      tags: [Instagram]
      summary: List Instagram inbox messages
      description: Returns stored Instagram messages for auto-reply tracking. Deleted or unsent inbound messages are excluded from the inbox feed.
      operationId: listInstagramMessages
      security:
        - bearerAuth: [ ]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [incoming, outgoing, all]
            default: all
        - name: repliedOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Messages list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SocialInboxMessage'
  /facebook/reply:
    post:
      tags: [Facebook]
      summary: Send Facebook reply
      description: Sends a manual Facebook Messenger reply and stores it.
      operationId: sendFacebookReply
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frSenderId, frMessage]
              properties:
                frSenderId:
                  type: string
                frMessage:
                  type: string
                frExternalId:
                  type: string
                  description: Optional externalId of the inbound message to mark it as replied.
      responses:
        '200':
          description: Reply status
          content:
            application/json:
              schema:
                type: object
  /facebook/webhook:
    get:
      tags: [Facebook]
      summary: Verify Facebook webhook
      description: Echoes hub.challenge when verify token matches.
      security: [ ]
      parameters:
        - name: hub.mode
          in: query
          required: false
          schema:
            type: string
        - name: hub.verify_token
          in: query
          required: false
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Verification challenge
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Verify token mismatch
    post:
      tags: [Facebook]
      summary: Receive Facebook webhook
      description: Consumes Meta Page webhook payloads for Messenger inbox ingestion.
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '204':
          description: Processed
  /facebook/messages:
    get:
      tags: [Facebook]
      summary: List Facebook inbox messages
      description: Returns stored Facebook Messenger messages for inbox tracking. Deleted or unsent inbound messages are excluded from the inbox feed.
      operationId: listFacebookMessages
      security:
        - bearerAuth: [ ]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [incoming, outgoing, all]
            default: all
        - name: repliedOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Messages list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SocialInboxMessage'
  /meta/backfill:
    post:
      tags: [Admin]
      summary: Backfill Meta inbox messages
      description: One-time admin trigger to import unread Instagram/Facebook messages from Graph API.
      operationId: backfillMetaInbox
      security:
        - bearerAuth: [ ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                platform:
                  type: string
                  enum: [all, instagram, facebook]
                conversationLimit:
                  type: integer
                messagesPerConversation:
                  type: integer
                onlyUnread:
                  type: boolean
                dryRun:
                  type: boolean
      responses:
        '200':
          description: Backfill result
          content:
            application/json:
              schema:
                type: object
  /whatsapp/reply:
    post:
      tags: [WhatsApp]
      summary: Send WhatsApp reply
      description: Sends a manual WhatsApp reply and stores it.
      operationId: sendWhatsAppReply
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wrSenderId, wrMessage]
              properties:
                wrSenderId:
                  type: string
                wrMessage:
                  type: string
                wrExternalId:
                  type: string
                  description: Optional externalId of the inbound message to mark it as replied.
      responses:
        '200':
          description: Reply status
          content:
            application/json:
              schema:
                type: object
  /whatsapp/messages:
    get:
      tags: [WhatsApp]
      summary: List WhatsApp inbox messages
      description: Returns stored WhatsApp messages for auto-reply tracking.
      operationId: listWhatsAppMessages
      security:
        - bearerAuth: [ ]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [incoming, outgoing, all]
            default: all
        - name: repliedOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Messages list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SocialInboxMessage'
  /whatsapp/consent:
    post:
      tags: [WhatsApp]
      summary: Record WhatsApp consent (admin)
      description: Stores explicit consent and optionally sends a confirmation message.
      operationId: createWhatsAppConsent
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppConsentRequest'
      responses:
        '200':
          description: Consent stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppConsentResponse'
        '400':
          description: Invalid payload
    get:
      tags: [WhatsApp]
      summary: Fetch WhatsApp consent status (admin)
      operationId: getWhatsAppConsent
      security:
        - bearerAuth: [ ]
      parameters:
        - name: phone
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Consent status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppConsentStatus'
        '400':
          description: Missing or invalid phone
  /whatsapp/opt-out:
    post:
      tags: [WhatsApp]
      summary: Revoke WhatsApp consent (admin)
      operationId: optOutWhatsAppConsent
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppOptOutRequest'
      responses:
        '200':
          description: Consent revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppConsentResponse'
        '400':
          description: Invalid payload
  /public/whatsapp/consent:
    post:
      tags: [WhatsApp]
      summary: Record WhatsApp consent (public)
      description: Stores explicit consent and optionally sends a confirmation message.
      operationId: createWhatsAppConsentPublic
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppConsentRequest'
      responses:
        '200':
          description: Consent stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppConsentResponse'
        '400':
          description: Invalid payload
    get:
      tags: [WhatsApp]
      summary: Fetch WhatsApp consent status (public)
      operationId: getWhatsAppConsentPublic
      security: [ ]
      parameters:
        - name: phone
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Consent status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppConsentStatus'
        '400':
          description: Missing or invalid phone
  /public/whatsapp/opt-out:
    post:
      tags: [WhatsApp]
      summary: Revoke WhatsApp consent (public)
      operationId: optOutWhatsAppConsentPublic
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppOptOutRequest'
      responses:
        '200':
          description: Consent revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppConsentResponse'
        '400':
          description: Invalid payload
  /admin/courses/{slug}/registrations/{registrationId}/status:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: registrationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      tags: [Admin]
      summary: Update course registration status
      description: Marks a course registration as paid or cancelled.
      operationId: updateCourseRegistrationStatus
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseRegistrationStatusUpdate'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseRegistrationResponse'
        '404':
          description: Registration not found
  /admin/artists/enrichment/overview:
    get:
      tags: [Admin]
      summary: Inspect artist enrichment inventory and review queues
      operationId: getArtistEnrichmentOverview
      security:
        - bearerAuth: [ ]
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: artistId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Complete enrichment overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistEnrichmentOverview'
        '401': { description: Authentication required }
        '403': { description: Strict Admin role required }
  /admin/artists/enrichment/runs:
    get:
      tags: [Admin]
      summary: List artist enrichment runs
      operationId: listArtistEnrichmentRuns
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Recent runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ArtistEnrichmentRun' }
    post:
      tags: [Admin]
      summary: Start or safely resume artist enrichment
      operationId: runArtistEnrichment
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtistEnrichmentRunRequest' }
      responses:
        '200':
          description: Run result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtistEnrichmentRun' }
  /admin/artists/enrichment/runs/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      tags: [Admin]
      summary: Checkpoint an external enrichment run
      operationId: updateArtistEnrichmentRun
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtistEnrichmentRunUpdate' }
      responses:
        '200':
          description: Durable updated run state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtistEnrichmentRun' }
  /admin/artists/enrichment/artists/{artistId}/rerun:
    parameters:
      - name: artistId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Admin]
      summary: Rerun enrichment for one artist
      operationId: rerunArtistEnrichment
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtistEnrichmentRunRequest' }
      responses:
        '200':
          description: Artist-scoped run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtistEnrichmentRun' }
  /admin/artists/enrichment/suggestions/{suggestionId}:
    parameters:
      - name: suggestionId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      tags: [Admin]
      summary: Approve, edit, or reject one field suggestion
      operationId: decideArtistEnrichmentSuggestion
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtistEnrichmentDecision' }
      responses:
        '200':
          description: Idempotent decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtistEnrichmentSuggestion' }
  /admin/artists/enrichment/sources:
    post:
      tags: [Admin]
      summary: Persist field-level research provenance
      operationId: createArtistResearchSource
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtistResearchSourceCreate' }
      responses:
        '200':
          description: Idempotent provenance record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtistResearchSource' }
  /admin/artists/enrichment/suggestions:
    post:
      tags: [Admin]
      summary: Create an idempotent field suggestion
      operationId: createArtistEnrichmentSuggestion
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtistEnrichmentSuggestionCreate' }
      responses:
        '200':
          description: Created or existing suggestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtistEnrichmentSuggestion' }
  /admin/artists/enrichment/media:
    post:
      tags: [Admin]
      summary: Register a validated Google Drive artist image derivative
      operationId: createArtistMediaAsset
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtistMediaAssetCreate' }
      responses:
        '200':
          description: Created or existing media asset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtistMediaAsset' }
  /admin/artists/enrichment/suggestion-sets/{artistId}:
    parameters:
      - name: artistId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      tags: [Admin]
