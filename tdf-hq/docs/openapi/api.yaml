        erMaterializationRunId: { type: string }
        erMaterializationCandidateId: { type: string }
        erMaterializationEventId: { type: string }
        erMaterializationVenueId: { type: string }
        erMaterializationArtistIds: { type: array, items: { type: string } }
        erMaterializationChangeId: { type: string }
        erMaterializationCreated: { type: boolean }
        erMaterializationPublished: { type: boolean }
    EventResearchChange:
