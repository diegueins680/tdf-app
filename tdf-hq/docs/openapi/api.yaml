openapi: 3.0.0
info:
  title: TDF Records API
  version: 1.0.0
  description: Full API for TDF Records platform

servers:
  - url: http://localhost:8080
    description: Development server

paths:
  /social-events/events:
    get:
      tags: [Social events]
      summary: List social events using canonical catalog identifiers
      operationId: listSocialEvents
      security:
        - bearerAuth: [ ]
      parameters:
        - name: event_type_id
          in: query
          description: Stable UUID of a persisted event type. Codes, labels, and slugs are not accepted as relationships.
          schema:
            type: string
            format: uuid
        - name: workflow_state_id
          in: query
          description: Stable UUID of an active state in the persisted `social-event-lifecycle` workflow.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Matching events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SocialEvent'
        '422':
          description: Unknown event type identifier
    post:
      tags: [Social events]
      summary: Create a social event using a canonical event type identifier
      operationId: createSocialEvent
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialEvent'
      responses:
        '200':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialEvent'
        '422':
          description: Event type is unknown, inactive, ineffective, deprecated, or unpublished
  /social-events/events/{eventId}/moments/{momentId}/reactions:
    post:
      tags: [Social events]
      summary: Toggle a persisted reaction type on an event moment
      operationId: reactToSocialEventMoment
      security:
        - bearerAuth: [ ]
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - name: momentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventMomentReactionRequest'
      responses:
        '200':
          description: Moment with canonical reaction references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventMoment'
        '422':
          description: Reaction type UUID is unknown, inactive, deprecated, or unpublished
  /social-events/event-research/pilot:
    get:
      tags: [Event research]
      summary: Read accumulated pilot state
      operationId: getEventResearchPilot
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Pilot approval and active-candidate count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventResearchPilot' }
        '403': { description: Strict administrator access is required }
  /social-events/event-research/pilot/approve:
    post:
      tags: [Event research]
      summary: Record an explicit, immutable pilot approval
      operationId: approveEventResearchPilot
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [erPilotApprovalReference]
              properties:
                erPilotApprovalReference: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Approved pilot state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventResearchPilot' }
        '403': { description: Strict administrator access is required }
        '409': { description: The pilot has a different existing approval reference }
  /social-events/event-research/runs:
    get:
      tags: [Event research]
      summary: List research runs and checkpoints
      operationId: listEventResearchRuns
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Research runs
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EventResearchRun' } }
    post:
      tags: [Event research]
      summary: Idempotently start a research run by run key
      operationId: createEventResearchRun
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventResearchRunCreate' }
      responses:
        '200':
          description: Existing or newly created run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventResearchRun' }
  /social-events/event-research/runs/{runId}:
    put:
      tags: [Event research]
      summary: Commit a run checkpoint or terminal status
      operationId: updateEventResearchRun
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventResearchRunUpdate' }
      responses:
        '200':
          description: Updated run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventResearchRun' }
        '409': { description: A completed run cannot be reopened }
  /social-events/event-research/candidates:
    get:
      tags: [Event research]
      summary: List accumulated research candidates
      operationId: listEventResearchCandidates
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: provider, in: query, schema: { type: string } }
        - { name: review_state, in: query, schema: { type: string, enum: [draft, review, discarded] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Research candidates
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EventResearchCandidate' } }
    put:
      tags: [Event research]
      summary: Idempotently create, update, or reverify a candidate
      description: Uses provider plus external identifier as the canonical key. It never publishes a social event.
      operationId: upsertEventResearchCandidate
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventResearchCandidateWrite' }
      responses:
        '200':
          description: Upserted candidate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventResearchCandidate' }
        '409': { description: Pilot cap reached or a closed run received a material change }
  /social-events/event-research/candidates/{candidateId}/materialize:
    post:
      tags: [Event research]
      summary: Idempotently materialize an approved high-confidence candidate
      description: >-
        Resolves or creates related venue and artist entities, links the provider reference,
        links the candidate, and appends one immutable audit change in a single transaction.
        Replays return the existing link without changing manually edited event fields. A
        missing official event end is allowed; all other publication blockers are rejected.
      operationId: materializeEventResearchCandidate
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: candidateId, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventResearchMaterializationRequest' }
      responses:
        '200':
          description: Existing or newly materialized event link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventResearchMaterialization' }
        '400': { description: Malformed candidate identifier or request }
        '403': { description: Strict administrator access is required }
        '404': { description: Candidate not found }
        '409': { description: 'Pilot not approved, candidate ineligible, or entity identity ambiguous' }
  /social-events/event-research/changes:
    get:
      tags: [Event research]
      summary: List immutable candidate change records
      operationId: listEventResearchChanges
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: run_id, in: query, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Auditable candidate changes
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EventResearchChange' } }
  /version:
    get:
      summary: Get API Version
      description: Returns version and build information for the running API server.
      operationId: getVersion
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /health:
    get:
      summary: Health Check
      description: Checks the health of the API server and its database connection.
      operationId: getHealth
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /login:
    post:
      summary: Login with username or email
      description: Authenticates a user, sets a session cookie, and returns a bearer token plus role metadata.
      operationId: login
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated successfully
          headers:
            Set-Cookie:
              description: Session cookie for browser-based clients.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
  /login/google:
    post:
      summary: Login with Google
      description: Validates a Google ID token, sets a session cookie, and issues a session. Creates a Customer/Fan account when the email is new.
      operationId: loginWithGoogle
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: Authenticated successfully
          headers:
            Set-Cookie:
              description: Session cookie for browser-based clients.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid or expired Google token
  /signup:
    post:
      summary: Create an account
      description: Registers a new party + credential pair, sets a session cookie, and returns a ready-to-use token.
      operationId: signup
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '200':
          description: Account created
          headers:
            Set-Cookie:
              description: Session cookie for browser-based clients.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '409':
          description: Email already registered
  /session:
    get:
      summary: Get current session
      description: Returns the authenticated user snapshot resolved by the backend, including published modules, or null when there is no valid session.
      operationId: getSession
      responses:
        '200':
          description: Current authenticated session, or null when the request is anonymous
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SessionResponse'
                nullable: true
  /session/logout:
    post:
      summary: Revoke and clear current session
      description: Revokes every valid bearer token or session cookie presented with the request, then expires the browser session cookie. The operation is idempotent and also succeeds for an anonymous request.
      operationId: logoutSession
      security:
        - bearerAuth: [ ]
        - sessionCookie: [ ]
        - { }
      responses:
        '200':
          description: Presented session credentials revoked and browser cookie cleared
          headers:
            Set-Cookie:
              description: Expired session cookie.
              schema:
                type: string
  /session/preferences:
    get:
      summary: Get locale preferences
      operationId: getLocalePreferences
      responses:
        '200':
          description: Current user locale, currency, and timezone preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalePreferences'
        '401':
          description: Authentication required
  /session/currency-conversions:
    post:
      summary: Record an audited currency conversion
      operationId: recordCurrencyConversion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrencyConversionAuditCreate'
      responses:
        '200':
          description: Conversion recorded
        '400':
          description: Invalid currency, amount, rate, or source
        '401':
          description: Authentication required
    put:
      summary: Update locale preferences
      operationId: updateLocalePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalePreferencesUpdate'
      responses:
        '200':
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalePreferences'
        '400':
          description: Unsupported locale, currency, timezone, or country
        '401':
          description: Authentication required
  /public/courses/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Courses]
      summary: Get course metadata
      description: Returns public metadata for a course landing page.
      operationId: getCourseMetadata
      security: [ ]
      responses:
        '200':
          description: Course metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseMetadata'
        '404':
          description: Course not found
  /public/courses/{slug}/registrations:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Courses]
      summary: Create course registration and seat hold
      description: Creates an idempotent canonical checkout and atomic expiring seat hold when course commerce is enabled. When the production domain gate is disabled, it preserves the legacy lead without claiming a seat or payment.
      operationId: createCourseRegistration
      security: [ ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseRegistrationRequest'
      responses:
        '201':
          description: Registration checkout or honest gated lead state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseCheckoutResponse'
        '400':
          description: Invalid payload
        '404':
          description: Course not found
        '409':
          description: No approved active policy, duplicate attendee, or no seat remains
        '503':
          description: Checkout domain or provider configuration unavailable
  /public/courses/{slug}/registrations/{registrationId}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: registrationId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      - $ref: '#/components/parameters/OrderLookupToken'
    get:
      tags: [Courses]
      summary: Track a course checkout and enrollment
      description: Returns customer-safe payment and enrollment states. Invalid identifiers and lookup tokens share the same not-found response.
      operationId: getCourseCheckout
      security: [ ]
      responses:
        '200':
          description: Course checkout state
          content: { application/json: { schema: { $ref: '#/components/schemas/CourseCheckoutResponse' } } }
        '404': { description: Course order not found }
  /public/courses/{slug}/registrations/{registrationId}/datafast/checkout:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: registrationId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      - $ref: '#/components/parameters/OrderLookupToken'
    post:
      tags: [Courses]
      summary: Create a bound Datafast course checkout
      operationId: createCourseDatafastCheckout
      security: [ ]
      responses:
        '200':
          description: Hosted Datafast checkout resource
          content: { application/json: { schema: { $ref: '#/components/schemas/DatafastCheckout' } } }
        '404': { description: Course order not found }
        '409': { description: Hold expired, paid, or another payment rail is active }
        '503': { description: Datafast or course checkout is disabled }
  /public/courses/{slug}/registrations/{registrationId}/datafast/status:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: registrationId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      - $ref: '#/components/parameters/OrderLookupToken'
      - name: resourcePath
        in: query
        required: true
        schema: { type: string, minLength: 1, maxLength: 512 }
    get:
      tags: [Courses]
      summary: Verify Datafast status server to server
      description: A browser return never marks payment paid; the server binds and verifies resource path, order, amount, currency, merchant, and environment.
      operationId: confirmCourseDatafastStatus
      security: [ ]
      responses:
        '200':
          description: Verified or still-pending checkout state
          content: { application/json: { schema: { $ref: '#/components/schemas/CourseCheckoutResponse' } } }
        '404': { description: Course order not found }
        '409': { description: Binding mismatch or expired hold }
        '502': { description: Provider response failed verification }
  /public/courses/{slug}/registrations/{registrationId}/paypal/create:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: registrationId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      - $ref: '#/components/parameters/OrderLookupToken'
    post:
      tags: [Courses]
      summary: Create a bound PayPal course order
      operationId: createCoursePaypalOrder
      security: [ ]
      responses:
        '200':
          description: PayPal order awaiting customer approval
          content: { application/json: { schema: { $ref: '#/components/schemas/PaypalCreate' } } }
        '404': { description: Course order not found }
        '409': { description: Hold expired, paid, or another payment rail is active }
        '503': { description: PayPal or course checkout is disabled }
  /public/courses/{slug}/registrations/{registrationId}/paypal/capture:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: registrationId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      - $ref: '#/components/parameters/OrderLookupToken'
    post:
      tags: [Courses]
      summary: Capture and verify a bound PayPal course order
      operationId: captureCoursePaypalOrder
      security: [ ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CoursePaypalCaptureRequest' } } }
      responses:
        '200':
          description: Verified or still-processing checkout state
          content: { application/json: { schema: { $ref: '#/components/schemas/CourseCheckoutResponse' } } }
        '404': { description: Course order not found }
        '409': { description: Binding mismatch or expired hold }
        '502': { description: Provider capture failed verification }
  /webhooks/whatsapp:
    get:
      tags: [Webhooks]
      summary: Verify WhatsApp webhook
      description: Echoes the hub.challenge parameter when the verify token matches.
      operationId: verifyWhatsAppWebhook
      security: [ ]
      parameters:
        - name: hub.mode
          in: query
          required: false
          schema:
            type: string
        - name: hub.verify_token
          in: query
          required: false
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Challenge echoed
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Verify token mismatch
    post:
      tags: [Webhooks]
      summary: Receive WhatsApp webhook
      description: Consumes WhatsApp Cloud API message payloads and triggers keyword-based enrollment.
      operationId: handleWhatsAppWebhook
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppWebhook'
      responses:
        '204':
          description: Processed
  /instagram/reply:
    post:
      tags: [Instagram]
      summary: Send Instagram reply
      description: Sends a manual Instagram reply and stores it.
      operationId: sendInstagramReply
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [irSenderId, irMessage]
              properties:
                irSenderId:
                  type: string
                irMessage:
                  type: string
                irExternalId:
                  type: string
                  description: Optional externalId of the inbound message to mark it as replied.
      responses:
        '200':
          description: Reply status
          content:
            application/json:
              schema:
                type: object
  /instagram/messages:
    get:
      tags: [Instagram]
      summary: List Instagram inbox messages
      description: Returns stored Instagram messages for auto-reply tracking. Deleted or unsent inbound messages are excluded from the inbox feed.
      operationId: listInstagramMessages
      security:
        - bearerAuth: [ ]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [incoming, outgoing, all]
            default: all
        - name: repliedOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Messages list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SocialInboxMessage'
  /facebook/reply:
    post:
      tags: [Facebook]
      summary: Send Facebook reply
      description: Sends a manual Facebook Messenger reply and stores it.
      operationId: sendFacebookReply
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frSenderId, frMessage]
              properties:
                frSenderId:
                  type: string
                frMessage:
                  type: string
                frExternalId:
                  type: string
                  description: Optional externalId of the inbound message to mark it as replied.
      responses:
        '200':
          description: Reply status
          content:
            application/json:
              schema:
                type: object
  /facebook/webhook:
    get:
      tags: [Facebook]
      summary: Verify Facebook webhook
      description: Echoes hub.challenge when verify token matches.
      security: [ ]
      parameters:
        - name: hub.mode
          in: query
          required: false
          schema:
            type: string
        - name: hub.verify_token
          in: query
          required: false
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Verification challenge
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Verify token mismatch
    post:
      tags: [Facebook]
      summary: Receive Facebook webhook
      description: Consumes Meta Page webhook payloads for Messenger inbox ingestion.
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '204':
          description: Processed
  /facebook/messages:
    get:
      tags: [Facebook]
      summary: List Facebook inbox messages
      description: Returns stored Facebook Messenger messages for inbox tracking. Deleted or unsent inbound messages are excluded from the inbox feed.
      operationId: listFacebookMessages
      security:
        - bearerAuth: [ ]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [incoming, outgoing, all]
            default: all
        - name: repliedOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Messages list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SocialInboxMessage'
  /meta/backfill:
    post:
      tags: [Admin]
      summary: Backfill Meta inbox messages
      description: One-time admin trigger to import unread Instagram/Facebook messages from Graph API.
      operationId: backfillMetaInbox
      security:
        - bearerAuth: [ ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                platform:
                  type: string
                  enum: [all, instagram, facebook]
                conversationLimit:
                  type: integer
                messagesPerConversation:
                  type: integer
                onlyUnread:
                  type: boolean
                dryRun:
                  type: boolean
      responses:
        '200':
          description: Backfill result
          content:
            application/json:
              schema:
                type: object
  /whatsapp/reply:
    post:
      tags: [WhatsApp]
      summary: Send WhatsApp reply
      description: Sends a manual WhatsApp reply and stores it.
      operationId: sendWhatsAppReply
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wrSenderId, wrMessage]
              properties:
                wrSenderId:
                  type: string
                wrMessage:
                  type: string
                wrExternalId:
                  type: string
