                  $ref: '#/components/schemas/SecurityAuditEvent'
  /catalog/security/party-role-revisions:
    post:
      tags: [Catalog security]
      summary: Create a party-role grant draft
      operationId: createPartyRoleGrantRevision
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyRoleGrantDraft'
      responses:
        '201':
          description: Draft created; it grants no access until separately approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityGrantRevision'
        '409':
          description: Version conflict, duplicate correlation id, or no effective change.
  /catalog/security/role-permission-revisions:
    post:
      tags: [Catalog security]
      summary: Create a role-permission grant draft
      operationId: createRolePermissionGrantRevision
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePermissionGrantDraft'
      responses:
        '201':
          description: Draft created; it grants no access until separately approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityGrantRevision'
  /catalog/security/revisions/{revisionId}/submit:
    post:
      tags: [Catalog security]
      summary: Submit a security revision for review
      operationId: submitSecurityGrantRevision
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/SecurityRevisionId'
      responses:
        '200':
          description: Revision entered review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityGrantRevision'
  /catalog/security/revisions/{revisionId}/approve:
    post:
      tags: [Catalog security]
      summary: Approve and publish a security revision
      description: Normal approval requires a different actor. Documented emergency self-approval is capability-gated and audited.
      operationId: approveSecurityGrantRevision
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/SecurityRevisionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityGrantReview'
      responses:
        '200':
          description: Revision published and canonical grant updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityGrantRevision'
        '403':
          description: Missing approval capability or prohibited self-approval.
        '409':
          description: Invalid state or optimistic-lock conflict.
  /catalog/security/revisions/{revisionId}/reject:
    post:
      tags: [Catalog security]
      summary: Reject a security revision
      operationId: rejectSecurityGrantRevision
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/SecurityRevisionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityGrantReview'
      responses:
        '200':
          description: Revision rejected without changing the canonical grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityGrantRevision'
  /fans/me/role-request:
    post:
      tags: [Fans, Catalog security]
      summary: Request the persisted Fan role for the authenticated account
      description: Creates a submitted security revision for the caller only. It does not grant access until a distinct authorized reviewer approves it.
      operationId: requestMyFanRole
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelfFanRoleRequest'
      responses:
        '202':
          description: Request entered the security review queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityGrantRevision'
        '409':
          description: The role is already active or an equivalent request is already pending.
  /admin/users:
    get:
      tags: [Admin]
      summary: List user credentials
      description: Returns the full admin view of user accounts, including modules and status.
      operationId: adminListUsers
      security:
        - bearerAuth: [ ]
      parameters:
        - name: includeInactive
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Accounts fetched
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAccount'
    post:
      tags: [Admin]
      summary: Create user for an existing party
      description: |
        Generates credentials for a party. If no password is provided the system creates a strong temporary password,
        stores the hash, and emails the welcome message with username + password.
      operationId: adminCreateUser
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserAccountRequest'
      responses:
        '201':
          description: User created and welcome email dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '400':
          description: Missing party email or invalid payload
        '404':
          description: Party not found
  /admin/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Admin]
      summary: Get user account
      description: Returns the credential, linked party, active flag, and derived modules.
      operationId: adminGetUser
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Account found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '404':
          description: Not found
    patch:
      tags: [Admin]
      summary: Update user account
      description: Update username, active flag, roles, or force a password reset for a specific user.
      operationId: adminUpdateUser
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserAccountRequest'
      responses:
        '200':
          description: Account updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '404':
          description: Not found
  /chat/threads:
    get:
      tags: [Chat]
      summary: List chat threads
