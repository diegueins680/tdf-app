openapi: 3.0.0
info:
  title: TDF Records API
  version: 1.0.0
  description: Full API for TDF Records platform

servers:
  - url: http://localhost:8080
    description: Development server

paths:
  /services/storefront:
    get:
      operationId: listServiceStorefrontPackages
      summary: List active mixing and mastering packages
      security: []
      responses:
        '200':
          description: Server-authoritative active packages
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ServiceStorefrontPackage' } }
  /services/storefront/{packageId}:
    get:
      operationId: getServiceStorefrontPackage
      summary: Get an active service package
      security: []
      parameters:
        - { name: packageId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Package, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceStorefrontPackage' } } } }
        '404': { description: Package is absent or inactive }
  /services/storefront/order:
    post:
      operationId: createServiceStorefrontOrder
      summary: Create an unpaid service order from an authoritative package
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Opaque retry key. Reuse with a different request is rejected.
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ServiceStorefrontOrderCreate' } } }
      responses:
        '200':
          description: Unpaid order. The lookup token is returned only in this response.
          content: { application/json: { schema: { $ref: '#/components/schemas/ServiceStorefrontOrder' } } }
        '400': { description: Invalid customer or package quantity }
        '409': { description: Idempotency key was reused with a different request }
  /services/storefront/order/{orderNumber}:
    get:
      operationId: getServiceStorefrontOrder
      summary: Read a guest service order using its private lookup capability
      security: []
      parameters:
        - { name: orderNumber, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/OrderLookupToken' }
      responses:
        '200': { description: Customer-safe order, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceStorefrontOrder' } } } }
        '404': { description: Order or lookup capability not found }
  /services/storefront/order/{orderNumber}/datafast/checkout:
    post:
      operationId: createServiceDatafastCheckout
      summary: Create or resume an idempotent Datafast checkout resource
      security: []
      parameters:
        - { name: orderNumber, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/OrderLookupToken' }
      responses:
        '200': { description: Hosted Datafast widget resource, content: { application/json: { schema: { $ref: '#/components/schemas/DatafastCheckout' } } } }
        '409': { description: Order is not payable }
        '502': { description: Provider request failed closed }
  /services/storefront/datafast/status:
    get:
      operationId: verifyServiceDatafastPayment
      summary: Verify Datafast status server-to-server
      description: Browser return alone never marks an order paid. Amount, currency, checkout resource, payment ID, and merchant reference are bound on the server.
      security: []
      parameters:
        - { name: orderId, in: query, required: true, schema: { type: string } }
        - { name: resourcePath, in: query, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/OrderLookupToken' }
      responses:
        '200': { description: Verified current order state, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceStorefrontOrder' } } } }
        '400': { description: Resource binding failed }
        '502': { description: Provider response failed verification }
  /services/storefront/order/{orderNumber}/paypal/create:
    post:
      operationId: createServicePayPalOrder
      summary: Create or resume a PayPal Order
      security: []
      parameters:
        - { name: orderNumber, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/OrderLookupToken' }
      responses:
        '200': { description: PayPal order reference, content: { application/json: { schema: { $ref: '#/components/schemas/PayPalOrderCreate' } } } }
        '502': { description: Provider request failed closed }
  /services/storefront/paypal/capture:
    post:
      operationId: captureServicePayPalOrder
      summary: Capture and bind a PayPal Order server-to-server
      security: []
      parameters:
        - { $ref: '#/components/parameters/OrderLookupToken' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PayPalCaptureRequest' } } }
      responses:
        '200': { description: Verified order state, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceStorefrontOrder' } } } }
        '400': { description: PayPal reference mismatch }
        '502': { description: Capture response failed verification }
  /services/storefront/order/{orderNumber}/manual-payment:
    post:
      operationId: selectServiceManualPayment
      summary: Select a manual payment rail without confirming payment
      security: []
      parameters:
        - { name: orderNumber, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/OrderLookupToken' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ServiceManualPaymentCreate' } } }
      responses:
        '200': { description: Order awaiting staff verification, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceStorefrontOrder' } } } }
        '409': { description: Order is not awaiting payment }
  /version:
    get:
      summary: Get API Version
      description: Returns version and build information for the running API server.
      operationId: getVersion
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /health:
    get:
      summary: Health Check
      description: Checks the health of the API server and its database connection.
      operationId: getHealth
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /login:
    post:
      summary: Login with username or email
      description: Authenticates a user, sets a session cookie, and returns a bearer token plus role metadata.
      operationId: login
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated successfully
          headers:
            Set-Cookie:
              description: Session cookie for browser-based clients.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
  /login/google:
    post:
      summary: Login with Google
      description: Validates a Google ID token, sets a session cookie, and issues a session. Creates a Customer/Fan account when the email is new.
      operationId: loginWithGoogle
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: Authenticated successfully
          headers:
            Set-Cookie:
              description: Session cookie for browser-based clients.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid or expired Google token
  /signup:
    post:
      summary: Create an account
      description: Registers a new party + credential pair, sets a session cookie, and returns a ready-to-use token.
      operationId: signup
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '200':
          description: Account created
          headers:
            Set-Cookie:
              description: Session cookie for browser-based clients.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '409':
          description: Email already registered
  /session:
    get:
      summary: Get current session
      description: Returns the authenticated user snapshot resolved by the backend, including published modules, or null when there is no valid session.
      operationId: getSession
      responses:
        '200':
          description: Current authenticated session, or null when the request is anonymous
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SessionResponse'
                nullable: true
  /session/logout:
    post:
      summary: Clear current session
      description: Clears the browser session cookie for the current user.
      operationId: logoutSession
      responses:
        '200':
          description: Session cleared
          headers:
            Set-Cookie:
              description: Expired session cookie.
              schema:
                type: string
  /session/preferences:
    get:
      summary: Get locale preferences
      operationId: getLocalePreferences
      responses:
        '200':
          description: Current user locale, currency, and timezone preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalePreferences'
        '401':
          description: Authentication required
  /session/currency-conversions:
    post:
      summary: Record an audited currency conversion
      operationId: recordCurrencyConversion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrencyConversionAuditCreate'
      responses:
        '200':
          description: Conversion recorded
        '400':
          description: Invalid currency, amount, rate, or source
        '401':
          description: Authentication required
    put:
      summary: Update locale preferences
      operationId: updateLocalePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalePreferencesUpdate'
      responses:
        '200':
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalePreferences'
        '400':
          description: Unsupported locale, currency, timezone, or country
        '401':
          description: Authentication required
  /public/courses/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Courses]
      summary: Get course metadata
      description: Returns public metadata for a course landing page.
      operationId: getCourseMetadata
      security: [ ]
      responses:
        '200':
          description: Course metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseMetadata'
        '404':
          description: Course not found
  /public/courses/{slug}/registrations:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Courses]
      summary: Create course registration
      description: Stores a registration for the specified course. Landing submissions use source=landing and include UTM tags.
      operationId: createCourseRegistration
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseRegistrationRequest'
      responses:
        '201':
          description: Registration stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseRegistrationResponse'
        '400':
          description: Invalid payload
        '404':
          description: Course not found
  /webhooks/whatsapp:
    get:
      tags: [Webhooks]
      summary: Verify WhatsApp webhook
      description: Echoes the hub.challenge parameter when the verify token matches.
      operationId: verifyWhatsAppWebhook
      security: [ ]
      parameters:
        - name: hub.mode
          in: query
          required: false
          schema:
            type: string
        - name: hub.verify_token
          in: query
          required: false
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Challenge echoed
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Verify token mismatch
    post:
      tags: [Webhooks]
      summary: Receive WhatsApp webhook
      description: Consumes WhatsApp Cloud API message payloads and triggers keyword-based enrollment.
      operationId: handleWhatsAppWebhook
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppWebhook'
      responses:
        '204':
          description: Processed
  /instagram/reply:
    post:
      tags: [Instagram]
      summary: Send Instagram reply
      description: Sends a manual Instagram reply and stores it.
      operationId: sendInstagramReply
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [irSenderId, irMessage]
              properties:
                irSenderId:
                  type: string
                irMessage:
                  type: string
                irExternalId:
                  type: string
                  description: Optional externalId of the inbound message to mark it as replied.
      responses:
        '200':
          description: Reply status
          content:
            application/json:
              schema:
                type: object
  /instagram/messages:
    get:
      tags: [Instagram]
      summary: List Instagram inbox messages
      description: Returns stored Instagram messages for auto-reply tracking. Deleted or unsent inbound messages are excluded from the inbox feed.
      operationId: listInstagramMessages
      security:
        - bearerAuth: [ ]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [incoming, outgoing, all]
            default: all
        - name: repliedOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Messages list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SocialInboxMessage'
  /facebook/reply:
    post:
      tags: [Facebook]
      summary: Send Facebook reply
      description: Sends a manual Facebook Messenger reply and stores it.
      operationId: sendFacebookReply
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frSenderId, frMessage]
              properties:
                frSenderId:
                  type: string
                frMessage:
                  type: string
                frExternalId:
                  type: string
                  description: Optional externalId of the inbound message to mark it as replied.
      responses:
        '200':
          description: Reply status
          content:
            application/json:
              schema:
                type: object
  /facebook/webhook:
    get:
      tags: [Facebook]
      summary: Verify Facebook webhook
      description: Echoes hub.challenge when verify token matches.
      security: [ ]
      parameters:
        - name: hub.mode
          in: query
          required: false
          schema:
            type: string
        - name: hub.verify_token
          in: query
          required: false
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Verification challenge
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Verify token mismatch
    post:
      tags: [Facebook]
      summary: Receive Facebook webhook
      description: Consumes Meta Page webhook payloads for Messenger inbox ingestion.
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '204':
          description: Processed
  /facebook/messages:
    get:
      tags: [Facebook]
      summary: List Facebook inbox messages
      description: Returns stored Facebook Messenger messages for inbox tracking. Deleted or unsent inbound messages are excluded from the inbox feed.
      operationId: listFacebookMessages
      security:
        - bearerAuth: [ ]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [incoming, outgoing, all]
            default: all
        - name: repliedOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Messages list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SocialInboxMessage'
  /meta/backfill:
    post:
      tags: [Admin]
      summary: Backfill Meta inbox messages
      description: One-time admin trigger to import unread Instagram/Facebook messages from Graph API.
      operationId: backfillMetaInbox
      security:
        - bearerAuth: [ ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                platform:
                  type: string
                  enum: [all, instagram, facebook]
                conversationLimit:
                  type: integer
                messagesPerConversation:
                  type: integer
                onlyUnread:
                  type: boolean
                dryRun:
                  type: boolean
      responses:
        '200':
          description: Backfill result
          content:
            application/json:
              schema:
                type: object
  /whatsapp/reply:
    post:
      tags: [WhatsApp]
      summary: Send WhatsApp reply
      description: Sends a manual WhatsApp reply and stores it.
      operationId: sendWhatsAppReply
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wrSenderId, wrMessage]
              properties:
                wrSenderId:
                  type: string
                wrMessage:
                  type: string
                wrExternalId:
                  type: string
                  description: Optional externalId of the inbound message to mark it as replied.
      responses:
        '200':
          description: Reply status
          content:
            application/json:
              schema:
                type: object
  /whatsapp/messages:
    get:
      tags: [WhatsApp]
      summary: List WhatsApp inbox messages
      description: Returns stored WhatsApp messages for auto-reply tracking.
      operationId: listWhatsAppMessages
      security:
        - bearerAuth: [ ]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [incoming, outgoing, all]
            default: all
        - name: repliedOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Messages list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SocialInboxMessage'
  /whatsapp/consent:
    post:
      tags: [WhatsApp]
      summary: Record WhatsApp consent (admin)
      description: Stores explicit consent and optionally sends a confirmation message.
      operationId: createWhatsAppConsent
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppConsentRequest'
      responses:
        '200':
          description: Consent stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppConsentResponse'
        '400':
          description: Invalid payload
    get:
      tags: [WhatsApp]
      summary: Fetch WhatsApp consent status (admin)
      operationId: getWhatsAppConsent
      security:
        - bearerAuth: [ ]
      parameters:
        - name: phone
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Consent status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppConsentStatus'
        '400':
          description: Missing or invalid phone
  /whatsapp/opt-out:
    post:
      tags: [WhatsApp]
      summary: Revoke WhatsApp consent (admin)
      operationId: optOutWhatsAppConsent
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppOptOutRequest'
      responses:
        '200':
          description: Consent revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppConsentResponse'
        '400':
          description: Invalid payload
  /public/whatsapp/consent:
    post:
      tags: [WhatsApp]
      summary: Record WhatsApp consent (public)
      description: Stores explicit consent and optionally sends a confirmation message.
      operationId: createWhatsAppConsentPublic
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppConsentRequest'
      responses:
        '200':
          description: Consent stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppConsentResponse'
        '400':
          description: Invalid payload
    get:
      tags: [WhatsApp]
      summary: Fetch WhatsApp consent status (public)
      operationId: getWhatsAppConsentPublic
      security: [ ]
      parameters:
        - name: phone
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Consent status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppConsentStatus'
        '400':
          description: Missing or invalid phone
  /public/whatsapp/opt-out:
    post:
      tags: [WhatsApp]
      summary: Revoke WhatsApp consent (public)
      operationId: optOutWhatsAppConsentPublic
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppOptOutRequest'
      responses:
        '200':
          description: Consent revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppConsentResponse'
        '400':
          description: Invalid payload
  /admin/courses/{slug}/registrations/{registrationId}/status:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: registrationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      tags: [Admin]
      summary: Update course registration status
      description: Marks a course registration as paid or cancelled.
      operationId: updateCourseRegistrationStatus
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseRegistrationStatusUpdate'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseRegistrationResponse'
        '404':
          description: Registration not found
  /admin/artists/enrichment/overview:
    get:
      tags: [Admin]
      summary: Inspect artist enrichment inventory and review queues
      operationId: getArtistEnrichmentOverview
      security:
        - bearerAuth: [ ]
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: artistId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Complete enrichment overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistEnrichmentOverview'
        '401': { description: Authentication required }
        '403': { description: Strict Admin role required }
  /admin/artists/enrichment/runs:
    get:
      tags: [Admin]
      summary: List artist enrichment runs
      operationId: listArtistEnrichmentRuns
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Recent runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ArtistEnrichmentRun' }
    post:
      tags: [Admin]
      summary: Start or safely resume artist enrichment
      operationId: runArtistEnrichment
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtistEnrichmentRunRequest' }
      responses:
        '200':
          description: Run result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtistEnrichmentRun' }
  /admin/artists/enrichment/runs/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      tags: [Admin]
      summary: Checkpoint an external enrichment run
      operationId: updateArtistEnrichmentRun
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtistEnrichmentRunUpdate' }
      responses:
        '200':
          description: Durable updated run state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtistEnrichmentRun' }
  /admin/artists/enrichment/artists/{artistId}/rerun:
    parameters:
      - name: artistId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Admin]
