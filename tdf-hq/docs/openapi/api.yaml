          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceCart' }
  /marketplace/cart/{cartId}:
    parameters:
      - $ref: '#/components/parameters/MarketplaceCartId'
    get:
      tags: [Marketplace]
      summary: Read a guest marketplace cart
      operationId: getMarketplaceCart
      security: [ ]
      responses:
        '200':
          description: Current cart snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceCart' }
        '404': { description: Cart not found }
  /marketplace/cart/{cartId}/items:
    parameters:
      - $ref: '#/components/parameters/MarketplaceCartId'
    post:
      tags: [Marketplace]
      summary: Add, replace, or remove one unique sale or dated rental asset
      description: Sale and rental assets use separate carts. Rentals require both inclusive dates and an approved active server-side terms version; quantities greater than one are rejected.
      operationId: upsertMarketplaceCartItem
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplaceCartItemUpdate' }
      responses:
        '200':
          description: Updated cart with server-calculated totals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceCart' }
        '400': { description: Invalid listing, quantity, date range, or rental request }
        '404': { description: Cart or listing not found }
        '409': { description: Asset is no longer available }
  /marketplace/cart/{cartId}/checkout:
    parameters:
      - $ref: '#/components/parameters/MarketplaceCartId'
    post:
      tags: [Marketplace]
      summary: Create an unpaid manual-payment marketplace order and atomic asset hold
      description: The Idempotency-Key binds an immutable sale or dated-rental checkout snapshot. Rental terms and identity fields are required for rentals; the full document number is validated and discarded. Selecting bank transfer never confirms payment.
      operationId: checkoutMarketplaceCart
      security: [ ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplaceCheckoutRequest' }
      responses:
        '200':
          description: Created or idempotently recovered order awaiting manual confirmation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceOrder' }
        '400': { description: Invalid buyer, fulfillment, address, or cart snapshot }
        '409': { description: Idempotency conflict or asset is already held }
        '429': { description: Public request rate limit exceeded }
        '503': { description: The matching marketplace sales or rentals capability is disabled }
