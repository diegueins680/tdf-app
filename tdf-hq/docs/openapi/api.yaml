              schema: { $ref: '#/components/schemas/MarketplaceOrder' }
        '400': { description: Invalid transition or condition/deposit payload }
        '403': { description: Operations access required }
        '404': { description: Canonical rental order not found }
        '409': { description: Transition, custody, payment, or deposit-settlement precondition failed }
