      - $ref: '#/components/parameters/ServiceStorefrontOrderId'
    post:
      tags: [Admin, Service storefront]
      summary: Compare an order binding with the provider without changing payment state
      operationId: adminReconcileServiceStorefrontOrder
      responses:
        '200':
          description: Read-only provider comparison; mismatches create an operator exception
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceStorefrontReconciliation' }
        '403': { description: Strict Admin role required }
        '404': { description: Order or provider binding not found }
        '501': { description: Provider reconciliation capability is unavailable }
        '502': { description: Provider status could not be read }
  /admin/commerce/provider-events:
    get:
      tags: [Admin, Commerce operations]
      summary: List redacted provider-event inbox records
      description: Strict-admin operational view. Encrypted payloads and merchant-account references are never returned.
      operationId: adminListCommerceProviderEvents
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, processing, processed, retry, dead_letter, ignored]
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
      responses:
        '200':
          description: Redacted provider-event records ordered newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CommerceProviderEvent' }
        '400': { description: Invalid filter }
        '403': { description: Strict Admin role required }
  /admin/commerce/provider-events/{eventId}/replay:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Admin, Commerce operations]
      summary: Requeue one dead-letter provider event with immutable operator evidence
      description: Requeueing does not mark an order paid. The bounded worker reprocesses only the original signature-verified encrypted payload.
      operationId: adminReplayCommerceProviderEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommerceProviderEventReplayCreate' }
      responses:
        '200':
          description: Event moved from dead_letter to retry with an immutable action record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommerceProviderEvent' }
        '400': { description: Invalid event ID or replay reason }
        '403': { description: Strict Admin role required }
        '404': { description: Provider event not found }
        '409': { description: Event is not currently dead-lettered }
  /bookings/public/availability:
    get:
      tags: [Public bookings]
      summary: Check authoritative room availability and approved booking price
      description: Availability is advisory until checkout atomically creates the exclusion-backed hold. Quote is omitted when no approved active commerce policy exists.
      operationId: getPublicBookingAvailability
      security: [ ]
      parameters:
        - name: serviceOfferingId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: startsAt
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: durationMinutes
          in: query
          required: true
          schema: { type: integer, minimum: 30, maximum: 840 }
      responses:
        '200':
          description: Availability and optional server-authoritative quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicBookingAvailability' }
        '400': { description: Invalid schedule input }
        '422': { description: Service offering is not selectable }
  /bookings/public:
    post:
      tags: [Public bookings]
      summary: Create an honest unpaid tentative booking
      description: Compatibility path used when no approved payable-booking policy is active. It never reports payment or confirmation.
      operationId: createPublicTentativeBooking
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicBookingCreate' }
      responses:
        '200':
          description: Tentative booking created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '409': { description: Resource was reserved by another request }
        '422': { description: Invalid service relationship }
  /bookings/public/checkout:
    post:
      tags: [Public bookings, Checkout]
      summary: Create a canonical confirmation-deposit checkout and atomic resource hold
      description: Requires an approved versioned policy. The response is awaiting_payment; creating it does not mean the deposit is paid or the session confirmed.
      operationId: createPublicBookingCheckout
      security: [ ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicBookingCheckoutCreate' }
      responses:
        '200':
          description: Canonical checkout and temporary resource hold
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicBookingCheckout' }
        '409': { description: Idempotency conflict, missing approved policy, or atomic resource contention }
        '503': { description: Domain checkout is disabled in this environment }
  /bookings/public/orders/{bookingId}:
    get:
      tags: [Public bookings, Checkout]
      summary: Read customer-safe booking checkout status
      description: Unknown orders and invalid lookup tokens return the same response to resist enumeration.
      operationId: getPublicBookingCheckout
      security: [ ]
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - name: X-Order-Lookup-Token
          in: header
          required: true
          schema: { type: string, minLength: 32, writeOnly: true }
      responses:
        '200':
          description: Current payment and separate fulfillment state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicBookingCheckout' }
        '404': { description: Booking order not found }
  /bookings/public/orders/{bookingId}/datafast/checkout:
    post:
      tags: [Public bookings, Checkout]
      summary: Create or replay the booking deposit's bound Datafast checkout
      description: Requires the scoped guest lookup capability. Creating a hosted checkout never marks the deposit paid or confirms fulfillment.
      operationId: createPublicBookingDatafastCheckout
      security: [ ]
      parameters:
        - $ref: '#/components/parameters/PublicBookingId'
        - $ref: '#/components/parameters/OrderLookupToken'
      responses:
        '200':
          description: Bound Datafast hosted-checkout resource
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatafastCheckout' }
        '404': { description: Booking order not found }
        '409': { description: Expired/already-paid booking or immutable provider-binding conflict }
        '503': { description: Booking domain or Datafast rail is disabled/misconfigured }
  /bookings/public/orders/{bookingId}/datafast/status:
    get:
      tags: [Public bookings, Checkout]
      summary: Verify the booking deposit against Datafast server-to-server
      description: A browser return is not payment evidence. The supplied path must exactly match the stored checkout binding; only the server-held merchant credential queries Datafast.
      operationId: confirmPublicBookingDatafastStatus
      security: [ ]
      parameters:
        - $ref: '#/components/parameters/PublicBookingId'
        - $ref: '#/components/parameters/OrderLookupToken'
        - name: resourcePath
          in: query
          required: true
          schema: { type: string, pattern: '^/v1/checkouts/[A-Za-z0-9_.-]+/payment$' }
      responses:
        '200':
          description: Current server-verified payment and separate fulfillment state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicBookingCheckout' }
        '404': { description: Booking order not found }
        '409': { description: Binding conflict or verified late payment requires staff reconciliation }
        '502': { description: Provider failure or amount/currency/reference mismatch }
  /bookings/public/orders/{bookingId}/paypal/create:
    post:
      tags: [Public bookings, Checkout]
      summary: Create or replay the booking deposit's bound PayPal order
      description: Uses an immutable provider request ID and does not mark the booking paid.
      operationId: createPublicBookingPaypalOrder
      security: [ ]
      parameters:
        - $ref: '#/components/parameters/PublicBookingId'
        - $ref: '#/components/parameters/OrderLookupToken'
      responses:
        '200':
          description: Bound PayPal Orders v2 resource
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaypalCreate' }
        '404': { description: Booking order not found }
        '409': { description: Expired/already-paid booking or immutable provider-binding conflict }
        '503': { description: Booking domain or PayPal rail is disabled/misconfigured }
  /bookings/public/orders/{bookingId}/paypal/capture:
    post:
      tags: [Public bookings, Checkout]
      summary: Capture and server-verify the booking deposit's bound PayPal order
      description: Browser approval alone is not success. The server validates order, merchant, amount, currency, capture ID, and internal booking reference before payment transition.
      operationId: capturePublicBookingPaypalOrder
      security: [ ]
      parameters:
        - $ref: '#/components/parameters/PublicBookingId'
        - $ref: '#/components/parameters/OrderLookupToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicBookingPaypalCapture' }
      responses:
        '200':
          description: Current server-verified payment and separate fulfillment state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicBookingCheckout' }
        '404': { description: Booking order not found }
        '409': { description: Expired booking or PayPal order/binding conflict }
        '502': { description: Provider failure or amount/currency/reference mismatch }
  /bookings/public/orders/{bookingId}/manual-payment:
    post:
      tags: [Public bookings, Checkout]
      summary: Select a manual bank-transfer attempt
      description: Selection creates awaiting-evidence state only. It never confirms payment or fulfillment and is blocked while an online payment attempt is active.
      operationId: selectPublicBookingManualPayment
      security: [ ]
      parameters:
        - $ref: '#/components/parameters/PublicBookingId'
        - $ref: '#/components/parameters/OrderLookupToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicBookingManualPaymentCreate' }
      responses:
        '200':
          description: Awaiting-evidence checkout state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicBookingCheckout' }
        '404': { description: Booking order not found }
        '409': { description: Expired booking or another payment rail is active }
        '503': { description: Manual bank transfer is disabled }
  /bookings/public/orders/{bookingId}/manual-payment/evidence:
    post:
      tags: [Public bookings, Checkout]
      summary: Submit a bank-transfer reference for independent review
      description: The customer reference is immutable during review and cannot mark the checkout paid. Amount and currency come exclusively from the stored checkout.
      operationId: submitPublicBookingManualEvidence
      security: [ ]
      parameters:
        - $ref: '#/components/parameters/PublicBookingId'
        - $ref: '#/components/parameters/OrderLookupToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicBookingManualEvidenceCreate' }
      responses:
        '200':
          description: Evidence submitted; payment remains unconfirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicBookingCheckout' }
        '400': { description: Invalid reference }
        '404': { description: Booking order not found }
        '409': { description: Manual payment was not selected or different evidence is already under review }
  /bookings/{bookingId}/commerce:
    get:
      tags: [Bookings, Commerce operations]
      summary: Read protected booking commerce and manual-evidence details
      operationId: getServiceBookingCommerce
      parameters:
        - $ref: '#/components/parameters/PublicBookingId'
      responses:
        '200':
          description: Booking payment and separate fulfillment projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceBookingCommerce' }
        '403': { description: Invoicing access required }
        '404': { description: Canonical booking commerce order not found }
  /bookings/{bookingId}/manual-payment/review:
    post:
      tags: [Bookings, Commerce operations]
      summary: Independently approve or reject manual-payment evidence
      description: The reviewer must differ from the submitter. Approval atomically verifies immutable bindings, posts the ledger and receipt, and confirms the deposit only while the booking hold remains active.
      operationId: reviewServiceBookingManualPayment
      parameters:
        - $ref: '#/components/parameters/PublicBookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceBookingManualReview' }
      responses:
        '200':
          description: Current truthful booking commerce state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceBookingCommerce' }
        '400': { description: Invalid action or review notes }
        '403': { description: Invoicing access required or separation of duties failed }
        '404': { description: Canonical booking commerce order not found }
        '409': { description: Evidence, checkout, hold, ledger, receipt, or immutable binding conflict }
