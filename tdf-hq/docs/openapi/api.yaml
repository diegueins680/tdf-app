      operationId: listSecurityGrantRevisions
      security:
        - bearerAuth: [ ]
      parameters:
        - name: workflowState
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Security revisions ordered newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SecurityGrantRevision'
  /catalog/security/audit:
    get:
      tags: [Catalog security]
      summary: List immutable security audit events
      operationId: listSecurityAuditEvents
      security:
        - bearerAuth: [ ]
      parameters:
        - name: partyId
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Immutable audit events ordered newest first.
