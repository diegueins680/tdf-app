          type: string
          format: date
          nullable: true
        availability:
          type: string
          maxLength: 4000
          nullable: true
        acceptedTerms:
          type: boolean
          enum: [true]
        termsVersion:
          type: string
          minLength: 1
          maxLength: 160
        musicians:
          type: string
          minLength: 2
          description: >-
            JSON-encoded array of 1 to 50 LiveSessionMusician objects. Only instrumentId is
            accepted for the instrument relationship; instrument and role are invalid fields.
          example: '[{"name":"Ana","instrumentId":"5f710f45-ca5d-450f-a7da-6c7de20b3a4d","isExisting":false}]'
        setlist:
          type: string
          nullable: true
          description: JSON-encoded array of at most 100 LiveSessionSong objects.
          example: '[{"title":"Canción uno","bpm":120,"sortOrder":0}]'
        rider:
          type: string
          format: binary
          nullable: true
          description: Optional rider file, limited by the backend to 10 MiB.
