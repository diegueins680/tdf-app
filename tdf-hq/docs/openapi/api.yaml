        erRunCounters: { type: object, additionalProperties: true }
        erRunErrorSummary: { type: string, maxLength: 4000, nullable: true }
    EventResearchRun:
      allOf:
        - { $ref: '#/components/schemas/EventResearchRunCreate' }
