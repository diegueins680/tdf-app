                $ref: '#/components/schemas/ChatThread'
        '403':
          description: Not allowed
        '404':
          description: Party not found
  /chat/threads/{threadId}/messages:
    parameters:
      - name: threadId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Chat]
      summary: List chat messages
      description: Returns messages for a thread. Use `beforeId` or `afterId` for pagination.
      operationId: listChatMessages
      security:
        - bearerAuth: [ ]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: beforeId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: afterId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
        '404':
          description: Not found
    post:
      tags: [Chat]
      summary: Send a chat message
      description: Sends a message to the thread as the authenticated party.
      operationId: sendChatMessage
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSendMessageRequest'
      responses:
        '200':
          description: Message created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '403':
          description: Not allowed
        '404':
          description: Not found
  /drive/token:
    post:
      tags: [Drive]
      summary: Exchange Google Drive OAuth code
      description: Exchanges a Google OAuth code (PKCE) for Drive tokens.
      operationId: exchangeDriveToken
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriveTokenExchangeRequest'
      responses:
        '200':
          description: Drive token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriveTokenResponse'
        '502':
          description: Google OAuth error
  /drive/token/refresh:
    post:
      tags: [Drive]
      summary: Refresh Google Drive access token
      description: Refreshes a Google Drive access token using a refresh token.
      operationId: refreshDriveToken
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriveTokenRefreshRequest'
      responses:
        '200':
          description: Drive token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriveTokenResponse'
        '502':
          description: Google OAuth error
  /radio/auto-stop-options:
    get:
      tags: [Radio]
      summary: List published browser-broadcast auto-stop options
      description: Returns the specialized persisted options in deterministic order. Exactly one active global option is marked as the broadcast default.
      operationId: listRadioAutoStopOptions
      parameters:
        - name: locale
          in: query
          description: Preferred label locale. Spanish is used unless the locale starts with `en`.
          schema:
            type: string
      responses:
        '200':
          description: Published auto-stop options and the canonical default
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadioAutoStopOptions'
        '503':
          description: Catalog, publication state, or its single effective default is unavailable
  /radio/streams:
    get:
      tags: [Radio]
      summary: Search active radio streams
      description: Returns active streams. Country and genre filtering use immutable UUIDs of active persisted references.
      operationId: searchRadioStreams
      parameters:
        - name: countryId
          in: query
          description: Canonical persisted country UUID; copied codes, labels, and slugs are not accepted.
          schema:
            type: string
            format: uuid
        - name: genreId
          in: query
          description: Canonical persisted genre UUID; copied labels and slugs are not accepted.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Active radio streams in deterministic update order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RadioStream'
        '400':
          description: Unknown or inactive country UUID, or unknown/inactive/unpublished genre UUID
  /radio/streams/active:
    post:
      tags: [Radio]
      summary: Register or reactivate a radio stream
      operationId: upsertActiveRadioStream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RadioStreamUpsert'
      responses:
        '200':
          description: Canonical radio stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadioStream'
        '400':
          description: Invalid stream metadata, unknown/inactive country UUID, or unknown/inactive/unpublished genre UUID
  /radio/streams/import:
    post:
      tags: [Radio]
      summary: Import radio stream sources
      description: Provider country and genre text are retained as review evidence and mapped only when exactly one active persisted reference matches.
      operationId: importRadioStreams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RadioImportRequest'
      responses:
        '200':
          description: Import batch result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadioImportResult'
        '400':
          description: Invalid source list or batch limit
  /radio/streams/refresh-metadata:
    post:
      tags: [Radio]
      summary: Refresh radio metadata
      description: Refreshes station names and observes provider genre text without storing it as a relationship.
      operationId: refreshRadioStreamMetadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RadioMetadataRefreshRequest'
      responses:
        '200':
          description: Refresh batch result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadioMetadataRefreshResult'
        '400':
          description: Invalid refresh limit
  /radio/streams/now-playing:
    post:
      tags: [Radio]
      summary: Get now playing metadata
      description: Returns ICY StreamTitle metadata when the stream provides it.
      operationId: getRadioNowPlaying
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RadioNowPlayingRequest'
      responses:
        '200':
          description: Now playing metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadioNowPlayingResult'
        '400':
          description: Invalid stream url
  /radio/transmissions:
    post:
      tags: [Radio]
      summary: Create a radio transmission
      description: Creates ingest and listening endpoints. The optional genre is referenced only by canonical UUID.
      operationId: createRadioTransmission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RadioTransmissionRequest'
      responses:
        '200':
          description: Transmission endpoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadioTransmissionInfo'
        '400':
          description: Invalid metadata, unknown/inactive country UUID, or unknown/inactive/unpublished genre UUID
  /radio/presence:
    get:
      tags: [Radio]
      summary: Get current user's radio presence
      operationId: getRadioPresence
      responses:
        '200':
          description: Current presence or null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RadioPresence'
                nullable: true
    post:
      tags: [Radio]
      summary: Set current user's radio presence
      operationId: setRadioPresence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RadioPresenceUpsert'
      responses:
        '200':
          description: Updated presence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadioPresence'
        '400':
          description: Invalid presence metadata
    delete:
      tags: [Radio]
      summary: Clear current user's radio presence
      operationId: clearRadioPresence
      responses:
        '204':
          description: Presence cleared
  /radio/presence/{partyId}:
    get:
      tags: [Radio]
      summary: Get a party's radio presence
      operationId: getPartyRadioPresence
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Party presence or null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RadioPresence'
                nullable: true
        '400':
          description: Invalid party identifier
  /live-sessions/intake:
    post:
      tags: [Live Sessions]
      summary: Submit a Live Session intake
      description: >-
        Creates a Live Session intake using canonical persisted genre and instrument UUIDs.
        Musicians and setlist are JSON-encoded strings inside the multipart form. Copied genre,
        instrument, role, label, code, and slug fields are rejected.
      operationId: createLiveSessionIntake
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LiveSessionIntakeMultipart'
      responses:
        '204':
          description: Intake created
        '400':
          description: Invalid multipart data, canonical reference, or terms acceptance
        '401':
          description: Authentication required
        '409':
          description: A supplied musician identity is ambiguous
  /feedback:
    post:
      tags: [Feedback]
      summary: Submit product feedback
      description: >-
        Creates feedback using canonical persisted category and severity UUIDs. Legacy category,
        severity, copied label, code, and slug fields are rejected. Authentication is optional.
      operationId: submitFeedback
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FeedbackMultipart'
      responses:
        '204':
          description: Feedback accepted
        '400':
          description: Invalid multipart data, catalog reference, consent, or attachment
  /ddex/references:
    get:
      tags: [DDEX]
      summary: Read the governed DDEX runtime registry
      description: >-
        Returns active persisted standard versions, executable message types, deployment support,
        document and operational workflow states, and technical operation registries. IDs are
        canonical; labels, ordering, and codes are read-only database-authoritative metadata.
      operationId: getDdexReferences
      parameters:
        - name: locale
          in: query
          schema: { type: string, pattern: '^(es|en)([-_].*)?$' }
      responses:
        '200':
          description: Permission-aware governed DDEX snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DdexReferenceSnapshot' }
        '401': { description: Authentication required }
        '403': { description: Missing persisted `catalog.read` capability }
  /ddex/documents:
    get:
      tags: [DDEX]
      summary: List DDEX documents by canonical workflow state
      operationId: listDdexDocuments
      parameters:
        - name: workflowStateId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Matching DDEX documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DdexDocument' }
        '400': { description: The workflow state identifier is not a canonical lowercase UUID }
        '403': { description: Missing persisted `catalog.read` capability }
    post:
      tags: [DDEX]
      summary: Upload a DDEX document
      operationId: uploadDdexDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DdexUploadRequest' }
      responses:
        '501': { description: Storage integration is not implemented }
        '403': { description: Missing persisted `catalog.import` capability }
  /ddex/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DdexDocumentId'
    get:
      tags: [DDEX]
      summary: Read one DDEX document with canonical references
      operationId: getDdexDocument
      responses:
        '200':
          description: DDEX document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DdexDocument' }
        '404': { description: Document not found }
  /ddex/documents/{documentId}/raw:
    parameters:
      - $ref: '#/components/parameters/DdexDocumentId'
    get:
      tags: [DDEX]
      summary: Download the private source document
      operationId: downloadDdexRawDocument
      responses:
        '501': { description: Private file storage integration is not implemented }
        '403': { description: Missing persisted `catalog.read` capability }
  /ddex/documents/{documentId}/validation-runs:
    parameters:
      - $ref: '#/components/parameters/DdexDocumentId'
    post:
      tags: [DDEX]
      summary: Start governed validation for a DDEX document
      operationId: validateDdexDocument
      responses:
        '501': { description: Governed validation execution is not implemented }
        '403': { description: Missing persisted `catalog.import` capability }
        '404': { description: Document not found }
  /ddex/documents/{documentId}/validation-runs/latest:
    parameters:
      - $ref: '#/components/parameters/DdexDocumentId'
    get:
      tags: [DDEX]
      summary: Read the latest validation report for a DDEX document
      operationId: getLatestDdexValidationReport
      responses:
        '200':
          description: Latest persisted validation report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DdexValidationReport' }
        '404': { description: Document not found }
        '403': { description: Missing persisted `catalog.read` capability }
  /ddex/documents/{documentId}/preview:
    parameters:
      - $ref: '#/components/parameters/DdexDocumentId'
    get:
      tags: [DDEX]
      summary: Preview a DDEX import
      operationId: previewDdexDocument
      responses:
        '501': { description: Typed import preview generation is not implemented }
        '403': { description: Missing persisted `catalog.read` capability }
  /ddex/documents/{documentId}/import-plans:
    parameters:
      - $ref: '#/components/parameters/DdexDocumentId'
    post:
      tags: [DDEX]
      summary: Create the persisted DDEX import preview
      operationId: createDdexImportPlan
      responses:
        '501': { description: Typed import planning is not implemented }
        '403': { description: Missing persisted `catalog.import` capability }
        '404': { description: Document not found }
  /ddex/import-plans/{importPlanId}:
    parameters:
      - $ref: '#/components/parameters/DdexImportPlanId'
    patch:
      tags: [DDEX]
      summary: Resolve typed DDEX import conflicts
      operationId: resolveDdexImportPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DdexImportPlanResolution' }
      responses:
        '501': { description: Conflict resolution is not implemented }
        '400': { description: Unknown or malformed request properties }
        '403': { description: Missing persisted `catalog.import` capability }
  /ddex/import-plans/{importPlanId}/commit:
    parameters:
      - $ref: '#/components/parameters/DdexImportPlanId'
    post:
      tags: [DDEX]
      summary: Commit an approved DDEX import plan
      operationId: commitDdexImportPlan
      responses:
        '501': { description: Import commit execution is not implemented }
        '403': { description: Missing persisted `catalog.import` capability }
  /ddex/exports:
    post:
      tags: [DDEX]
      summary: Request an export using a canonical governed standard version
      operationId: createDdexExport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DdexExportRequest' }
      responses:
        '501': { description: Export rendering and private storage are not implemented }
        '400': { description: Unknown properties or malformed canonical UUID }
        '403': { description: Missing persisted `catalog.export` capability }
        '422': { description: Partner is inactive or does not allow the export-enabled version }
  /ddex/exports/{exportId}/download:
    parameters:
      - $ref: '#/components/parameters/DdexExportId'
    get:
      tags: [DDEX]
      summary: Download a rendered DDEX export
      operationId: downloadDdexExport
      responses:
        '501': { description: Export rendering and private storage are not implemented }
        '403': { description: Missing persisted `catalog.export` capability }
  /ddex/partners:
    get:
      tags: [DDEX]
      summary: List partners and canonical standard-version policies
      operationId: listDdexPartners
      responses:
        '200':
          description: DDEX partners
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DdexPartner' }
    post:
      tags: [DDEX]
      summary: Create a partner with canonical standard-version policies
      operationId: createDdexPartner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DdexPartnerCreateRequest' }
      responses:
        '200':
          description: Partner created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DdexPartner' }
        '400': { description: Unknown properties, duplicated IDs, or malformed canonical UUID }
        '403': { description: Missing persisted `catalog.import` capability }
        '422': { description: A supplied standard version is inactive or not detection-enabled }
  /directory/search: { $ref: './directory.yaml#/paths/~1directory~1search' }
  /directory/suggestions: { $ref: './directory.yaml#/paths/~1directory~1suggestions' }
  /directory/taxonomies: { $ref: './directory.yaml#/paths/~1directory~1taxonomies' }
  /directory/profiles/{slug}: { $ref: './directory.yaml#/paths/~1directory~1profiles~1{slug}' }
  /directory/classifieds/{slug}: { $ref: './directory.yaml#/paths/~1directory~1classifieds~1{slug}' }
  /directory/events/{eventId}: { $ref: './directory.yaml#/paths/~1directory~1events~1{eventId}' }
  /directory/venues/{venueId}: { $ref: './directory.yaml#/paths/~1directory~1venues~1{venueId}' }
  /directory/age-assurance: { $ref: './directory.yaml#/paths/~1directory~1age-assurance' }
  /directory/profiles: { $ref: './directory.yaml#/paths/~1directory~1profiles' }
  /directory/profiles/{profileId}: { $ref: './directory.yaml#/paths/~1directory~1profiles~1{profileId}' }
  /directory/profiles/{profileId}/status: { $ref: './directory.yaml#/paths/~1directory~1profiles~1{profileId}~1status' }
  /directory/classifieds: { $ref: './directory.yaml#/paths/~1directory~1classifieds' }
  /directory/classifieds/{classifiedId}/status: { $ref: './directory.yaml#/paths/~1directory~1classifieds~1{classifiedId}~1status' }
  /directory/classifieds/{classifiedId}/applications: { $ref: './directory.yaml#/paths/~1directory~1classifieds~1{classifiedId}~1applications' }
  /directory/applications/{applicationId}/status: { $ref: './directory.yaml#/paths/~1directory~1applications~1{applicationId}~1status' }
  /directory/invitations: { $ref: './directory.yaml#/paths/~1directory~1invitations' }
  /directory/invitations/{invitationId}/status: { $ref: './directory.yaml#/paths/~1directory~1invitations~1{invitationId}~1status' }
  /directory/contact: { $ref: './directory.yaml#/paths/~1directory~1contact' }
  /directory/favorites: { $ref: './directory.yaml#/paths/~1directory~1favorites' }
  /directory/favorites/{targetKind}/{targetId}: { $ref: './directory.yaml#/paths/~1directory~1favorites~1{targetKind}~1{targetId}' }
  /directory/saved-searches: { $ref: './directory.yaml#/paths/~1directory~1saved-searches' }
  /directory/claims: { $ref: './directory.yaml#/paths/~1directory~1claims' }
  /directory/verifications: { $ref: './directory.yaml#/paths/~1directory~1verifications' }
  /directory/reports: { $ref: './directory.yaml#/paths/~1directory~1reports' }
  /directory/admin/claims: { $ref: './directory.yaml#/paths/~1directory~1admin~1claims' }
  /directory/admin/claims/{claimId}/status: { $ref: './directory.yaml#/paths/~1directory~1admin~1claims~1{claimId}~1status' }
  /directory/admin/verifications: { $ref: './directory.yaml#/paths/~1directory~1admin~1verifications' }
  /directory/admin/verifications/{verificationId}/status: { $ref: './directory.yaml#/paths/~1directory~1admin~1verifications~1{verificationId}~1status' }
  /directory/admin/moderation: { $ref: './directory.yaml#/paths/~1directory~1admin~1moderation' }
  /directory/admin/moderation/{caseId}/decisions: { $ref: './directory.yaml#/paths/~1directory~1admin~1moderation~1{caseId}~1decisions' }
  /directory/admin/merges: { $ref: './directory.yaml#/paths/~1directory~1admin~1merges' }

security:
  - bearerAuth: [ ]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CatalogCode:
      name: catalogCode
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    CatalogItemId:
      name: itemId
      in: path
      required: true
      description: Immutable canonical UUID of a persisted catalog item.
      schema:
        type: string
        format: uuid
    CatalogRevisionId:
      name: revisionId
      in: path
      required: true
      description: Immutable UUID of a persisted catalog revision.
      schema:
        type: string
        format: uuid
    CmsContentId:
      name: cmsContentId
      in: path
      required: true
      description: Positive numeric identifier of one immutable CMS version.
      schema:
        type: integer
        minimum: 1
    SecurityRevisionId:
      name: revisionId
      in: path
      required: true
      description: Immutable UUID of the persisted security grant revision.
      schema:
        type: string
        format: uuid
    PipelineWorkflowId:
      name: workflowId
      in: path
      required: true
      description: Immutable UUID of an active persisted pipeline workflow. Codes and slugs are not accepted as relationships.
      schema:
        type: string
        format: uuid
    DdexDocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    DdexImportPlanId:
      name: importPlanId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    DdexExportId:
      name: exportId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  schemas:
    DdexStandardVersion:
      type: object
      additionalProperties: false
      required: [ddexStandardVersionId, ddexStandardCode, ddexVersionCode, ddexStandardVersionName,
        ddexStandardVersionNameEs, ddexStandardVersionNameEn, ddexStandardSourceVersion,
        ddexStandardSourceUri, ddexStandardDetectionEnabled, ddexStandardValidationEnabled,
        ddexStandardImportEnabled, ddexStandardExportEnabled, ddexStandardVersionRevision]
      properties:
        ddexStandardVersionId: { type: string, format: uuid }
        ddexStandardCode: { type: string, readOnly: true }
        ddexVersionCode: { type: string, readOnly: true }
        ddexStandardVersionName: { type: string, readOnly: true }
        ddexStandardVersionNameEs: { type: string, readOnly: true }
        ddexStandardVersionNameEn: { type: string, readOnly: true }
        ddexStandardSourceVersion: { type: string, readOnly: true }
        ddexStandardSourceUri: { type: string, format: uri, readOnly: true }
        ddexStandardDetectionEnabled: { type: boolean, readOnly: true }
        ddexStandardValidationEnabled: { type: boolean, readOnly: true }
        ddexStandardImportEnabled: { type: boolean, readOnly: true }
        ddexStandardExportEnabled: { type: boolean, readOnly: true }
        ddexStandardVersionRevision: { type: integer, minimum: 1, readOnly: true }
    DdexMessageType:
      type: object
      additionalProperties: false
      required: [ddexMessageTypeId, ddexMessageTypeStandardVersionId, ddexMessageTypeCode,
        ddexMessageTypeName, ddexMessageTypeNameEs, ddexMessageTypeNameEn,
        ddexMessageTypeRuntimeSupported, ddexMessageTypeRevision]
      properties:
        ddexMessageTypeId: { type: string, format: uuid }
        ddexMessageTypeStandardVersionId: { type: string, format: uuid }
        ddexMessageTypeCode: { type: string, readOnly: true }
        ddexMessageTypeName: { type: string, readOnly: true }
        ddexMessageTypeNameEs: { type: string, readOnly: true }
        ddexMessageTypeNameEn: { type: string, readOnly: true }
        ddexMessageTypeRuntimeSupported: { type: boolean, readOnly: true }
        ddexMessageTypeRevision: { type: integer, minimum: 1, readOnly: true }
    DdexDocumentState:
      type: object
      additionalProperties: false
      required: [ddexDocumentStateId, ddexDocumentStateCode, ddexDocumentStateName,
        ddexDocumentStateNameEs, ddexDocumentStateNameEn, ddexDocumentStateSortOrder,
        ddexDocumentStateTerminal, ddexDocumentStateRevision]
      properties:
        ddexDocumentStateId: { type: string, format: uuid }
        ddexDocumentStateCode: { type: string, readOnly: true }
        ddexDocumentStateName: { type: string, readOnly: true }
        ddexDocumentStateNameEs: { type: string, readOnly: true }
        ddexDocumentStateNameEn: { type: string, readOnly: true }
        ddexDocumentStateSortOrder: { type: integer, minimum: 0, readOnly: true }
        ddexDocumentStateTerminal: { type: boolean, readOnly: true }
        ddexDocumentStateRevision: { type: integer, minimum: 1, readOnly: true }
    DdexOperationalState:
      type: object
      additionalProperties: false
      required: [ddexOperationalStateId, ddexOperationalStateCode, ddexOperationalStateName,
        ddexOperationalStateNameEs, ddexOperationalStateNameEn, ddexOperationalStateSortOrder,
        ddexOperationalStateTerminal, ddexOperationalStateRevision]
      properties:
