      operationId: updateMarketplaceRentalTerms
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplaceRentalTermsUpdate' }
      responses:
        '200':
          description: Updated public listing projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceItem' }
        '400': { description: Invalid price, duration, timezone, or terms version }
        '403': { description: Operations access required }
        '404': { description: Listing not found }
        '409': { description: Listing is not an active rental listing }
