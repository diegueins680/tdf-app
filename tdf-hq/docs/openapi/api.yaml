      type: object
      additionalProperties: false
      required: [bandName, acceptedTerms, termsVersion, musicians]
      properties:
        bandName:
          type: string
          minLength: 1
          maxLength: 160
        bandDescription:
          type: string
          maxLength: 4000
          nullable: true
        primaryGenreId:
          type: string
          format: uuid
          nullable: true
          description: Canonical UUID of an active published genre.
        inputList:
          type: string
          maxLength: 4000
          nullable: true
        contactEmail:
          type: string
          format: email
          maxLength: 254
          nullable: true
        contactPhone:
          type: string
          nullable: true
