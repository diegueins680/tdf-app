        '409': { description: Historical or ambiguous checkout requires reconciliation }
  /marketplace/orders/{orderId}/manual-payment/review:
    parameters:
      - $ref: '#/components/parameters/MarketplaceOrderId'
    post:
      tags: [Marketplace administration]
      summary: Independently approve or reject marketplace manual-payment evidence
      description: The reviewer must differ from the submitter. Approval verifies the active hold and immutable order, checkout, attempt, amount, currency, environment and evidence bindings before atomically posting payment, receipt and ledger entries. Payment never implies fulfillment or custody transfer.
      operationId: reviewMarketplaceManualPayment
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplaceManualPaymentReview' }
      responses:
        '200':
          description: Current protected commerce projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceCommerce' }
        '400': { description: Invalid action or review notes }
        '403': { description: Invoicing access required }
        '409': { description: Separation-of-duties, hold, evidence, or competing-payment conflict }
  /marketplace/orders/{orderId}/fulfillment:
    parameters:
      - $ref: '#/components/parameters/MarketplaceOrderId'
    put:
      tags: [Marketplace administration]
      summary: Apply a validated physical-fulfillment transition
      description: Payment is a separate state machine. Delivery and pickup transitions update asset custody only through database-enforced transitions.
      operationId: updateMarketplaceFulfillment
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplaceFulfillmentUpdate' }
      responses:
        '200':
          description: Updated fulfillment state and immutable history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceOrder' }
        '400': { description: Invalid transition payload }
        '403': { description: Operations access required }
        '404': { description: Canonical sale order not found }
        '409': { description: Transition is invalid or payment is not verified }
  /marketplace/orders/{orderId}/rental:
    parameters:
      - $ref: '#/components/parameters/MarketplaceOrderId'
    put:
      tags: [Marketplace administration]
      summary: Apply a validated rental custody or inspection transition
      description: Payment, physical custody, and refundable-deposit settlement remain separate. Condition reports are required at handoff and return; a proposed deduction creates a due state and never fabricates a refund.
      operationId: updateMarketplaceRental
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
