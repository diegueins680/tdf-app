        - { name: seen, in: query, schema: { type: boolean } }
        - { name: entityType, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OperationsStatus' } }
        - { name: priority, in: query, schema: { $ref: '#/components/schemas/OperationsPriority' } }
        - { name: slaState, in: query, schema: { $ref: '#/components/schemas/OperationsSlaState' } }
        - { name: assigneePartyId, in: query, schema: { type: integer, format: int64 } }
        - { name: customerPartyId, in: query, schema: { type: integer, format: int64 } }
        - { name: service, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: minAmountMinor, in: query, schema: { type: integer, format: int64 } }
        - { name: maxAmountMinor, in: query, schema: { type: integer, format: int64 } }
        - { name: paymentState, in: query, schema: { type: string } }
        - { name: organizationId, in: query, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, schema: { type: string, format: uuid } }
        - { name: sourceChannel, in: query, schema: { type: string } }
      responses:
        '200':
          description: Scope-filtered page; restricted fields and records are omitted server-side
          content: { application/json: { schema: { $ref: '#/components/schemas/OperationsWorkItemPage' } } }
    post:
      tags: [Operations]
      summary: Create a manual correlated or explicitly uncorrelated work item
      operationId: createOperationsWorkItem
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OperationsManualWorkItemCreate' } } }
      responses:
        '201':
          description: Durable work item
          content: { application/json: { schema: { $ref: '#/components/schemas/OperationsWorkItem' } } }
        '422': { description: Correlation or entity-reference invariant failed }
  /operations/work-items/{workItemId}:
    get:
      tags: [Operations]
      summary: Get an authorized work-item thread
      operationId: getOperationsWorkItem
      parameters: [ { $ref: '#/components/parameters/OperationsWorkItemId' } ]
      responses:
        '200':
          description: Work item, immutable domain history, notes, and authorized actions
          content: { application/json: { schema: { $ref: '#/components/schemas/OperationsWorkItemDetail' } } }
        '404': { description: Missing or concealed work item }
  /operations/work-items/{workItemId}/seen:
    patch:
      tags: [Operations]
      summary: Mark shared first-seen state without mutating the source entity
      operationId: markOperationsWorkItemSeen
      parameters: [ { $ref: '#/components/parameters/OperationsWorkItemId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OperationsVersionedCommand' } } } }
      responses:
        '200': { description: Updated work item, content: { application/json: { schema: { $ref: '#/components/schemas/OperationsWorkItem' } } } }
        '409': { description: Optimistic-concurrency conflict }
  /operations/work-items/{workItemId}/transition:
    patch:
      tags: [Operations]
      summary: Apply an audited lifecycle transition only
      operationId: transitionOperationsWorkItem
      parameters: [ { $ref: '#/components/parameters/OperationsWorkItemId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OperationsTransitionCommand' } } } }
      responses:
        '200': { description: Updated work item, content: { application/json: { schema: { $ref: '#/components/schemas/OperationsWorkItem' } } } }
        '409': { description: Optimistic-concurrency conflict }
        '422': { description: State-machine guard rejected the transition }
  /operations/work-items/{workItemId}/assignment:
    patch:
      tags: [Operations]
      summary: Assign a scoped staff member or team
      operationId: assignOperationsWorkItem
      parameters: [ { $ref: '#/components/parameters/OperationsWorkItemId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OperationsAssignmentCommand' } } } }
      responses:
        '200': { description: Updated work item, content: { application/json: { schema: { $ref: '#/components/schemas/OperationsWorkItem' } } } }
        '422': { description: Assignee is outside the organization and branch scope }
  /operations/work-items/{workItemId}/priority:
    patch:
      tags: [Operations]
      summary: Override recommended priority with a required reason
      operationId: prioritizeOperationsWorkItem
      parameters: [ { $ref: '#/components/parameters/OperationsWorkItemId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OperationsPriorityCommand' } } } }
      responses:
        '200': { description: Updated work item, content: { application/json: { schema: { $ref: '#/components/schemas/OperationsWorkItem' } } } }
        '403': { description: Manager permission required }
  /operations/work-items/{workItemId}/notes:
    post:
      tags: [Operations]
      summary: Add an internal note with scoped mentions
      operationId: addOperationsWorkItemNote
      parameters: [ { $ref: '#/components/parameters/OperationsWorkItemId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OperationsNoteCreate' } } } }
      responses:
        '201': { description: Created note, content: { application/json: { schema: { $ref: '#/components/schemas/OperationsNote' } } } }
  /operations/approvals:
    post:
      tags: [Operations]
      summary: Request a consequential action requiring a second person
      operationId: createOperationsApproval
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OperationsApprovalCreate' } } } }
      responses:
        '201': { description: Pending approval, content: { application/json: { schema: { $ref: '#/components/schemas/OperationsApproval' } } } }
  /operations/approvals/{approvalId}/decision:
    patch:
      tags: [Operations]
      summary: Approve or reject with a distinct authorized person
      operationId: decideOperationsApproval
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OperationsApprovalDecision' } } } }
      responses:
        '200': { description: Decided approval, content: { application/json: { schema: { $ref: '#/components/schemas/OperationsApproval' } } } }
        '409': { description: Changed, expired, unavailable, or self-approval attempted }
  /operations/integration-failures:
    get:
      tags: [Operations]
      summary: List the admin-visible provider and dead-letter failure queue
      operationId: listOperationsIntegrationFailures
      parameters:
        - { name: organizationId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Redacted failure summaries
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OperationsIntegrationFailure' } } } }
  /operations/integration-failures/{failureId}/replay:
    post:
      tags: [Operations]
      summary: Audit and schedule an idempotent manual replay
      operationId: replayOperationsIntegrationFailure
      parameters:
        - { name: failureId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OperationsReplayCommand' } } } }
      responses:
        '202': { description: Replay scheduled, content: { application/json: { schema: { $ref: '#/components/schemas/OperationsIntegrationFailure' } } } }
  /operations/events:
    get:
      tags: [Operations]
      summary: Replay missed authorized real-time effects and provide bounded polling fallback
      operationId: listOperationsStreamEvents
      parameters:
        - { name: afterId, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 250 } }
        - { name: organizationId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Ordered resumable event batch, content: { application/json: { schema: { $ref: '#/components/schemas/OperationsStreamBatch' } } } }
  /operations/saved-views:
    get:
      tags: [Operations]
      summary: List personal and shared operational views
      operationId: listOperationsSavedViews
      parameters:
        - { name: organizationId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Authorized saved views, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OperationsSavedView' } } } } }
    post:
      tags: [Operations]
      summary: Persist or replace an operational view
      operationId: createOperationsSavedView
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OperationsSavedViewCreate' } } } }
      responses:
        '201': { description: Saved view, content: { application/json: { schema: { $ref: '#/components/schemas/OperationsSavedView' } } } }
  /operations/push-subscriptions:
    post:
      tags: [Operations]
      summary: Register an encrypted staff push token
      operationId: createOperationsPushSubscription
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OperationsPushSubscriptionCreate' } } } }
      responses:
        '201': { description: Push subscription metadata, content: { application/json: { schema: { $ref: '#/components/schemas/OperationsPushSubscription' } } } }
        '503': { description: Token encryption key is not configured }
security:
  - bearerAuth: [ ]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrderLookupToken:
      name: X-Order-Lookup-Token
      in: header
      required: true
      description: Opaque guest capability returned only when the order is created.
      schema: { type: string, minLength: 32, maxLength: 256 }
    AccessRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    FeatureId:
      name: featureId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 160
    OperationsWorkItemId:
      name: workItemId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    ServiceStorefrontPackage:
      type: object
      required: [sspId, sspServiceKind, sspTier, sspName, sspPriceUsdCents, sspCurrency, sspMinSongCount, sspMaxSongCount, sspTurnaroundDays, sspRevisionCount, sspActive, sspSortOrder]
      properties:
        sspId: { type: string, format: uuid }
        sspServiceKind: { type: string, enum: [Mixing, Mastering, Bundle] }
        sspTier: { type: string }
        sspName: { type: string }
        sspDescription: { type: string, nullable: true }
        sspPriceUsdCents: { type: integer, minimum: 1 }
        sspCurrency: { type: string, enum: [USD] }
        sspMinSongCount: { type: integer, minimum: 1 }
        sspMaxSongCount: { type: integer, minimum: 1 }
        sspTurnaroundDays: { type: integer, minimum: 1 }
        sspRevisionCount: { type: integer, minimum: 0 }
        sspDeliverables: { type: array, nullable: true, items: { type: string } }
        sspFeatures: { type: array, nullable: true, items: { type: string } }
        sspActive: { type: boolean }
        sspSortOrder: { type: integer }
    ServiceStorefrontOrderCreate:
      type: object
      required: [ssocPackageId, ssocBuyerName, ssocBuyerEmail]
      properties:
        ssocPackageId: { type: string, format: uuid }
        ssocBuyerName: { type: string, minLength: 1, maxLength: 200 }
        ssocBuyerEmail: { type: string, format: email, maxLength: 254 }
        ssocBuyerPhone: { type: string, nullable: true }
        ssocArtistName: { type: string, nullable: true }
        ssocGenre: { type: string, nullable: true }
        ssocSongCount: { type: integer, minimum: 1, nullable: true }
        ssocNotes: { type: string, nullable: true }
        ssocReferenceTrackUrl: { type: string, format: uri, nullable: true }
        ssocDeadline: { type: string, format: date, nullable: true }
    ServiceStorefrontOrder:
      type: object
      required: [ssoId, ssoOrderNumber, ssoBuyerName, ssoBuyerEmail, ssoPackageId, ssoServiceKind, ssoTier, ssoPriceUsdCents, ssoCurrency, ssoStatus, ssoSongCount, ssoCreatedAt, ssoUpdatedAt]
      properties:
        ssoId: { type: string, format: uuid }
        ssoOrderNumber: { type: string }
        ssoBuyerName: { type: string }
        ssoBuyerEmail: { type: string, format: email }
        ssoBuyerPhone: { type: string, nullable: true }
        ssoArtistName: { type: string, nullable: true }
        ssoPackageId: { type: string, format: uuid }
        ssoServiceKind: { type: string }
        ssoTier: { type: string }
        ssoPriceUsdCents: { type: integer, minimum: 1 }
        ssoCurrency: { type: string }
        ssoStatus: { type: string }
        ssoPaymentProvider: { type: string, nullable: true }
        ssoLookupToken: { type: string, nullable: true, writeOnly: true, description: Returned only in the create response. }
        ssoPaidAt: { type: string, format: date-time, nullable: true }
        ssoGenre: { type: string, nullable: true }
        ssoSongCount: { type: integer, minimum: 1 }
        ssoNotes: { type: string, nullable: true }
        ssoReferenceTrackUrl: { type: string, nullable: true }
        ssoDeadline: { type: string, format: date, nullable: true }
        ssoDeliverablesUrl: { type: string, nullable: true }
        ssoCreatedAt: { type: string, format: date-time }
        ssoUpdatedAt: { type: string, format: date-time }
    DatafastCheckout:
      type: object
      required: [dcOrderId, dcCheckoutId, dcWidgetUrl, dcAmount, dcCurrency]
      properties:
        dcOrderId: { type: string }
        dcCheckoutId: { type: string }
        dcWidgetUrl: { type: string, format: uri }
        dcAmount: { type: string }
        dcCurrency: { type: string }
    PayPalOrderCreate:
      type: object
      required: [pcOrderId, pcPaypalOrderId]
      properties:
        pcOrderId: { type: string }
        pcPaypalOrderId: { type: string }
        pcApprovalUrl: { type: string, format: uri, nullable: true }
    PayPalCaptureRequest:
      type: object
      required: [pcCaptureOrderId, pcCapturePaypalId]
      properties:
        pcCaptureOrderId: { type: string }
        pcCapturePaypalId: { type: string }
    ServiceManualPaymentCreate:
      type: object
      required: [ssmPaymentMethod]
      properties:
        ssmPaymentMethod: { type: string, enum: [bank_transfer, cash, pos] }
    Version:
      type: object
      properties:
        name:
          type: string
          description: Application name.
        version:
          type: string
          description: Application version.
        commit:
          type: string
          nullable: true
          description: Git commit SHA.
        buildTime:
          type: string
          nullable: true
          description: Timestamp of the build.

    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: Service status.
        version:
          type: string
          description: Application version.
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Username or primary email.
          example: admin@tdf.com
        password:
          type: string
          format: password
    GoogleLoginRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          description: Google ID token returned by Google Identity Services
    SignupRequest:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
          example: Diego
        lastName:
          type: string
          example: Saá
        email:
          type: string
          format: email
          example: ops@tdfrecords.com
        phone:
          type: string
          nullable: true
          example: "+1 415 555 2671"
        password:
          type: string
          format: password
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          description: Optional roles (non-admin) to assign during signup.
        fanArtistIds:
          type: array
          items:
            type: integer
            format: int64
          description: Artist or band ids the fan wants to follow immediately after signup.
        claimArtistId:
          type: integer
          format: int64
          nullable: true
          description: Optional existing artist profile to claim when it is not already assigned to a user.
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Bearer token for authenticated requests when a client is not using cookies.
        partyId:
          type: integer
          format: int64
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        modules:
          type: array
          items:
            type: string
            description: Enabled modules for the user.
    SessionResponse:
      type: object
      required: [username, displayName, partyId, roles, modules, featureFlags, preferences]
      properties:
        username:
          type: string
        displayName:
          type: string
        partyId:
          type: integer
          format: int64
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        modules:
          type: array
          items:
            type: string
            description: Enabled modules for the user.
        featureFlags:
          type: array
          description: Enabled public feature-flag identifiers; never contains configuration secrets.
          items:
            type: string
        preferences:
          $ref: '#/components/schemas/LocalePreferences'
    LocalePreferences:
      type: object
      required: [locale, currency, timezone, supportedLocales, supportedCurrencies]
      properties:
        locale:
          type: string
          example: en
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: USD
        timezone:
          type: string
          example: Europe/Berlin
        countryCode:
          type: string
          nullable: true
          pattern: '^[A-Z]{2}$'
        supportedLocales:
          type: array
          items:
            type: string
        supportedCurrencies:
          type: array
          items:
            type: string
            pattern: '^[A-Z]{3}$'
    LocalePreferencesUpdate:
      type: object
      additionalProperties: false
      required: [locale, currency, timezone]
      properties:
        locale:
          type: string
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        timezone:
          type: string
        countryCode:
          type: string
          nullable: true
          pattern: '^[A-Z]{2}$'
    CurrencyConversionAuditCreate:
      type: object
      additionalProperties: false
      required: [sourceCurrency, targetCurrency, sourceMinorUnits, targetMinorUnits, exchangeRate, rateSource]
      properties:
        sourceCurrency:
          type: string
          pattern: '^[A-Z]{3}$'
        targetCurrency:
          type: string
          pattern: '^[A-Z]{3}$'
        sourceMinorUnits:
          type: integer
          format: int64
        targetMinorUnits:
          type: integer
          format: int64
        exchangeRate:
          type: number
          format: double
          exclusiveMinimum: 0
        rateSource:
          type: string
          maxLength: 80
    Role:
      type: string
      description: Assigned platform role.
      enum:
        - Admin
        - Manager
        - Studio Manager
        - Intern
        - Engineer
        - Teacher
        - Reception
        - Accounting
        - Live Sessions Producer
        - Webmaster
        - Artist
        - Artista
        - Promotor
        - Promoter
        - Producer
        - Songwriter
        - DJ
        - Publicist
        - TourManager
        - LabelRep
        - StageManager
        - RoadCrew
        - Photographer
        - A&R
        - Student
        - ReadOnly
        - Vendor
        - Customer
        - Fan
        - Maintenance
    UserRoleSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        status:
          type: string
          enum: [Active, Inactive]
        createdAt:
          type: string
          format: date-time
    UserRoleUpdate:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          description: Complete list of roles that should remain active.
          items:
            $ref: '#/components/schemas/Role'
    Party:
      type: object
      properties:
        partyId:
          type: integer
          format: int64
        legalName:
          type: string
          nullable: true
        displayName:
          type: string
        isOrg:
          type: boolean
        taxId:
          type: string
          nullable: true
        primaryEmail:
          type: string
          format: email
          nullable: true
        primaryPhone:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        instagram:
          type: string
          nullable: true
        emergencyContact:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        hasUserAccount:
          type: boolean
          description: True if a credential exists for this party.
        band:
          type: object
          nullable: true
          description: Present when the party is linked to a band/project.
    ChatThread:
      type: object
      properties:
        ctThreadId:
          type: integer
          format: int64
        ctOtherPartyId:
          type: integer
          format: int64
        ctOtherDisplayName:
          type: string
        ctLastMessage:
          type: string
          nullable: true
        ctLastMessageAt:
          type: string
          format: date-time
          nullable: true
        ctUpdatedAt:
          type: string
          format: date-time
    ChatMessage:
      type: object
      properties:
        cmId:
          type: integer
          format: int64
        cmThreadId:
          type: integer
          format: int64
        cmSenderPartyId:
          type: integer
          format: int64
        cmBody:
          type: string
        cmCreatedAt:
          type: string
          format: date-time
    SocialInboxMessage:
      type: object
      properties:
        externalId:
          type: string
        senderId:
          type: string
        senderName:
          type: string
          nullable: true
        text:
          type: string
          nullable: true
        metadata:
          type: string
          nullable: true
        direction:
          type: string
        repliedAt:
          type: string
          format: date-time
          nullable: true
        replyText:
          type: string
          nullable: true
        replyError:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    WhatsAppConsentRequest:
      type: object
      required: [phone, consent]
      properties:
        phone:
          type: string
          description: Phone number in E.164 format.
          example: "+14155552671"
        name:
          type: string
          nullable: true
        consent:
          type: boolean
        source:
          type: string
          nullable: true
        sendMessage:
          type: boolean
          nullable: true
    WhatsAppOptOutRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: Phone number in E.164 format.
        reason:
          type: string
          nullable: true
        sendMessage:
          type: boolean
          nullable: true
    WhatsAppConsentStatus:
      type: object
      properties:
        phone:
          type: string
        consent:
          type: boolean
        consentedAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        displayName:
          type: string
          nullable: true
    WhatsAppConsentResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/WhatsAppConsentStatus'
        messageSent:
          type: boolean
        message:
          type: string
          nullable: true
    ChatSendMessageRequest:
      type: object
      required: [csmBody]
      properties:
        csmBody:
          type: string
    CreatePartyRequest:
      type: object
      required: [cDisplayName, cIsOrg]
      properties:
        cDisplayName:
          type: string
          description: Display name shown in listings.
        cIsOrg:
          type: boolean
          description: True for organizations/bands, false for individual contacts.
        cLegalName:
          type: string
          nullable: true
        cPrimaryEmail:
          type: string
          format: email
          nullable: true
        cPrimaryPhone:
          type: string
          nullable: true
        cWhatsapp:
          type: string
          nullable: true
        cInstagram:
          type: string
          nullable: true
        cTaxId:
          type: string
          nullable: true
        cEmergencyContact:
          type: string
          nullable: true
        cNotes:
          type: string
          nullable: true
        cRoles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          nullable: true
    UpdatePartyRequest:
      type: object
      properties:
        uDisplayName:
          type: string
