  /public/events/{eventId}/tickets:
    get:
      tags: [Public event tickets]
      summary: Read the payable ticket storefront for one public event
      description: Returns server-authoritative active tiers and availability. Zero-price entitlements use a separate staff-controlled flow and are not exposed as payable tiers.
      operationId: getPublicEventTicketStorefront
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicEventId'
      responses:
        '200':
          description: Public event ticket storefront
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicEventTicketStorefront' } } }
        '404': { description: Event is not publicly eligible for ticket purchase }
        '503': { description: Checkout environment is not configured }
  /public/events/{eventId}/ticket-orders:
    post:
      tags: [Public event tickets]
      summary: Atomically hold ticket inventory and create an immutable guest checkout
      description: Price, discounts, fee allocation, tax, terms version, capacity, and hold expiry are calculated by the server. This operation never marks payment successful or issues a ticket.
      operationId: createPublicEventTicketCheckout
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicEventId'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublicEventTicketCheckoutRequest' } } }
      responses:
        '201':
          description: Guest ticket order with a temporary inventory hold; lookupToken is returned only on creation
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicEventTicketCheckout' } } }
        '400': { description: Invalid buyer, quantity, promotion, or terms input }
        '404': { description: Event or tier is not public }
        '409': { description: Capacity, inventory, promotion, policy, or idempotency conflict }
        '503': { description: Event ticket checkout is disabled }
  /public/events/{eventId}/ticket-orders/{orderId}:
    get:
      tags: [Public event tickets]
      summary: Track a guest ticket order using its unguessable lookup token
      operationId: getPublicEventTicketCheckout
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicEventId'
        - $ref: '#/components/parameters/PublicEventTicketOrderId'
        - $ref: '#/components/parameters/PublicOrderLookupToken'
      responses:
        '200':
          description: Customer-safe payment and fulfillment state; ticket references appear only after issuance
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicEventTicketCheckout' } } }
        '404': { description: Order not found or lookup token does not match }
  /public/events/{eventId}/ticket-orders/{orderId}/datafast/checkout:
    post:
      tags: [Public event tickets]
      summary: Create or recover the ticket order's bound Datafast checkout
      operationId: createPublicEventTicketDatafastCheckout
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicEventId'
        - $ref: '#/components/parameters/PublicEventTicketOrderId'
        - $ref: '#/components/parameters/PublicOrderLookupToken'
      responses:
        '200':
          description: Bound Datafast hosted checkout
          content: { application/json: { schema: { $ref: '#/components/schemas/DatafastCheckout' } } }
        '404': { description: Order not found or lookup token does not match }
        '409': { description: Hold expired, order paid, or another online rail is active }
        '503': { description: Datafast or event ticket checkout is disabled }
  /public/events/{eventId}/ticket-orders/{orderId}/datafast/status:
    get:
      tags: [Public event tickets]
      summary: Verify a bound Datafast ticket payment server-to-server
      description: A browser return is not payment evidence. Amount, currency, merchant, internal order, checkout ID, and exact stored resource path must match before payment can be recorded and tickets issued.
      operationId: confirmPublicEventTicketDatafastStatus
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicEventId'
        - $ref: '#/components/parameters/PublicEventTicketOrderId'
        - $ref: '#/components/parameters/PublicOrderLookupToken'
        - name: resourcePath
          in: query
          required: true
          schema: { type: string, pattern: '^/v1/checkouts/[A-Za-z0-9._-]+/payment$' }
      responses:
        '200':
          description: Current server-verified checkout state
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicEventTicketCheckout' } } }
        '404': { description: Order not found or lookup token does not match }
        '409': { description: Resource binding mismatch or payment arrived after hold expiry }
        '502': { description: Provider status or immutable payment fields could not be verified }
  /public/events/{eventId}/ticket-orders/{orderId}/paypal/create:
    post:
      tags: [Public event tickets]
      summary: Create or recover the ticket order's bound PayPal order
      operationId: createPublicEventTicketPaypalOrder
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicEventId'
        - $ref: '#/components/parameters/PublicEventTicketOrderId'
        - $ref: '#/components/parameters/PublicOrderLookupToken'
      responses:
        '200':
          description: Bound PayPal order awaiting customer approval
          content: { application/json: { schema: { $ref: '#/components/schemas/PaypalCreate' } } }
        '404': { description: Order not found or lookup token does not match }
        '409': { description: Hold expired, order paid, or another online rail is active }
        '503': { description: PayPal or event ticket checkout is disabled }
  /public/events/{eventId}/ticket-orders/{orderId}/paypal/capture:
    post:
      tags: [Public event tickets]
      summary: Capture and verify the exact bound PayPal ticket order
      description: Approval in the browser is not success. TDF captures server-to-server and verifies capture status, amount, currency, payee merchant, internal order, and provider binding before payment and ticket issuance transitions.
      operationId: capturePublicEventTicketPaypalOrder
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicEventId'
        - $ref: '#/components/parameters/PublicEventTicketOrderId'
        - $ref: '#/components/parameters/PublicOrderLookupToken'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublicEventTicketPaypalCaptureRequest' } } }
      responses:
        '200':
          description: Current server-verified checkout and fulfillment state
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicEventTicketCheckout' } } }
        '404': { description: Order not found or lookup token does not match }
        '409': { description: Provider binding mismatch or payment arrived after hold expiry }
        '502': { description: PayPal capture or immutable payment fields could not be verified }

  /public/domo:
    get:
      tags: [Public Domo quotes]
      summary: Read the authoritative Domo quote capability and approved rate-card limits
      description: Prices are intentionally omitted. A payable quote is calculated only by the server from exactly one independently approved active rate-card version.
      operationId: getPublicDomoStorefront
      security: []
      responses:
        '200':
          description: Public Domo quote capability; checkoutAvailable remains false until all environment and rate-card gates pass
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicDomoStorefront' } } }
  /public/domo/quotes:
    post:
      tags: [Public Domo quotes]
      summary: Calculate an immutable Domo quote and atomically hold the requested date
      description: Guest count, duration, add-ons, tax, deposit, balance, policy, rate-card version, and hold expiry are server-authoritative. Creation starts in holding state and never means acceptance or payment.
      operationId: createPublicDomoQuote
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublicDomoQuoteCreateRequest' } } }
      responses:
        '201':
          description: Immutable quote and temporary date hold; lookupToken is returned only on creation
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicDomoQuote' } } }
        '400': { description: Customer or event input is invalid under the approved rate-card policy }
        '409': { description: Requested venue window is already held or reserved, or the idempotency key conflicts }
        '503': { description: Authoritative Domo quotes or an approved active rate card are unavailable }
  /public/domo/quotes/{quoteId}:
    get:
      tags: [Public Domo quotes]
      summary: Track a customer-safe Domo quote using its unguessable lookup token
      operationId: getPublicDomoQuote
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicDomoQuoteId'
        - $ref: '#/components/parameters/PublicOrderLookupToken'
      responses:
        '200':
          description: Current quote, payment, and venue-fulfillment state
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicDomoQuote' } } }
        '404': { description: Quote not found or lookup token does not match }
  /public/domo/quotes/{quoteId}/accept:
    post:
      tags: [Public Domo quotes]
      summary: Accept the exact versioned Domo quote and open its deposit checkout
      description: Acceptance records the terms version and changes payment from holding to awaiting_payment; it never records payment.
      operationId: acceptPublicDomoQuote
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicDomoQuoteId'
        - $ref: '#/components/parameters/PublicOrderLookupToken'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublicDomoQuoteAcceptRequest' } } }
      responses:
        '200':
          description: Accepted quote awaiting a separately verified deposit
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicDomoQuote' } } }
        '404': { description: Quote not found or lookup token does not match }
        '409': { description: Quote hold expired or quote cannot be accepted in its current state }
  /public/domo/quotes/{quoteId}/datafast/checkout:
    post:
      tags: [Public Domo quotes]
      summary: Create or recover the deposit checkout's strongly bound Datafast resource
      operationId: createPublicDomoDatafastCheckout
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicDomoQuoteId'
        - $ref: '#/components/parameters/PublicOrderLookupToken'
      responses:
        '200':
          description: Bound Datafast hosted checkout
          content: { application/json: { schema: { $ref: '#/components/schemas/DatafastCheckout' } } }
        '404': { description: Quote not found or lookup token does not match }
        '409': { description: Quote is unaccepted, expired, paid, or bound to another online rail }
        '503': { description: Datafast or Domo checkout is disabled }
  /public/domo/quotes/{quoteId}/datafast/status:
    get:
      tags: [Public Domo quotes]
      summary: Verify a bound Datafast Domo deposit server-to-server
      description: A browser return is not payment evidence. Amount, currency, merchant, quote, checkout, environment, and exact stored resource path must match before the deposit and date-reserved transitions.
      operationId: confirmPublicDomoDatafastStatus
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicDomoQuoteId'
        - $ref: '#/components/parameters/PublicOrderLookupToken'
        - name: resourcePath
          in: query
          required: true
          schema: { type: string, pattern: '^/v1/checkouts/[A-Za-z0-9._-]+/payment$' }
      responses:
        '200':
          description: Current server-verified quote, checkout, and venue state
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicDomoQuote' } } }
        '404': { description: Quote not found or lookup token does not match }
        '409': { description: Provider binding mismatch or verified payment arrived after hold expiry }
        '502': { description: Provider status or immutable payment fields could not be verified }
  /public/domo/quotes/{quoteId}/paypal/create:
    post:
      tags: [Public Domo quotes]
      summary: Create or recover the deposit checkout's bound PayPal order
      operationId: createPublicDomoPaypalOrder
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicDomoQuoteId'
        - $ref: '#/components/parameters/PublicOrderLookupToken'
      responses:
        '200':
          description: Bound PayPal order awaiting customer approval
          content: { application/json: { schema: { $ref: '#/components/schemas/PaypalCreate' } } }
        '404': { description: Quote not found or lookup token does not match }
        '409': { description: Quote is unaccepted, expired, paid, or bound to another online rail }
        '503': { description: PayPal or Domo checkout is disabled }
  /public/domo/quotes/{quoteId}/paypal/capture:
    post:
      tags: [Public Domo quotes]
      summary: Capture and verify the exact bound PayPal Domo deposit
      description: Browser approval is not success. TDF captures server-to-server and verifies capture status, amount, currency, payee merchant, quote, checkout, environment, and provider binding before recording the deposit and reserving the date.
      operationId: capturePublicDomoPaypalOrder
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicDomoQuoteId'
        - $ref: '#/components/parameters/PublicOrderLookupToken'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublicDomoPaypalCaptureRequest' } } }
      responses:
        '200':
          description: Current server-verified quote, checkout, and venue state
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicDomoQuote' } } }
        '404': { description: Quote not found or lookup token does not match }
        '409': { description: Provider binding mismatch or verified payment arrived after hold expiry }
        '502': { description: PayPal capture or immutable payment fields could not be verified }

security:
  - bearerAuth: [ ]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sessionCookie:
      type: apiKey
      in: cookie
      name: tdf_session
  parameters:
    PublicEventId:
      name: eventId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    PublicEventTicketOrderId:
      name: orderId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    PublicDomoQuoteId:
      name: quoteId
      in: path
      required: true
      description: Immutable canonical UUID of the Domo quote runtime.
      schema: { type: string, format: uuid }
    PublicOrderLookupToken:
      name: X-Order-Lookup-Token
      in: header
      required: true
      description: Unguessable token returned once at guest order creation. Invalid values receive the same response as unknown orders.
      schema: { type: string, minLength: 32, writeOnly: true }
    PublicBookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    CatalogCode:
      name: catalogCode
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    CatalogItemId:
      name: itemId
      in: path
      required: true
      description: Immutable canonical UUID of a persisted catalog item.
      schema:
        type: string
        format: uuid
    CatalogRevisionId:
      name: revisionId
      in: path
      required: true
      description: Immutable UUID of a persisted catalog revision.
      schema:
        type: string
        format: uuid
    CmsContentId:
      name: cmsContentId
      in: path
      required: true
      description: Positive numeric identifier of one immutable CMS version.
      schema:
        type: integer
        minimum: 1
    SecurityRevisionId:
      name: revisionId
      in: path
      required: true
      description: Immutable UUID of the persisted security grant revision.
      schema:
        type: string
        format: uuid
    PipelineWorkflowId:
      name: workflowId
      in: path
      required: true
      description: Immutable UUID of an active persisted pipeline workflow. Codes and slugs are not accepted as relationships.
      schema:
        type: string
        format: uuid
    DdexDocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    DdexImportPlanId:
      name: importPlanId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    DdexExportId:
      name: exportId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    MarketplaceListingId:
      name: listingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MarketplaceCartId:
      name: cartId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MarketplaceOrderId:
      name: orderId
      in: path
      required: true
      description: Canonical marketplace sale or rental order UUID.
      schema: { type: string, format: uuid }
    ServiceStorefrontPackageId:
      name: packageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ServiceStorefrontOrderId:
      name: orderId
      in: path
      required: true
      description: Public order number or canonical UUID accepted by the service storefront.
      schema: { type: string, minLength: 1 }
    OrderLookupToken:
      name: X-Order-Lookup-Token
      in: header
      required: true
      description: Unguessable token returned once at guest order creation. Invalid values receive the same response as unknown orders.
      schema: { type: string, minLength: 32, writeOnly: true }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable caller-generated key. Reuse with a different request snapshot is rejected.
      schema: { type: string, minLength: 16, maxLength: 128 }
  schemas:
    PublicDomoStorefront:
      type: object
      additionalProperties: false
      required: [checkoutAvailable, eventTypes, timezone]
      properties:
        checkoutAvailable: { type: boolean }
        unavailableReason: { type: string, nullable: true }
        rateCardVersion: { type: string, nullable: true }
        currency: { type: string, minLength: 3, maxLength: 3, nullable: true }
        eventTypes:
          type: array
          items: { type: string, minLength: 1 }
        maximumGuests: { type: integer, minimum: 1, nullable: true }
        maximumDurationHours: { type: integer, minimum: 1, nullable: true }
        maximumSetupHours: { type: integer, minimum: 0, nullable: true }
        quoteHoldMinutes: { type: integer, minimum: 1, nullable: true }
        timezone: { type: string, minLength: 1 }
    PublicDomoQuoteCreateRequest:
      type: object
      additionalProperties: false
      required: [customerName, customerEmail, eventType, guests, startsAt, durationHours, setupHours, catering, production, transport]
      properties:
        customerName: { type: string, minLength: 1, maxLength: 160 }
        customerEmail: { type: string, format: email, maxLength: 254 }
        customerPhone: { type: string, minLength: 1, maxLength: 24 }
        eventType: { type: string, minLength: 1, maxLength: 80 }
        guests: { type: integer, minimum: 1 }
        startsAt: { type: string, format: date-time }
        durationHours: { type: integer, minimum: 1 }
        setupHours: { type: integer, minimum: 0 }
        catering: { type: boolean }
        production: { type: boolean }
        transport: { type: boolean }
        notes: { type: string, minLength: 1, maxLength: 4000 }
    PublicDomoQuoteAcceptRequest:
      type: object
      additionalProperties: false
      required: [termsAccepted]
      properties:
        termsAccepted: { type: boolean, enum: [true] }
    PublicDomoQuoteLine:
      type: object
      additionalProperties: false
      required: [code, description, quantity, unitAmountMinor, subtotalMinor]
      properties:
        code: { type: string }
        description: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitAmountMinor: { type: integer, format: int64, minimum: 0 }
        subtotalMinor: { type: integer, format: int64, minimum: 0 }
    PublicDomoQuote:
      type: object
      additionalProperties: false
      required: [quoteId, checkoutId, quoteStatus, paymentStatus, fulfillmentStatus, rateCardVersion, currency, eventType, guests, startsAt, endsAt, setupStartsAt, lines, subtotalMinor, taxMinor, totalMinor, depositMinor, balanceMinor, timezone, termsVersion, holdExpiresAt, paymentMethods]
      properties:
        quoteId: { type: string, format: uuid }
        checkoutId: { type: string, format: uuid }
        lookupToken: { type: string, nullable: true, writeOnly: true }
        quoteStatus:
          type: string
          enum: [draft, sent, viewed, accepted, deposit_due, deposit_paid, in_progress, balance_due, completed, cancelled, expired]
        paymentStatus:
          type: string
          enum: [holding, awaiting_payment, processing, paid, failed, cancelled, expired, partially_refunded, refunded, disputed, chargeback]
        fulfillmentStatus:
          type: string
          enum: [date_held, date_reserved, in_progress, balance_due, completed, cancelled, expired]
        rateCardVersion: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        eventType: { type: string }
        guests: { type: integer, minimum: 1 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        setupStartsAt: { type: string, format: date-time }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PublicDomoQuoteLine' }
        subtotalMinor: { type: integer, format: int64, minimum: 1 }
        taxMinor: { type: integer, format: int64, minimum: 0 }
        totalMinor: { type: integer, format: int64, minimum: 1 }
        depositMinor: { type: integer, format: int64, minimum: 1 }
        balanceMinor: { type: integer, format: int64, minimum: 0 }
        timezone: { type: string, minLength: 1 }
        termsVersion: { type: string }
        holdExpiresAt: { type: string, format: date-time }
        termsAcceptedAt: { type: string, format: date-time, nullable: true }
        depositPaidAt: { type: string, format: date-time, nullable: true }
        paymentMethods:
          type: array
          items: { type: string, enum: [datafast, paypal] }
    PublicDomoPaypalCaptureRequest:
      type: object
      additionalProperties: false
      required: [paypalOrderId]
      properties:
        paypalOrderId: { type: string, minLength: 6, maxLength: 80, pattern: '^[A-Za-z0-9_-]+$' }
    PublicEventTicketTier:
      type: object
      additionalProperties: false
      required: [tierId, code, name, unitPriceMinor, currency, remaining, transfersAllowed]
      properties:
        tierId: { type: integer, format: int64, minimum: 1 }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        unitPriceMinor: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        remaining: { type: integer, minimum: 0 }
        salesStart: { type: string, format: date-time, nullable: true }
        salesEnd: { type: string, format: date-time, nullable: true }
        transfersAllowed: { type: boolean }
    PublicEventTicketStorefront:
      type: object
      additionalProperties: false
      required: [eventId, title, startsAt, endsAt, tiers, checkoutAvailable]
      properties:
        eventId: { type: integer, format: int64, minimum: 1 }
        title: { type: string }
        description: { type: string, nullable: true }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, nullable: true }
        timezone: { type: string, nullable: true }
        venueName: { type: string, nullable: true }
        venueAddress: { type: string, nullable: true }
        tiers:
          type: array
          items: { $ref: '#/components/schemas/PublicEventTicketTier' }
        checkoutAvailable: { type: boolean }
        unavailableReason: { type: string, nullable: true }
    PublicEventTicketCheckoutRequest:
      type: object
      additionalProperties: false
      required: [tierId, quantity, buyerName, buyerEmail, termsAccepted]
      properties:
        tierId: { type: integer, format: int64, minimum: 1 }
        quantity: { type: integer, minimum: 1, maximum: 100 }
        buyerName: { type: string, minLength: 1, maxLength: 160 }
        buyerEmail: { type: string, format: email, maxLength: 254 }
        buyerPhone: { type: string, minLength: 1, maxLength: 24 }
        promoCode: { type: string, minLength: 1, maxLength: 50, pattern: '^[A-Za-z0-9-]+$' }
        termsAccepted: { type: boolean, enum: [true] }
    PublicEventTicketQuote:
      type: object
      additionalProperties: false
      required: [policyVersion, currency, quantity, unitPriceMinor, grossFaceValueMinor, discountMinor, netFaceValueMinor, buyerPlatformFeeMinor, organizerPlatformFeeMinor, taxMinor, checkoutTotalMinor, organizerPayableMinor, platformFeeMinor, termsVersion]
      properties:
        policyVersion: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        quantity: { type: integer, minimum: 1, maximum: 100 }
        unitPriceMinor: { type: integer, format: int64, minimum: 1 }
        grossFaceValueMinor: { type: integer, format: int64, minimum: 1 }
        discountMinor: { type: integer, format: int64, minimum: 0 }
        netFaceValueMinor: { type: integer, format: int64, minimum: 0 }
        buyerPlatformFeeMinor: { type: integer, format: int64, minimum: 0 }
        organizerPlatformFeeMinor: { type: integer, format: int64, minimum: 0 }
        taxMinor: { type: integer, format: int64, minimum: 0 }
        checkoutTotalMinor: { type: integer, format: int64, minimum: 1 }
        organizerPayableMinor: { type: integer, format: int64, minimum: 0 }
        platformFeeMinor: { type: integer, format: int64, minimum: 0 }
        termsVersion: { type: string }
    PublicEventTicket:
      type: object
      additionalProperties: false
      required: [ticketId, ticketCode, status]
      properties:
        ticketId: { type: integer, format: int64, minimum: 1 }
        ticketCode: { type: string }
        status: { type: string }
        holderName: { type: string, nullable: true }
    PublicEventTicketCheckout:
      type: object
      additionalProperties: false
      required: [orderId, eventId, checkoutId, paymentStatus, fulfillmentStatus, holdExpiresAt, quote, paymentMethods, tickets]
      properties:
        orderId: { type: integer, format: int64, minimum: 1 }
        eventId: { type: integer, format: int64, minimum: 1 }
        checkoutId: { type: string, format: uuid }
        lookupToken: { type: string, nullable: true, writeOnly: true }
        paymentStatus:
          type: string
          enum: [holding, awaiting_payment, processing, paid, failed, cancelled, expired, partially_refunded, refunded, disputed, chargeback]
        fulfillmentStatus:
          type: string
          enum: [seat_held, issued, transfer_requested, transferred, checked_in, cancelled, refunded, expired]
        holdExpiresAt: { type: string, format: date-time }
        quote: { $ref: '#/components/schemas/PublicEventTicketQuote' }
        paymentMethods:
          type: array
          items: { type: string, enum: [datafast, paypal] }
        tickets:
          type: array
          description: Empty until fulfillment issues tickets after verified payment.
          items: { $ref: '#/components/schemas/PublicEventTicket' }
    PublicEventTicketPaypalCaptureRequest:
      type: object
      additionalProperties: false
      required: [paypalOrderId]
      properties:
        paypalOrderId: { type: string, minLength: 6, maxLength: 80, pattern: '^[A-Za-z0-9_-]+$' }
    BookingResource:
      type: object
      required: [brRoomId, brRoomName, brRole]
      properties:
        brRoomId: { type: string }
        brRoomName: { type: string }
        brRole: { type: string }
    Booking:
      type: object
      required: [bookingId, title, startsAt, endsAt, status, resources]
      properties:
        bookingId: { type: integer, format: int64 }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { type: string }
        notes: { type: string, nullable: true }
        partyId: { type: integer, format: int64, nullable: true }
        engineerPartyId: { type: integer, format: int64, nullable: true }
        engineerName: { type: string, nullable: true }
        serviceOfferingId: { type: string, format: uuid, nullable: true }
        serviceType: { type: string, nullable: true }
        serviceOrderId: { type: integer, format: int64, nullable: true }
        serviceOrderTitle: { type: string, nullable: true }
        customerName: { type: string, nullable: true }
        partyDisplayName: { type: string, nullable: true }
        resources: { type: array, items: { $ref: '#/components/schemas/BookingResource' } }
    PublicBookingCreate:
      type: object
      required: [pbFullName, pbEmail, pbServiceOfferingId, pbStartsAt]
      properties:
        pbFullName: { type: string, minLength: 1, maxLength: 160 }
        pbEmail: { type: string, format: email }
        pbPhone: { type: string, nullable: true }
        pbServiceOfferingId: { type: string, format: uuid }
        pbStartsAt: { type: string, format: date-time }
        pbDurationMinutes: { type: integer, minimum: 30, maximum: 840 }
        pbNotes: { type: string, nullable: true, maxLength: 5000 }
        pbEngineerPartyId: { type: integer, format: int64, nullable: true }
        pbEngineerName: { type: string, nullable: true }
        pbResourceIds: { type: array, nullable: true, maxItems: 20, items: { type: string } }
    PublicBookingCheckoutCreate:
      type: object
      required: [pbcFullName, pbcEmail, pbcServiceOfferingId, pbcStartsAt, pbcDurationMinutes, pbcTermsAccepted]
      properties:
        pbcFullName: { type: string, minLength: 1, maxLength: 160 }
        pbcEmail: { type: string, format: email }
        pbcPhone: { type: string, nullable: true }
        pbcServiceOfferingId: { type: string, format: uuid }
        pbcStartsAt: { type: string, format: date-time }
        pbcDurationMinutes: { type: integer, minimum: 30, maximum: 840 }
        pbcNotes: { type: string, nullable: true, maxLength: 5000 }
        pbcEngineerPartyId: { type: integer, format: int64, nullable: true }
        pbcEngineerName: { type: string, nullable: true }
        pbcResourceIds: { type: array, nullable: true, maxItems: 20, items: { type: string } }
        pbcTermsAccepted: { type: boolean, enum: [true] }
    PublicBookingQuote:
      type: object
      required: [policyVersion, currency, durationMinutes, subtotalMinor, taxMinor, totalMinor, depositMinor, balanceMinor, depositBps, termsVersion]
      properties:
        policyVersion: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        durationMinutes: { type: integer, minimum: 1 }
        subtotalMinor: { type: integer, format: int64, minimum: 1 }
        taxMinor: { type: integer, format: int64, minimum: 0 }
        totalMinor: { type: integer, format: int64, minimum: 1 }
        depositMinor: { type: integer, format: int64, minimum: 1 }
        balanceMinor: { type: integer, format: int64, minimum: 0 }
        depositBps: { type: integer, minimum: 1, maximum: 10000 }
        termsVersion: { type: string }
    PublicBookingAvailability:
      type: object
      required: [available, reason, serviceOfferingId, startsAt, endsAt, resourceIds, resourceNames, quote]
      properties:
        available: { type: boolean }
        reason: { type: string, nullable: true }
        serviceOfferingId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        resourceIds: { type: array, items: { type: string } }
        resourceNames: { type: array, items: { type: string } }
        quote: { allOf: [{ $ref: '#/components/schemas/PublicBookingQuote' }], nullable: true }
    PublicBookingCheckout:
      type: object
      required: [booking, checkoutId, lookupToken, paymentStatus, fulfillmentStatus, holdExpiresAt, quote, paymentMethods, manualPayment]
      properties:
        booking: { $ref: '#/components/schemas/Booking' }
        checkoutId: { type: string, format: uuid }
        lookupToken: { type: string, nullable: true, description: Returned only by creation; subsequent status responses return null. }
        paymentStatus: { type: string, enum: [awaiting_payment, processing, paid, failed, cancelled, expired, partially_refunded, refunded, disputed, chargeback] }
        fulfillmentStatus: { type: string, enum: [on_hold, confirmed, scheduled, in_progress, balance_due, completed, reschedule_requested, cancellation_requested, cancelled, no_show, overtime_review, disputed, expired] }
        holdExpiresAt: { type: string, format: date-time }
        quote: { $ref: '#/components/schemas/PublicBookingQuote' }
        paymentMethods:
          type: array
          description: Rails both configured and enabled for this immutable checkout. Empty means no online payment action may be shown.
          uniqueItems: true
          items: { type: string, enum: [datafast, paypal, bank_transfer] }
        manualPayment:
          allOf: [{ $ref: '#/components/schemas/PublicBookingManualPayment' }]
          nullable: true
    PublicBookingManualPaymentCreate:
      type: object
      additionalProperties: false
      required: [paymentMethod]
      properties:
        paymentMethod: { type: string, enum: [bank_transfer] }
    PublicBookingManualEvidenceCreate:
      type: object
      additionalProperties: false
      required: [customerReference]
      properties:
        customerReference: { type: string, minLength: 3, maxLength: 120 }
    PublicBookingManualPayment:
      type: object
      required: [paymentMethod, status, submittedAt]
      properties:
        paymentMethod: { type: string, enum: [bank_transfer, cash, pos] }
        status: { type: string, enum: [awaiting_evidence, submitted, under_review, approved, rejected] }
        submittedAt: { type: string, format: date-time, nullable: true }
    ServiceBookingManualReview:
      type: object
      additionalProperties: false
      required: [action, reviewNotes]
      properties:
        action: { type: string, enum: [approve, reject] }
        reviewNotes: { type: string, minLength: 3, maxLength: 2000 }
    ServiceBookingManualEvidence:
      type: object
      required: [evidenceId, paymentMethod, status, customerReference, submittedAmountMinor, currency, submittedBy, submittedAt, reviewedBy, reviewedAt, reviewNotes]
      properties:
        evidenceId: { type: string, format: uuid }
        paymentMethod: { type: string, enum: [bank_transfer, cash, pos] }
        status: { type: string, enum: [awaiting_evidence, submitted, under_review, approved, rejected] }
        customerReference: { type: string, nullable: true }
        submittedAmountMinor: { type: integer, format: int64, nullable: true }
        currency: { type: string, nullable: true, minLength: 3, maxLength: 3 }
        submittedBy: { type: integer, format: int64, nullable: true }
        submittedAt: { type: string, format: date-time, nullable: true }
        reviewedBy: { type: integer, format: int64, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        reviewNotes: { type: string, nullable: true }
    ServiceBookingCommerce:
      type: object
      required: [bookingId, checkoutId, paymentStatus, fulfillmentStatus, depositMinor, currency, holdExpiresAt, manualEvidence]
      properties:
        bookingId: { type: integer, format: int64, minimum: 1 }
        checkoutId: { type: string, format: uuid }
        paymentStatus: { type: string }
        fulfillmentStatus: { type: string }
        depositMinor: { type: integer, format: int64, minimum: 1 }
