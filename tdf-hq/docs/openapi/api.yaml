        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplaceCustomerRequestSubmit' }
      responses:
        '200':
          description: Persisted request with truthful review state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceCustomerRequest' }
        '400': { description: Invalid request type, reason, date, evidence, or idempotency key }
        '404': { description: Order not found or lookup token invalid }
        '409': { description: Order state changed or a matching request is already pending }
  /marketplace/orders/{orderId}/commerce:
    parameters:
      - $ref: '#/components/parameters/MarketplaceOrderId'
    get:
      tags: [Marketplace administration]
      summary: Read protected marketplace checkout and manual-payment evidence
      operationId: getMarketplaceCommerce
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Protected finance projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceCommerce' }
