    parameters:
      - $ref: '#/components/parameters/MarketplaceCartId'
    post:
      tags: [Marketplace]
      summary: Marketplace Stripe rail (fail-closed compatibility endpoint)
      description: This endpoint cannot create a payment until Stripe is connected to the canonical verified-payment runtime.
      operationId: createMarketplaceStripePaymentIntent
      security: [ ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplaceCheckoutRequest' }
      responses:
        '503': { description: Stripe marketplace checkout is disabled; use Datafast or PayPal }
  /marketplace/cart/{cartId}/datafast/checkout:
    parameters:
      - $ref: '#/components/parameters/MarketplaceCartId'
    post:
      tags: [Marketplace]
      summary: Create or recover a canonical Datafast sale or rental checkout
      operationId: createMarketplaceDatafastCheckout
      security: [ ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplaceCheckoutRequest' }
      responses:
        '200':
          description: Bound hosted checkout and one-time guest lookup token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatafastCheckout' }
        '400': { description: Invalid cart, buyer, fulfillment, or environment configuration }
        '409': { description: Idempotency, asset-hold, or provider-binding conflict }
        '502': { description: Datafast did not create a verifiable checkout resource }
        '503': { description: Datafast or the matching marketplace capability is disabled }
  /marketplace/datafast/status:
    get:
      tags: [Marketplace]
      summary: Verify a marketplace Datafast resource server-to-server
      description: Browser return parameters never mark an order paid. Amount, currency, merchant transaction, environment, order, and stored resource are verified first.
      operationId: confirmMarketplaceDatafastStatus
      security: [ ]
      parameters:
        - name: orderId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: resourcePath
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/OrderLookupToken'
      responses:
        '200':
          description: Current payment and separate fulfillment state after server verification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceOrder' }
        '404': { description: Order not found or lookup token invalid }
        '409': { description: Provider evidence conflicts with the immutable checkout }
        '502': { description: Datafast status could not be verified }
  /marketplace/cart/{cartId}/paypal/create:
    parameters:
      - $ref: '#/components/parameters/MarketplaceCartId'
    post:
      tags: [Marketplace]
      summary: Create or recover a canonical PayPal sale or rental order
      operationId: createMarketplacePaypalOrder
      security: [ ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplaceCheckoutRequest' }
      responses:
        '200':
          description: Bound PayPal order, approval URL, and one-time guest lookup token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaypalCreate' }
        '400': { description: Invalid cart, buyer, fulfillment, or environment configuration }
        '409': { description: Idempotency, asset-hold, or provider-binding conflict }
        '502': { description: PayPal did not create an order }
        '503': { description: PayPal or the matching marketplace capability is disabled }
  /marketplace/paypal/capture:
    post:
      tags: [Marketplace]
      summary: Capture and verify an approved marketplace PayPal order
      description: Capture is idempotent and cannot change payment state until amount, currency, merchant, internal order, environment, and capture resource all match.
      operationId: captureMarketplacePaypalOrder
      security: [ ]
      parameters:
        - $ref: '#/components/parameters/OrderLookupToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplacePaypalCapture' }
      responses:
        '200':
          description: Current payment and separate fulfillment state after server verification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceOrder' }
        '404': { description: Order not found or lookup token invalid }
        '409': { description: Provider evidence conflicts with the immutable checkout }
        '502': { description: Capture or server verification failed }
