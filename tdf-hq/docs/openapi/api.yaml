  /radio/auto-stop-options:
    get:
      tags: [Radio]
      summary: List published browser-broadcast auto-stop options
      description: Returns the specialized persisted options in deterministic order. Exactly one active global option is marked as the broadcast default.
      operationId: listRadioAutoStopOptions
      parameters:
        - name: locale
          in: query
          description: Preferred label locale. Spanish is used unless the locale starts with `en`.
          schema:
            type: string
      responses:
        '200':
          description: Published auto-stop options and the canonical default
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadioAutoStopOptions'
        '503':
          description: Catalog, publication state, or its single effective default is unavailable
  /radio/streams:
    get:
      tags: [Radio]
      summary: Search active radio streams
      description: Returns active streams. Country and genre filtering use immutable UUIDs of active persisted references.
      operationId: searchRadioStreams
      parameters:
        - name: countryId
          in: query
          description: Canonical persisted country UUID; copied codes, labels, and slugs are not accepted.
          schema:
            type: string
            format: uuid
        - name: genreId
          in: query
          description: Canonical persisted genre UUID; copied labels and slugs are not accepted.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Active radio streams in deterministic update order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RadioStream'
        '400':
          description: Unknown or inactive country UUID, or unknown/inactive/unpublished genre UUID
  /radio/streams/active:
    post:
      tags: [Radio]
      summary: Register or reactivate a radio stream
      operationId: upsertActiveRadioStream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RadioStreamUpsert'
      responses:
        '200':
          description: Canonical radio stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadioStream'
        '400':
          description: Invalid stream metadata, unknown/inactive country UUID, or unknown/inactive/unpublished genre UUID
  /radio/streams/import:
    post:
      tags: [Radio]
      summary: Import radio stream sources
      description: Provider country and genre text are retained as review evidence and mapped only when exactly one active persisted reference matches.
      operationId: importRadioStreams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RadioImportRequest'
      responses:
        '200':
          description: Import batch result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadioImportResult'
        '400':
          description: Invalid source list or batch limit
  /radio/streams/refresh-metadata:
    post:
      tags: [Radio]
      summary: Refresh radio metadata
      description: Refreshes station names and observes provider genre text without storing it as a relationship.
      operationId: refreshRadioStreamMetadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RadioMetadataRefreshRequest'
      responses:
        '200':
          description: Refresh batch result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadioMetadataRefreshResult'
        '400':
          description: Invalid refresh limit
  /radio/streams/now-playing:
    post:
      tags: [Radio]
      summary: Get now playing metadata
      description: Returns ICY StreamTitle metadata when the stream provides it.
      operationId: getRadioNowPlaying
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RadioNowPlayingRequest'
      responses:
        '200':
          description: Now playing metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadioNowPlayingResult'
        '400':
          description: Invalid stream url
  /radio/transmissions:
    post:
      tags: [Radio]
      summary: Create a radio transmission
      description: Creates ingest and listening endpoints. The optional genre is referenced only by canonical UUID.
      operationId: createRadioTransmission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RadioTransmissionRequest'
      responses:
        '200':
          description: Transmission endpoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadioTransmissionInfo'
        '400':
          description: Invalid metadata, unknown/inactive country UUID, or unknown/inactive/unpublished genre UUID
  /radio/presence:
    get:
      tags: [Radio]
      summary: Get current user's radio presence
      operationId: getRadioPresence
      responses:
        '200':
          description: Current presence or null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RadioPresence'
                nullable: true
    post:
      tags: [Radio]
      summary: Set current user's radio presence
      operationId: setRadioPresence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RadioPresenceUpsert'
      responses:
        '200':
          description: Updated presence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadioPresence'
        '400':
          description: Invalid presence metadata
    delete:
      tags: [Radio]
      summary: Clear current user's radio presence
      operationId: clearRadioPresence
      responses:
        '204':
          description: Presence cleared
  /radio/presence/{partyId}:
    get:
      tags: [Radio]
      summary: Get a party's radio presence
      operationId: getPartyRadioPresence
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Party presence or null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RadioPresence'
                nullable: true
        '400':
          description: Invalid party identifier
  /live-sessions/intake:
    post:
      tags: [Live Sessions]
      summary: Submit a Live Session intake
      description: >-
        Creates a Live Session intake using canonical persisted genre and instrument UUIDs.
        Musicians and setlist are JSON-encoded strings inside the multipart form. Copied genre,
        instrument, role, label, code, and slug fields are rejected.
      operationId: createLiveSessionIntake
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LiveSessionIntakeMultipart'
      responses:
        '204':
          description: Intake created
        '400':
          description: Invalid multipart data, canonical reference, or terms acceptance
        '401':
          description: Authentication required
        '409':
          description: A supplied musician identity is ambiguous
  /feedback:
    post:
      tags: [Feedback]
      summary: Submit product feedback
      description: >-
        Creates feedback using canonical persisted category and severity UUIDs. Legacy category,
        severity, copied label, code, and slug fields are rejected. Authentication is optional.
      operationId: submitFeedback
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FeedbackMultipart'
      responses:
        '204':
          description: Feedback accepted
        '400':
          description: Invalid multipart data, catalog reference, consent, or attachment
  /feedback/internal:
    get:
      tags: [Internal feedback]
      summary: List the reporter's private reports or all reports for an authorized administrator
      operationId: listInternalFeedback
      parameters:
        - { name: state, in: query, schema: { $ref: '#/components/schemas/InternalReportState' } }
        - { name: module, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: mine, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Access-scoped reports
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/InternalFeedbackSummary' } } } }
        '403': { description: Intern/reporting access is required }
    post:
      tags: [Internal feedback]
      summary: Save an internal report draft linked to the existing feedback record
      operationId: createInternalFeedback
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InternalFeedbackCreate' } } }
      responses:
        '201': { description: Draft created, content: { application/json: { schema: { $ref: '#/components/schemas/InternalFeedback' } } } }
        '400': { description: Invalid report or traceability fields }
        '403': { description: Reporter cannot use the requested task/test relationship }
  /feedback/internal/export.csv:
    get:
      tags: [Internal feedback]
      summary: Export access-scoped reports as CSV
      operationId: exportInternalFeedbackCsv
      parameters:
        - { name: state, in: query, schema: { $ref: '#/components/schemas/InternalReportState' } }
        - { name: module, in: query, schema: { type: string } }
      responses:
        '200': { description: CSV export, content: { text/plain: { schema: { type: string } } } }
  /feedback/internal/export.json:
    get:
      tags: [Internal feedback]
      summary: Export access-scoped reports as JSON
      operationId: exportInternalFeedbackJson
      parameters:
        - { name: state, in: query, schema: { $ref: '#/components/schemas/InternalReportState' } }
        - { name: module, in: query, schema: { type: string } }
      responses:
        '200': { description: JSON export, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/InternalFeedbackSummary' } } } } }
  /feedback/internal/legacy:
    get:
      tags: [Internal feedback]
      summary: Read legacy public feedback without exposing storage paths
      operationId: listLegacyFeedbackForAdmin
      responses:
        '200': { description: Legacy feedback, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LegacyFeedback' } } } } }
        '403': { description: Administrator access required }
  /feedback/internal/{reportId}:
    parameters:
      - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Internal feedback]
      summary: Read one authorized internal report with evidence, discussion, history, and retests
      operationId: getInternalFeedback
      responses:
        '200': { description: Internal report, content: { application/json: { schema: { $ref: '#/components/schemas/InternalFeedback' } } } }
        '404': { description: Unknown or private report }
    patch:
      tags: [Internal feedback]
      summary: Update reporter draft/information or administrator triage fields
      operationId: updateInternalFeedback
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InternalFeedbackUpdate' } } }
      responses:
        '200': { description: Updated report, content: { application/json: { schema: { $ref: '#/components/schemas/InternalFeedback' } } } }
        '403': { description: Attempt to modify an authoritative field }
        '409': { description: Invalid state transition }
  /feedback/internal/{reportId}/submit:
    post:
      tags: [Internal feedback]
      summary: Submit a draft and record receipt without a real external notification
      operationId: submitInternalFeedback
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Received report, content: { application/json: { schema: { $ref: '#/components/schemas/InternalFeedback' } } } }
        '409': { description: Report is not a valid draft }
  /feedback/internal/{reportId}/comments:
    post:
      tags: [Internal feedback]
      summary: Add a comment, information request, or information response
      operationId: commentOnInternalFeedback
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InternalFeedbackCommentCreate' } } }
      responses:
        '201': { description: Comment recorded, content: { application/json: { schema: { $ref: '#/components/schemas/InternalFeedbackComment' } } } }
  /feedback/internal/{reportId}/evidence:
