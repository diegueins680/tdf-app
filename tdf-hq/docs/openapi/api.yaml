  /services/storefront/paypal/webhook:
    post:
      tags: [Service storefront]
      summary: Receive a PayPal webhook into the encrypted idempotent event inbox
      description: All PayPal transmission headers and the exact raw event are verified with PayPal before a production event may affect payment state.
      operationId: receiveServiceStorefrontPaypalWebhook
      security: [ ]
      parameters:
        - { name: PayPal-Transmission-Id, in: header, required: true, schema: { type: string } }
        - { name: PayPal-Transmission-Time, in: header, required: true, schema: { type: string, format: date-time } }
        - { name: PayPal-Cert-Url, in: header, required: true, schema: { type: string, format: uri } }
        - { name: PayPal-Auth-Algo, in: header, required: true, schema: { type: string } }
        - { name: PayPal-Transmission-Sig, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Event was verified and processed, ignored, or durably scheduled for bounded retry }
        '400': { description: Required signature header or event envelope is invalid }
        '401': { description: PayPal signature verification failed }
        '409': { description: Provider event identifier conflicts with different raw evidence }
        '501': { description: Webhook capability is disabled for this environment }
