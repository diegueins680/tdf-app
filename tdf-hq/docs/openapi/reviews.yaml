openapi: 3.0.0
info: { title: TDF Verified Reviews API, version: 1.0.0 }
paths:
  /reputation/categories:
    get:
      tags: [Contextual reputation]
      operationId: listReputationCategories
      summary: List active official reputation categories
      security: []
      parameters:
        - { name: locale, in: query, schema: { type: string, enum: [es, en], default: es } }
      responses:
        '200':
          description: Active categories only; proposals and archived entries are excluded
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ReputationCategory' } } } }
  /reputation/profiles/{partyId}:
    get:
      tags: [Contextual reputation]
      operationId: getPublicReputation
      summary: Get aggregated public reputation without evaluator identities
      security: []
      parameters:
        - { name: partyId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: Aggregate public reputation, or a formation state below the sample threshold
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicReputation' } } }
        '404': { description: Profile not found }
  /reputation/preferences:
    get:
      tags: [Contextual reputation]
      operationId: getMyReputationPreferences
      summary: Get the authenticated viewer's private category preferences
      description: Returns only the caller's personal relevance preferences. It never returns private rankings or evaluator identities.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: contextKind, in: query, schema: { type: string, minLength: 1, maxLength: 80, default: general } }
      responses:
        '200':
          description: Private saved preference profile, or an empty draft for the context
          content: { application/json: { schema: { $ref: '#/components/schemas/ReputationPreference' } } }
        '401': { description: Authentication required }
        '404': { description: Contextual reputation is not enabled for this deployment }
    put:
      tags: [Contextual reputation]
      operationId: saveMyReputationPreferences
      summary: Save the authenticated viewer's private category preferences
      description: Idempotent, optimistic-concurrency save. Personal priorities never alter public reputation.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 160 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReputationPreferenceSave' } } }
      responses:
        '200':
          description: Saved private preference profile; identical retries return the original response
          content: { application/json: { schema: { $ref: '#/components/schemas/ReputationPreference' } } }
        '400': { description: Invalid category positions, weights, or activation invariants }
        '401': { description: Authentication required }
        '404': { description: Contextual reputation is not enabled for this deployment }
        '409': { description: Preference revision conflict or idempotency key conflict }
  /reviews/{targetKind}/{targetId}:
    get:
      tags: [Verified reviews]
      operationId: listPublicExperienceReviews
      summary: List public reviews backed by completed interactions
      security: []
      parameters:
        - { $ref: '#/components/parameters/TargetKind' }
        - { $ref: '#/components/parameters/TargetId' }
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Stable page of published verified reviews and its aggregate
          content: { application/json: { schema: { $ref: '#/components/schemas/ExperienceReviewPage' } } }
        '400': { description: Invalid target kind or identifier }
        '404': { description: Review target not found }
  /reviews/eligibility:
    get:
      tags: [Verified reviews]
      operationId: listExperienceReviewEligibility
      summary: List this account's completed, not-yet-reviewed interactions
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: targetKind, in: query, schema: { $ref: '#/components/schemas/ExperienceReviewTargetKind' } }
        - { name: targetId, in: query, schema: { type: string } }
      responses:
        '200':
          description: Private eligibility evidence for the authenticated account
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ExperienceReviewEligibility' } }
        '400': { description: Invalid or incomplete target filter }
        '401': { description: Authentication required }
  /reviews:
    post:
      tags: [Verified reviews]
      operationId: createExperienceReview
      summary: Publish one review for an eligible completed interaction
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 160 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ExperienceReviewCreate' } } }
      responses:
        '201':
          description: Idempotent published verified review
          content: { application/json: { schema: { $ref: '#/components/schemas/ExperienceReview' } } }
        '400': { description: Invalid review payload }
        '401': { description: Authentication required }
        '409': { description: Interaction is ineligible, already reviewed, or the idempotency key conflicts }
        '429': { description: Daily review limit exceeded }
components:
  parameters:
    TargetKind:
      name: targetKind
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ExperienceReviewTargetKind' }
    TargetId:
      name: targetId
      in: path
      required: true
      schema: { type: string }
  schemas:
    ReputationCategory:
      type: object
      additionalProperties: false
      required: [id, slug, name, description, defaultPosition, institutionalWeight, version]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        defaultPosition: { type: integer, minimum: 1 }
        institutionalWeight: { type: number, minimum: 0, maximum: 100 }
        version: { type: integer, minimum: 1 }
    PublicReputation:
      type: object
      additionalProperties: false
      required: [partyId, formulaVersion, status, verifiedInteractions, confidence, categories]
      properties:
        partyId: { type: integer, format: int64 }
        formulaVersion: { type: string }
        status: { type: string, enum: [forming, published] }
        score: { type: number, minimum: 0, maximum: 100, nullable: true }
        verifiedInteractions: { type: integer, minimum: 0 }
        confidence: { type: string, enum: [forming, low, moderate, high] }
        categories:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [slug, score, lowerBound, upperBound, verifiedCount, confidence]
            properties:
              slug: { type: string }
              score: { type: number, minimum: 0, maximum: 100 }
              lowerBound: { type: number, minimum: 0, maximum: 100 }
              upperBound: { type: number, minimum: 0, maximum: 100 }
              verifiedCount: { type: integer, minimum: 0 }
              confidence: { type: string, enum: [forming, low, moderate, high] }
    ReputationPreference:
      type: object
      additionalProperties: false
      required: [contextKind, status, revision, formulaVersion, categories]
      properties:
        contextKind: { type: string }
        status: { type: string, enum: [draft, active, archived] }
        revision: { type: integer, minimum: 0 }
        formulaVersion: { type: string }
        categories:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [categoryId, slug, position, weight, notApplicable]
            properties:
              categoryId: { type: string, format: uuid }
              slug: { type: string }
              position: { type: integer, minimum: 1 }
              weight: { type: number, minimum: 0, maximum: 100 }
              notApplicable: { type: boolean }
    ReputationPreferenceSave:
      type: object
      additionalProperties: false
      required: [contextKind, expectedRevision, activate, categories]
      properties:
        contextKind: { type: string, minLength: 1, maxLength: 80 }
        expectedRevision: { type: integer, minimum: 0 }
        activate: { type: boolean }
        categories:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [categoryId, position, weight, notApplicable]
            properties:
              categoryId: { type: string, format: uuid }
              position: { type: integer, minimum: 1 }
              weight: { type: number, minimum: 0, maximum: 100 }
              notApplicable: { type: boolean }
    ExperienceReviewTargetKind:
      type: string
      enum: [event, marketplace_listing, service_offering, service_package]
    ExperienceReviewSourceKind:
      type: string
      enum: [event_ticket_order, marketplace_order, service_booking, service_storefront_order]
    ExperienceReviewAuthor:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }
        avatarUrl: { type: string, format: uri, nullable: true }
    ExperienceReview:
      type: object
      additionalProperties: false
      required: [id, targetKind, targetId, rating, status, createdAt, verified, sourceKind, author]
      properties:
        id: { type: string, format: uuid }
        targetKind: { $ref: '#/components/schemas/ExperienceReviewTargetKind' }
        targetId: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string, nullable: true }
        status: { type: string, enum: [published, hidden, removed] }
        createdAt: { type: string, format: date-time }
        verified: { type: boolean, enum: [true] }
        sourceKind: { $ref: '#/components/schemas/ExperienceReviewSourceKind' }
        author: { $ref: '#/components/schemas/ExperienceReviewAuthor' }
    PublicExperienceReview:
      allOf:
        - { $ref: '#/components/schemas/ExperienceReview' }
      description: Public projection; the private source identifier is never returned.
    ExperienceReviewSummary:
      type: object
      additionalProperties: false
      required: [targetKind, targetId, count]
      properties:
        targetKind: { $ref: '#/components/schemas/ExperienceReviewTargetKind' }
        targetId: { type: string }
        average: { type: number, minimum: 1, maximum: 5, nullable: true }
        count: { type: integer, format: int64, minimum: 0 }
    ExperienceReviewPage:
      type: object
      additionalProperties: false
      required: [summary, items]
      properties:
        summary: { $ref: '#/components/schemas/ExperienceReviewSummary' }
        items: { type: array, items: { $ref: '#/components/schemas/PublicExperienceReview' } }
        nextCursor: { type: string, format: uuid, nullable: true }
    ExperienceReviewEligibility:
      type: object
      additionalProperties: false
      required: [targetKind, targetId, targetTitle, sourceKind, sourceId, completedAt]
      properties:
        targetKind: { $ref: '#/components/schemas/ExperienceReviewTargetKind' }
        targetId: { type: string }
        targetTitle: { type: string }
        sourceKind: { $ref: '#/components/schemas/ExperienceReviewSourceKind' }
        sourceId: { type: string, description: Private evidence identifier; available only to the eligible account. }
        completedAt: { type: string, format: date-time }
    ExperienceReviewCreate:
      type: object
      additionalProperties: false
      required: [targetKind, targetId, sourceKind, sourceId, rating]
      properties:
        targetKind: { $ref: '#/components/schemas/ExperienceReviewTargetKind' }
        targetId: { type: string }
        sourceKind: { $ref: '#/components/schemas/ExperienceReviewSourceKind' }
        sourceId: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string, minLength: 10, maxLength: 2000, nullable: true }
