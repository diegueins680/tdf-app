      properties: { count: { type: integer }, minMinor: { type: integer, format: int64, nullable: true }, maxMinor: { type: integer, format: int64, nullable: true }, currencyId: { type: string, format: uuid, nullable: true } }
    OfferRound:
      type: object
      additionalProperties: false
      required: [roundNumber, actorRole, kind, createdAt]
      properties:
        roundNumber: { type: integer, minimum: 1, maximum: 10 }
        actorRole: { type: string, enum: [applicant, author] }
        kind: { type: string, enum: [initial, counter, accept] }
        amountMinor: { type: integer, format: int64, nullable: true }
        currencyId: { type: string, format: uuid, nullable: true }
        terms: { $ref: '#/components/schemas/OfferTerms' }
        message: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    OfferCounterRequest:
      type: object
      required: [amountMinor, currencyId]
      properties:
        amountMinor: { type: integer, format: int64, minimum: 0 }
