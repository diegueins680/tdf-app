    DirectoryReview:
      type: object
      additionalProperties: false
      required: [id, interactionId, rating, status, createdAt, verifiedInteractionType, authorProfile, subjectProfile]
      properties:
        id: { type: string, format: uuid }
        interactionId: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string, nullable: true }
        status: { type: string, enum: [pending, published, hidden, removed] }
        createdAt: { type: string, format: date-time }
        verifiedInteractionType: { $ref: '#/components/schemas/DirectoryInteractionType' }
        authorProfile: { $ref: '#/components/schemas/DirectoryProfileReference' }
        subjectProfile: { $ref: '#/components/schemas/DirectoryProfileReference' }
    DirectoryReviewEligibility:
      type: object
      additionalProperties: false
      required: [interactionId, interactionKind, verifiedAt, authorProfile, subjectProfile]
