        targetProfileId: { type: string, format: uuid }
        classifiedId: { type: string, format: uuid, nullable: true }
        message: { type: string }
        status: { type: string, enum: [pending, accepted, declined, withdrawn, blocked, conversation_open, converted, expired] }
        expiresAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
        participantRole: { type: string, enum: [sender, target, admin] }
        senderProfile: { $ref: '#/components/schemas/DirectoryProfileReference' }
        targetProfile: { $ref: '#/components/schemas/DirectoryProfileReference' }
        classified: { allOf: [{ $ref: '#/components/schemas/DirectoryClassifiedReference' }], nullable: true }
    DirectoryContact: { type: object, required: [senderProfileId, targetProfileId, contextKind, contextId, message], properties: { senderProfileId: { type: string, format: uuid }, targetProfileId: { type: string, format: uuid }, contextKind: { type: string, enum: [profile, classified, application, invitation] }, contextId: { type: string, format: uuid }, message: { type: string, minLength: 1, maxLength: 5000 } } }
    DirectoryInteractionType: { type: string, enum: [booking, service_order, marketplace_order, event_collaboration, confirmed_collaboration] }
    DirectoryReviewCreate:
