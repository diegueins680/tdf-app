        terms: { $ref: '#/components/schemas/OfferTerms' }
        message: { type: string, minLength: 1, maxLength: 5000 }
        expiresAt: { type: string, format: date-time }
    OfferReputation: { type: object, nullable: true, additionalProperties: false, properties: { ratingAvg: { type: number, nullable: true }, ratingCount: { type: integer }, completedCount: { type: integer } } }
    ClassifiedApplication:
      type: object
      description: Private to participants and authorized admins. An offer with its current negotiation state; rounds are included on the detail endpoint.
      required: [id, classifiedId, applicantProfileId, applicantProfile, message, status, currentRound, lastActorRole, participantRole, submittedAt, version]
      properties:
        id: { type: string, format: uuid }
        classifiedId: { type: string, format: uuid }
        classified: { type: object, additionalProperties: true, properties: { id: { type: string, format: uuid }, authorProfileId: { type: string, format: uuid }, title: { type: string }, slug: { type: string }, status: { type: string }, priceMode: { $ref: '#/components/schemas/PriceMode' }, slots: { type: integer }, slotsRemaining: { type: integer }, offerDeadlineAt: { type: string, format: date-time, nullable: true }, budget: { $ref: '#/components/schemas/OfferBudget' } } }
        applicantProfileId: { type: string, format: uuid }
        applicantProfile: { type: object, required: [id, name, slug], properties: { id: { type: string, format: uuid }, name: { type: string }, slug: { type: string }, kind: { type: string } } }
        message: { type: string }
        portfolio: { type: array, items: { type: object, additionalProperties: true } }
        availability: { type: string, nullable: true }
        currencyId: { type: string, format: uuid, nullable: true }
        proposedAmountMinor: { type: integer, format: int64, nullable: true, description: Initial offered amount }
        currentAmountMinor: { type: integer, format: int64, nullable: true, description: Amount of the latest round }
        acceptedAmountMinor: { type: integer, format: int64, nullable: true }
        currentRound: { type: integer, minimum: 1, maximum: 10 }
        lastActorRole: { type: string, enum: [applicant, author] }
        terms: { $ref: '#/components/schemas/OfferTerms' }
        offerExpiresAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [submitted, viewed, shortlisted, countered_by_author, countered_by_applicant, accepted, rejected, withdrawn, expired, conversation_open, converted] }
        rejectionReason: { type: string, enum: [author_decision, slots_filled, classified_closed], nullable: true }
        participantRole: { type: string, enum: [author, applicant, admin] }
        reputation: { $ref: '#/components/schemas/OfferReputation' }
        rounds: { type: array, items: { $ref: '#/components/schemas/OfferRound' } }
        submittedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        acceptedAt: { type: string, format: date-time, nullable: true }
        version: { type: integer, format: int64 }
    InvitationCreate: { type: object, required: [senderProfileId, targetProfileId, message], properties: { senderProfileId: { type: string, format: uuid }, targetProfileId: { type: string, format: uuid }, classifiedId: { type: string, format: uuid }, message: { type: string, minLength: 10, maxLength: 5000 } } }
    DirectoryProfileReference: { type: object, additionalProperties: false, required: [id, name, slug], properties: { id: { type: string, format: uuid }, name: { type: string }, slug: { type: string } } }
    DirectoryClassifiedReference: { type: object, additionalProperties: false, required: [id, title, slug, status], properties: { id: { type: string, format: uuid }, title: { type: string }, slug: { type: string }, status: { type: string } } }
    DirectoryInvitation:
      type: object
