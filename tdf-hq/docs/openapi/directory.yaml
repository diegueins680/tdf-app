openapi: 3.0.0
info: { title: TDF Music Directory API, version: 1.0.0 }
paths:
  /directory/search:
    get:
      tags: [Music directory]
      operationId: searchDirectory
      summary: Search the public, current, moderated music directory
      security: []
      parameters:
        - { $ref: '#/components/parameters/SearchQuery' }
        - { name: entityType, in: query, schema: { type: string, enum: [profile, artist, classified, event, venue] } }
        - { name: profileKind, in: query, schema: { type: string, enum: [person, artist, band, project] } }
        - { name: intent, in: query, description: 'ADR 0132: restricts results to classifieds whose category intent is seeking (busco) or offering (ofrezco)', schema: { $ref: '#/components/schemas/ClassifiedIntent' } }
        - { name: cityId, in: query, schema: { type: string, format: uuid } }
        - { name: latitude, in: query, description: Consented ephemeral search latitude, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: longitude, in: query, description: Consented ephemeral search longitude, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: radiusKm, in: query, schema: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 500 } }
        - { name: professionId, in: query, schema: { type: string, format: uuid } }
        - { name: serviceId, in: query, schema: { type: string, format: uuid } }
        - { name: instrumentId, in: query, schema: { type: string, format: uuid } }
        - { name: genreId, in: query, schema: { type: string, format: uuid } }
        - { name: remote, in: query, schema: { type: boolean } }
        - { name: available, in: query, schema: { type: boolean } }
        - { name: dateFrom, in: query, schema: { type: string, format: date-time } }
        - { name: dateTo, in: query, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Organic results, separate sponsored results, and facets, content: { application/json: { schema: { $ref: '#/components/schemas/DirectorySearchResponse' } } } }
        '400': { description: Unsupported target kind filter }
  /directory/suggestions:
    get:
      tags: [Music directory]
      operationId: suggestDirectoryQuery
      security: []
      parameters:
        - { $ref: '#/components/parameters/SearchQuery' }
        - { name: cityId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Canonical taxonomy and entity suggestions, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DirectorySuggestion' } } } } }
  /directory/taxonomies:
    get:
      tags: [Music directory]
      operationId: getDirectoryTaxonomies
      security: []
      parameters: [{ name: locale, in: query, schema: { type: string, enum: [es, en, pt], default: es } }]
      responses:
        '200': { description: Database-governed directory options, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryTaxonomies' } } } }
  /directory/profiles/{slug}:
    get:
      tags: [Music directory]
      operationId: getPublicDirectoryProfile
      security: []
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200': { description: Safe public profile projection, content: { application/json: { schema: { $ref: '#/components/schemas/PublicDirectoryProfile' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /directory/party-profiles/{partyId}:
    get:
      tags: [Music directory]
      operationId: getPublicDirectoryProfileByParty
      summary: Resolve an artist's public directory profile without exposing Party data in the response
      security: []
      parameters:
        - { name: partyId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { description: Safe public profile projection, content: { application/json: { schema: { $ref: '#/components/schemas/PublicDirectoryProfile' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /directory/profiles/{slug}/reviews:
    get:
      tags: [Music directory trust]
      operationId: listPublicDirectoryReviews
      security: []
      parameters:
        - { $ref: '#/components/parameters/Slug' }
        - { name: cursor, in: query, schema: { type: string, format: uuid }, description: Last visible review id from the previous stable page }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Published reviews backed by verified completed interactions, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryReviewPage' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /directory/classifieds/{slug}:
    get:
      tags: [Music classifieds]
      operationId: getPublicClassified
      security: []
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200': { description: Published and unexpired classified, content: { application/json: { schema: { $ref: '#/components/schemas/PublicClassified' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /directory/events/{eventId}:
    get:
      tags: [Music directory]
      operationId: getPublicDirectoryEvent
      security: []
      parameters: [{ name: eventId, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '200': { description: Public-listable event without privileged browser credentials, content: { application/json: { schema: { $ref: '#/components/schemas/PublicDirectoryEvent' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /directory/venues/{venueId}:
    get:
      tags: [Music directory]
      operationId: getPublicDirectoryVenue
      security: []
      parameters: [{ name: venueId, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '200': { description: Safe public venue projection, content: { application/json: { schema: { $ref: '#/components/schemas/PublicDirectoryVenue' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /directory/age-assurance:
    put:
      tags: [Music directory account]
      operationId: setDirectoryAgeAssurance
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AgeAssuranceRequest' } } } }
      responses: { '200': { description: Restricted age-assurance state; adult attestation is not identity verification } }
  /directory/profiles:
    get:
      tags: [Music directory account]
      operationId: listManagedDirectoryProfiles
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Explicitly managed profiles, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ManagedDirectoryProfile' } } } } } }
    post:
      tags: [Music directory account]
      operationId: createDirectoryProfile
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryProfileUpsert' } } } }
      responses: { '201': { description: Draft profile with an explicit manager grant, content: { application/json: { schema: { $ref: '#/components/schemas/ManagedDirectoryProfile' } } } } }
  /directory/profiles/{profileId}:
    put:
      tags: [Music directory account]
      operationId: updateDirectoryProfile
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProfileId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryProfileUpsert' } } } }
      responses: { '200': { description: Updated explicitly managed profile, content: { application/json: { schema: { $ref: '#/components/schemas/ManagedDirectoryProfile' } } } } }
  /directory/profiles/{profileId}/status:
    patch:
      tags: [Music directory account]
      operationId: transitionDirectoryProfile
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProfileId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StatusRequest' } } } }
      responses: { '200': { description: Transitioned profile, content: { application/json: { schema: { $ref: '#/components/schemas/ManagedDirectoryProfile' } } } } }
  /directory/classifieds:
    get:
      tags: [Music classifieds]
      operationId: listManagedClassifieds
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Classifieds authored by explicitly managed profiles, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ManagedClassified' } } } } } }
    post:
      tags: [Music classifieds]
      operationId: createClassified
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClassifiedCreate' } } } }
      responses: { '201': { description: Draft classified, content: { application/json: { schema: { $ref: '#/components/schemas/ManagedClassified' } } } } }
  /directory/classifieds/{classifiedId}/status:
    patch:
      tags: [Music classifieds]
      operationId: transitionClassified
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ClassifiedId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StatusRequest' } } } }
      responses: { '200': { description: Classified state transition } }
  /directory/classifieds/{classifiedId}/applications:
    get:
      tags: [Music classifieds]
      operationId: listClassifiedApplications
      summary: Offers received on a classified (author only), sortable for comparison
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ClassifiedId' }
        - { name: sort, in: query, schema: { type: string, enum: [recent, price_asc, price_desc, reputation] } }
      responses: { '200': { description: Private participant-scoped offers with their negotiation state and the offerer's reputation, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ClassifiedApplication' } } } } } }
    post:
      tags: [Music classifieds]
      operationId: createClassifiedApplication
      summary: Submit an offer (initial negotiation round) on a classified
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ClassifiedId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationCreate' } } } }
      responses:
        '201': { description: Idempotent offer, content: { application/json: { schema: { $ref: '#/components/schemas/ClassifiedApplication' } } } }
        '409': { description: 'No slot left, offer deadline passed, fixed price not matched, derived listing, or an active offer already exists for this profile' }
  /directory/applications:
    get:
      tags: [Music classifieds]
      operationId: listMyApplications
      summary: Offers made through profiles the caller manages (ADR 0132)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, accepted, closed] } }
      responses: { '200': { description: 'Offers where the caller is the offerer, newest first', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ClassifiedApplication' } } } } } }
  /directory/applications/{applicationId}:
    get:
      tags: [Music classifieds]
      operationId: getClassifiedApplication
      summary: One offer with its full negotiation chain (participants and admins)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: applicationId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Offer detail with rounds, content: { application/json: { schema: { $ref: '#/components/schemas/ClassifiedApplication' } } } }, '404': { description: Not a participant } }
  /directory/applications/{applicationId}/counter:
    post:
      tags: [Music classifieds]
      operationId: counterClassifiedApplication
      summary: Record a counter-offer round from the author or the offerer (ADR 0132)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: applicationId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OfferCounterRequest' } } } }
      responses:
        '201': { description: Updated offer with the new round, content: { application/json: { schema: { $ref: '#/components/schemas/ClassifiedApplication' } } } }
        '409': { description: "Not this participant's turn, offer closed or expired, fixed-price classified, or round limit reached" }
  /directory/applications/{applicationId}/status:
    patch:
      tags: [Music classifieds]
      operationId: transitionClassifiedApplication
      security: [{ bearerAuth: [] }]
      parameters: [{ name: applicationId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StatusRequest' } } } }
      responses: { '200': { description: Participant-authorized transition } }
  /directory/invitations:
    get:
      tags: [Music directory contact]
      operationId: listDirectoryInvitations
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Participant-scoped invitations, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DirectoryInvitation' } } } } } }
    post:
      tags: [Music directory contact]
      operationId: createDirectoryInvitation
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationCreate' } } } }
      responses: { '201': { description: Preference-checked invitation, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryInvitation' } } } } }
  /directory/invitations/{invitationId}/status:
    patch:
      tags: [Music directory contact]
      operationId: transitionDirectoryInvitation
      security: [{ bearerAuth: [] }]
      parameters: [{ name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StatusRequest' } } } }
      responses: { '200': { description: Participant-authorized transition } }
  /directory/contact:
    post:
      tags: [Music directory contact]
      operationId: contactDirectoryProfile
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryContact' } } } }
      responses: { '201': { description: Existing chat thread linked to directory context } }
  /directory/review-eligibility:
    get:
      tags: [Music directory trust]
      operationId: listDirectoryReviewEligibility
      security: [{ bearerAuth: [] }]
      parameters: [{ name: authorProfileId, in: query, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Private review directions for explicitly managed profiles and verified completed interactions, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DirectoryReviewEligibility' } } } } } }
  /directory/reviews:
    post:
      tags: [Music directory trust]
      operationId: createDirectoryReview
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryReviewCreate' } } } }
      responses:
        '201': { description: Idempotent review backed by an eligible verified completed interaction, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryReview' } } } }
        '409': { description: Interaction is not eligible or was already reviewed }
  /directory/favorites:
    get:
      tags: [Music directory account]
      operationId: listDirectoryFavorites
      security: [{ bearerAuth: [] }]
      parameters:
        - name: targetKind
          in: query
          description: Restrict the authenticated Party's favorites to one supported kind. Saved-event synchronization uses `event`.
          schema: { $ref: '#/components/schemas/DirectoryEntityType' }
      responses:
        '200':
          description: Current authenticated Party favorites
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DirectoryFavorite' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /directory/favorites/{targetKind}/{targetId}:
    put:
      tags: [Music directory account]
      operationId: saveDirectoryFavorite
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TargetKind' }, { $ref: '#/components/parameters/TargetId' }]
      responses:
        '200': { description: Desired saved state confirmed idempotently after validating the canonical public target; event targets must still be upcoming }
        '400': { description: Unsupported kind or malformed target identifier }
        '404': { description: Target not found, not publicly eligible, or event no longer upcoming }
    delete:
      tags: [Music directory account]
      operationId: deleteDirectoryFavorite
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TargetKind' }, { $ref: '#/components/parameters/TargetId' }]
      responses:
        '200': { description: Desired removed state confirmed idempotently; canonical and valid legacy identifier variants are removed together }
        '400': { description: Unsupported kind or empty/oversized target identifier }
  /directory/saved-searches:
    get:
      tags: [Music directory alerts]
      operationId: listSavedDirectorySearches
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Saved searches and alert preferences, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SavedDirectorySearch' } } } } } }
    post:
      tags: [Music directory alerts]
      operationId: createSavedDirectorySearch
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SavedSearchCreate' } } } }
      responses: { '201': { description: Idempotent saved search; alert deliveries are deduplicated by result version } }
  /directory/artist-claim-targets/{partyId}:
    put:
      operationId: prepareArtistManagementClaim
      summary: Prepare a core artist for a reviewed management claim
      description: Authenticated, idempotent preparation. Reuses an existing canonical directory target or creates a private draft under a per-artist lock. Returns only an opaque target ID and the core artist public name. Does not publish, grant permissions, or transfer identity. Archived, suspended and blocked targets are denied.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: partyId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Persisted claim target; no management access granted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, name]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
        '401': { description: Authentication required }
        '404': { description: Artist unavailable for claims }
  /directory/claims:
    post:
      tags: [Music directory trust]
      operationId: createDirectoryClaim
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClaimCreate' } } } }
      responses: { '201': { description: Submitted claim; it grants no management before approval } }
  /directory/verifications:
    post:
      tags: [Music directory trust]
      operationId: createDirectoryVerificationRequest
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VerificationCreate' } } } }
      responses: { '201': { description: Submitted independent verification request } }
  /directory/reports:
    post:
      tags: [Music directory moderation]
      operationId: reportDirectoryContent
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReportCreate' } } } }
      responses: { '201': { description: Deduplicated community report } }
  /directory/admin/claims:
    get:
      tags: [Music directory administration]
      operationId: listDirectoryClaimsForReview
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Admin-only claim queue } }
  /directory/admin/claims/{claimId}/status:
    patch:
      tags: [Music directory administration]
      operationId: decideDirectoryClaim
      security: [{ bearerAuth: [] }]
      parameters: [{ name: claimId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StatusRequest' } } } }
      description: Requires Admin role and Admin module with a reviewer distinct from the claimant. Decisions serialize on the current claim; identical-state retries preserve review evidence and cannot reactivate revoked grants. Revoking an approved claim (status revoked, AUTHORITY-097) requires a non-empty reason, deactivates every manager grant the claim created in the same transaction and is terminal.
      responses:
        '200': { description: Reviewed claim; only a new approval transition creates a manager grant, and only revocation withdraws them }
        '400': { description: Revocation without a reason }
        '401': { description: Authentication required }
        '403': { description: Missing Admin role or module or attempted self-review }
        '404': { description: Claim not found }
        '409': { description: Current claim state forbids this transition }
        '500': { description: Transaction failed; decision and grant rolled back }
  /directory/admin/verifications:
    get:
      tags: [Music directory administration]
      operationId: listDirectoryVerificationsForReview
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Admin-only verification queue } }
  /directory/admin/verifications/{verificationId}/status:
    patch:
      tags: [Music directory administration]
      operationId: decideDirectoryVerification
      security: [{ bearerAuth: [] }]
      parameters: [{ name: verificationId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StatusRequest' } } } }
      responses: { '200': { description: Independent verification decision } }
  /directory/admin/moderation:
    get:
      tags: [Music directory administration]
      operationId: listDirectoryModerationQueue
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Admin-only moderation cases and reports } }
  /directory/admin/moderation/{caseId}/decisions:
    post:
      tags: [Music directory administration]
      operationId: decideDirectoryModerationCase
      security: [{ bearerAuth: [] }]
      parameters: [{ name: caseId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ModerationDecision' } } } }
      responses: { '201': { description: Auditable moderation decision } }
  /directory/admin/merges:
    post:
      tags: [Music directory administration]
      operationId: mergeDirectoryProfiles
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileMerge' } } } }
      responses: { '201': { description: Non-destructive, idempotent profile merge preserving source references and slug resolution } }
components:
  parameters:
    SearchQuery: { name: q, in: query, schema: { type: string, maxLength: 160 } }
    Cursor: { name: cursor, in: query, schema: { type: string }, description: Opaque stable keyset cursor }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
    Slug: { name: slug, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]+$' } }
    ProfileId: { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
    ClassifiedId: { name: classifiedId, in: path, required: true, schema: { type: string, format: uuid } }
    TargetKind: { name: targetKind, in: path, required: true, schema: { $ref: '#/components/schemas/DirectoryEntityType' } }
    TargetId:
      name: targetId
      in: path
      required: true
      description: Event and venue IDs are canonical positive integers; profile and classified IDs are UUIDs. DELETE also accepts an exact invalid legacy value so an owner can remove historical data.
      schema: { type: string, maxLength: 160 }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 160 } }
  responses:
    BadRequest: { description: Invalid input, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    NotFound: { description: Not found or not publicly eligible, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  schemas:
    ApiError:
      type: object
      required: [error]
      properties: { error: { type: string }, code: { type: string }, correlationId: { type: string } }
    DirectoryEntityType: { type: string, enum: [profile, classified, event, venue] }
    PublicLocation:
      type: object
      description: Safe public location; exact residential address and private coordinates are structurally absent.
      additionalProperties: false
      properties:
        cityId: { type: string, format: uuid, nullable: true }
        city: { type: string, nullable: true }
        countryCode: { type: string, nullable: true }
        sector: { type: string, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        precision: { type: string, enum: [country, region, metro, city, sector, commercial_exact], nullable: true }
        distanceKm: { type: number, nullable: true }
    DirectorySearchItem:
      type: object
      additionalProperties: false
      required: [id, type, slug, title, location, taxonomy, score, scoreBreakdown, sponsored]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/DirectoryEntityType' }
        slug: { type: string }
