        city: { type: string, nullable: true }
    DirectoryFavorite:
      type: object
      additionalProperties: false
      required: [targetKind, targetId, createdAt, result]
      properties:
        targetKind: { $ref: '#/components/schemas/DirectoryEntityType' }
        targetId: { type: string, description: Canonical identifier for this favorite kind. }
        createdAt: { type: string, format: date-time }
        result: { allOf: [{ $ref: '#/components/schemas/DirectoryFavoriteResult' }], nullable: true }
    SavedSearchCreate: { type: object, required: [name, canonicalQuery, alertsEnabled, alertFrequency], properties: { name: { type: string, minLength: 1, maxLength: 120 }, canonicalQuery: { type: object, additionalProperties: true }, alertsEnabled: { type: boolean }, alertFrequency: { type: string, enum: [instant, daily, weekly, off] } } }
    SavedDirectorySearch: { allOf: [{ $ref: '#/components/schemas/SavedSearchCreate' }, { type: object, required: [id, createdAt], properties: { id: { type: string, format: uuid }, createdAt: { type: string, format: date-time }, lastEvaluatedAt: { type: string, format: date-time, nullable: true } } }] }
    ClaimCreate: { type: object, required: [profileId, claimType, evidence], properties: { profileId: { type: string, format: uuid }, claimType: { type: string, enum: [profile, organization, venue, administration, credit] }, evidence: { type: array, items: { type: object, additionalProperties: true } } } }
    VerificationCreate: { type: object, required: [profileId, verificationType, evidence], properties: { profileId: { type: string, format: uuid }, verificationType: { type: string, enum: [identity, organization, venue, ownership, administration, professional_credit] }, evidence: { type: array, items: { type: object, additionalProperties: true } } } }
    ReportCreate: { type: object, required: [targetKind, targetId, reasonCode], properties: { targetKind: { type: string, enum: [profile, classified, application, invitation, event, venue, message, review] }, targetId: { type: string }, reasonCode: { type: string }, details: { type: string, minLength: 10, maxLength: 3000 } } }
    ModerationDecision: { type: object, required: [decision, reasonCode, notes], properties: { decision: { type: string, enum: [dismiss, warn, pause, remove, suspend, close] }, reasonCode: { type: string }, notes: { type: string, minLength: 10, maxLength: 5000 } } }
    ProfileMerge: { type: object, additionalProperties: false, required: [sourceProfileId, targetProfileId, reason], properties: { sourceProfileId: { type: string, format: uuid }, targetProfileId: { type: string, format: uuid }, reason: { type: string, minLength: 10, maxLength: 2000 } } }
