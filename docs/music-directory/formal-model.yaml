version: 1
system: tdf_music_directory

principals:
  account_party: authenticated Party associated with the active credential/token
  profile_manager: explicit active directory_profile_manager grant
  internal_role: canonical security_role grant used only for authorization
  public_profession: catalog relationship used only for discovery and presentation

state_machines:
  profile:
    initial: draft
    transitions:
      draft: [pending_review, published, archived]
      pending_review: [published, draft, suspended]
      published: [paused, archived, suspended, merged]
      paused: [published, archived, suspended]
      archived: []
      suspended: [published, archived]
      merged: []
  classified:
    initial: draft
    transitions:
      draft: [pending_moderation, published, withdrawn]
      pending_moderation: [published, rejected, withdrawn]
      published: [paused, filled, expired, withdrawn, moderated]
      paused: [published, filled, expired, withdrawn, moderated]
      filled: [published]
      expired: [published, withdrawn]
      withdrawn: []
      rejected: [draft, withdrawn]
      moderated: [draft, withdrawn]
  application:
    # ADR 0134: an application is a negotiable offer. Counter states alternate
    # actors and are entered only through the counter endpoint, which records
    # a round; expired is a system closure (offer_expires_at elapsed).
    initial: submitted
    transitions:
      submitted: [viewed, shortlisted, countered_by_author, accepted, rejected, withdrawn, expired]
      viewed: [shortlisted, countered_by_author, accepted, rejected, withdrawn, expired]
      shortlisted: [countered_by_author, accepted, rejected, withdrawn, expired]
      countered_by_author: [countered_by_applicant, accepted, rejected, withdrawn, expired]
      countered_by_applicant: [countered_by_author, accepted, rejected, withdrawn, expired]
      accepted: [conversation_open, converted, withdrawn]
      conversation_open: [converted, withdrawn]
      converted: []
      rejected: []
      withdrawn: []
      expired: []
  agreement:
    # ADR 0135: created when an offer with an amount is accepted and the
    # marketplace.agreements gate is on. pending_deposit, balance_due and
    # expired belong to platform settlement (checkout) and are never entered
    # by a participant request; off-platform agreements start at confirmed.
    # ADR 0136: with the marketplace.agreement_payments gate on and a ready
    # payout account, the agreement starts at pending_deposit instead and only
    # verified payments move it out of pending_deposit and balance_due.
    initial: confirmed
    transitions:
      pending_deposit: [confirmed, cancelled, expired]
      confirmed: [in_progress, balance_due, completed, cancelled, disputed]
      in_progress: [balance_due, completed, cancelled, disputed]
      balance_due: [completed, disputed]
      disputed: [completed, cancelled]
      completed: []
      cancelled: []
      expired: []
  agreement_payment:
    # ADR 0136: one charge (deposit or balance) of an agreement settled on the
    # platform. Only reconciliation with verified provider evidence pays it.
    initial: pending
    transitions:
      pending: [paid, expired, cancelled]
      paid: []
      expired: []
      cancelled: []
  invitation:
    initial: pending
    transitions:
      pending: [accepted, declined, withdrawn, blocked, expired]
      accepted: [withdrawn, blocked, conversation_open, converted]
      conversation_open: [withdrawn, blocked, converted]
      converted: []
      declined: []
      expired: []
      withdrawn: []
      blocked: []
  claim:
    initial: draft
    transitions:
      draft: [submitted, withdrawn]
      submitted: [under_review, withdrawn]
      under_review: [approved, rejected, more_evidence_requested, withdrawn]
      more_evidence_requested: [submitted, withdrawn]
      approved: [revoked]
      rejected: [submitted]
      withdrawn: []
      revoked: []
  moderation_case:
    initial: open
    transitions:
      open: [triaged, dismissed]
      triaged: [under_review, dismissed]
      under_review: [actioned, dismissed, appealed]
      actioned: [appealed, closed]
      appealed: [appeal_review, closed]
      appeal_review: [actioned, reversed, closed]
      reversed: [closed]
      dismissed: [closed]
      closed: []
  review:
    # Reviews reference a completed verified interaction (I09) and are published
    # on creation; there is no pending state (audit F-09).
    initial: published
    transitions:
      published: [hidden, removed]
      hidden: [published, removed]
      removed: []

invariants:
  I01_profession_never_authorizes:
    statement: Authorization decisions never read profile profession relationships or profession catalog values.
    enforcement: code boundary plus property test over all professions and internal actions
  I02_explicit_profile_management:
    statement: An account may mutate a profile iff an active manager grant includes the requested capability or the caller has the explicit administrative permission.
    enforcement: database uniqueness and handler scope guard
  I03_unique_profile_professions:
    statement: A profile may have many professions but at most one relationship per profile and profession.
    enforcement: primary key (profile_id, profession_id)
  I04_public_search_scope:
    statement: Every organic result is public, published, effective, unexpired, unsuspended and moderation-allowed.
    enforcement: public search view predicate plus property/integration tests
  I05_public_location_privacy:
    statement: Public DTO schemas contain neither exact_address nor private_latitude/private_longitude, and residential results never emit precise coordinates.
    enforcement: separate private table, DTO allowlist and schema test
  I06_authenticated_mutations:
    statement: Publish, respond, invite, contact, save, report and conversion operations require a valid authenticated Party and record-scope authorization.
    enforcement: ProtectedAPI plus scope guards
  I07_declared_classified_transitions:
    statement: Every classified state change belongs to the transition relation above.
    enforcement: pure guard, database trigger and property test
  I08_application_confidentiality:
    statement: An application is readable only by applicant-profile managers, classified-profile managers or authorized moderators with audit purpose.
    enforcement: participant query scope and IDOR tests
  I09_verified_review_interaction:
    statement: A review references exactly one completed, verified interaction whose two public participants are the managed author profile and the subject profile, in either order.
    enforcement: foreign key, participant/status trigger, handler record-scope guard, unique interaction/author/subject relation and property/integration tests
  I10_sponsored_separation:
    statement: Sponsored results are never members of organicResults and always include sponsored=true and sponsorDisclosure.
    enforcement: disjoint response collections and contract property test
  I11_claim_approval_owns:
    statement: A claim creates no manager grant before the approved transition commits.
    enforcement: approval transaction and negative transition test
  I17_revocation_withdraws_grants:
    statement: Revoking an approved claim (AUTHORITY-097) deactivates every manager grant the claim created in the same transaction, requires a stated reason and a reviewer distinct from the claimant, and is terminal; the claimant may submit a new claim.
    enforcement: status CHECK requiring reviewer and reason, immediate trigger refusing revocation while a grant from the claim is active, handler transaction and HTTP tests
  I12_idempotent_alerts_and_invites:
    statement: Repeating an alert match or invitation request with the same scope/key returns the original resource; a different payload conflicts.
    enforcement: unique scope plus request fingerprint
  I13_profile_withdrawal_cascades_publicity:
    statement: Archiving or suspending a profile removes its public document and pauses/removes dependent public classifieds atomically.
    enforcement: trigger and integration test
  I14_merge_preserves_references:
    statement: Merge records source->target, preserves immutable child references and source slug resolution, records before/after counts and audit, and never deletes historical rows.
    enforcement: locked idempotent merge transaction, canonical resolution view and reconciliation-count integration test
  I18_alternating_negotiation:
    statement: Counter-offers alternate strictly between the author and the offerer, occupy at most rounds 2 to 9, and an acceptance (always recorded, at most round 10) closes the chain; counter states are unreachable through the generic status endpoint.
    enforcement: TDF.Directory.Policy (counterAllowedFor, acceptAllowedFor, participantTransitionAllowed, negotiationRoundsValid), classified_offer_round unique (application_id, round_number) and property tests (ADR 0134)
  I19_slot_accounting:
    statement: Accepting an offer consumes exactly one slot in the same transaction; slots_remaining is never negative nor above slots; when it reaches zero the classified is filled and every open offer is rejected with reason slots_filled; withdrawing an accepted offer releases one slot.
    enforcement: CHECK (slots_remaining BETWEEN 0 AND slots), guarded decrement, handler transaction and property tests
  I20_offer_confidentiality_aggregates:
    statement: Offerers see only their own offer and rounds; the public and other offerers see only the offer count and, with at least three offers, an anonymous amount range.
    enforcement: participant-scoped queries and offerStats projection
  I21_agreement_transitions:
    statement: Every agreement state change belongs to the declared relation; completed, cancelled and expired agreements never move again; amounts, parties and terms are frozen at creation.
    enforcement: Policy relation, marketplace_agreement_transition_allowed trigger, static state-machine gate and property tests
  I22_agreement_authority:
    statement: The provider marks the start, only the buyer confirms completion, either party cancels or disputes a live agreement, only an administrator resolves a dispute, and settlement states (pending_deposit, balance_due, expired) are never requested by a participant nor used by off-platform agreements.
    enforcement: agreementTransitionAllowedFor, participant-scoped role resolution, CHECK on settlement_mode and property tests
  I23_agreement_accounting:
    statement: For every agreement deposit + balance = amount, 0 <= commission <= amount, and the commission and deposit are the pricing rule in force when the offer was accepted; a payment state never implies the service was delivered.
    enforcement: CHECK constraints, agreementAmounts property tests and the frozen-values trigger
  I24_agreement_payment_transitions:
    statement: Every agreement payment state change belongs to the declared relation; a paid, expired or cancelled payment never moves again; its amount, split, recipient and checkout are frozen at creation; and it becomes paid only with verified provider evidence bound to its own canonical checkout for the exact amount and currency.
    enforcement: Policy relation, marketplace_guard_agreement_payment trigger (commerce_checkout_has_verified_payment), static state-machine gate and property tests
  I25_agreement_payment_split:
    statement: For every agreement payment platform fee + processor fee + provider amount = amount with no negative part; the platform never takes more than the commission due on that charge; the balance carries whatever the paid charges did not collect for the platform, so over deposit and balance it takes the frozen commission whenever the charges can carry it and never more; TDF never holds the provider's part.
    enforcement: CHECK constraint, agreementPaymentSplit and agreementCommissionDue property tests, marketplace product flow capability gates (ADR 0115)
  I26_agreement_settlement_progress:
    statement: An agreement settled on the platform is confirmed only with a paid deposit and completed from balance_due only with a paid balance; the buyer's confirmation of delivery waits for the balance when one is owed; a participant cannot cancel directly, nor by withdrawing the accepted offer, once a deposit was collected or while a payment attempt may still collect money; an unpaid deposit expires the agreement and releases the slot.
    enforcement: marketplace_agreement_require_paid_payment trigger, agreementCompletionTarget and agreementParticipantCancelAllowed, reconciliation hook and property tests
  I15_no_public_sensitive_data:
    statement: No public endpoint returns PII, credentials, tokens, private evidence, moderation notes or administrative fields.
    enforcement: DTO allowlists, OpenAPI schema audit and endpoint tests
  I16_rich_profile_update_intent:
    statement: Omitted rich fields preserve prior values, explicit empty values clear only their field, membership details equal their ID sets, and an explicit nonempty service-area set has exactly one primary location.
    enforcement: closed writer DTO, handler preconditions, relational primary keys and PostgreSQL/API compatibility tests

preconditions:
  update_profile:
    - caller is authenticated and has an active edit grant over the exact profile
    - public professions remain data and are never consulted for authorization
    - professionDetails and instrumentDetails contain the same unique IDs as their canonical ID arrays
    - rate maximum is not below minimum and any rate has a catalog currency
    - portfolio and links contain only bounded HTTP(S) URLs without embedded credentials or safe same-origin paths
    - an explicit nonempty serviceAreas collection has unique scopes and exactly one primary
    - every service area references one active and internally consistent country/subdivision/city/metropolitan hierarchy
  publish_profile:
    - caller has profile.publish grant
    - profile is complete enough for its type
    - age/contact controls pass
    - current transition permits published
  publish_classified:
    - caller has classified.create through an active publishing profile
    - category requirements pass
    - expiration is in the future and at most the configured maximum
    - moderation and spam policy choose a declared transition
  submit_application:
    - caller manages applicant profile with contact capability
    - classified is published, unexpired, not derived from an artist profile, has a slot left and its offer deadline has not passed
    - a fixed-price classified admits only its exact amount and currency
    - the applicant profile has no other active offer on the classified
    - neither profile blocks the other, target preferences and minimum completeness pass, and age controls pass
    - uniqueness/idempotency scope is unused or payload-identical
  send_invitation:
    - caller manages the explicitly selected sender profile with contact capability
    - sender and target are distinct published profiles
    - neither profile blocks the other and target preferences and minimum completeness pass
    - any linked classified is published, current and owned by the sender profile
    - uniqueness/idempotency scope is unused or payload-identical
  open_contact:
    - authenticated caller manages source profile
    - a profile context matches the target, or the exact application/invitation participant pair is accepted
    - cold profile/classified contact passes target preferences and minimum completeness; explicit application/invitation acceptance supplies contextual consent
    - neither party blocks the other
  approve_claim:
    - reviewer has claims.approve permission
    - reviewer differs from claimant where policy requires
  revoke_claim:
    - reviewer has Admin role and Admin module and differs from the claimant
    - claim is approved
    - a non-empty reason is stated
    - grants created by the claim are deactivated before the status changes
    - evidence decision is recorded
  create_review:
    - caller is authenticated and has an active edit grant over author_profile_id
    - caller passes adult or guardian-approved age assurance
    - author and subject are distinct, current and published public profiles
    - interaction is completed, has verified_at and contains exactly author and subject in either order
    - neither profile blocks the other
    - no review exists for interaction, author and subject
    - idempotency scope is unused or payload-identical and the daily rate limit permits the request

postconditions:
  update_profile:
    - omitted rich fields and omitted language/service-area collections retain their previous values
    - explicit empty strings/collections and clearRates affect only the requested data
    - the private response is scoped through the active manager grant
    - the public projection contains no Party PII, private coordinates, exact address or manager capability
    - one audit event records field-level update intent without copying profile content into audit metadata
    - search completeness and the profile search document are refreshed
  publish_classified:
    - status is published
    - published_at is set once
    - expires_at defaults to published_at plus 30 days when omitted
    - public search document is refreshed
    - audit event records actor, transition and correlation id
  accept_application:
    - the author accepts an offer waiting on the author; the offerer accepts an author counter
    - the classified is published, unexpired and has a slot left; the offer state and the slot are re-read under row locks and one slot is consumed atomically (concurrent acceptances of the same offer consume one slot)
    - accepted_amount_minor freezes the last round's amount and an accept round is recorded
    - with the marketplace.agreements gate on and a positive amount, the agreement is created in the same transaction with frozen amounts (ADR 0135)
    - when no slot is left the classified becomes filled and open offers are rejected (slots_filled)
    - application remains private
    - conversation context may be created exactly once
  transition_agreement:
    - caller manages the buyer or provider profile, or is an administrator resolving a dispute
    - the marketplace.agreements gate is on and the transition is permitted for that party
    - the agreement is re-read under a row lock (order classified, offer, agreement) and matches the version the caller saw
    - completing records a verified directory_interaction of kind marketplace_agreement
    - cancelling withdraws the accepted offer and releases its slot
  counter_offer:
    - caller is the author or the offerer and it is their turn
    - the offer is open, unexpired, the classified is published and its price mode is not fixed
    - the round number is current_round + 1 and at most 9; round 10 is reserved for the acceptance
    - the round expiry never exceeds the classified offer deadline or expiry
    - the round and the offer's current amount, terms and expiry change in one transaction
    - the counterpart is notified
  accept_invitation:
    - only target-profile managers may accept
    - an expired pending invitation transitions to expired instead of accepted
    - blocking creates the target-to-sender profile block in the same transaction
    - conversation context may be created only after acceptance and exactly once
  merge_profile:
    - source status is merged and canonical_profile_id points to target
    - every active slug remains resolvable
    - historical child references are unchanged
    - before/after reference counts and audit are persisted
  create_review:
    - exactly one published review exists for interaction, author and subject
    - the idempotency key replays the same review and a different payload conflicts
    - the subject reputation aggregate is refreshed in the same transaction
    - only a real insert may create an internal notification
    - public DTOs omit Party identifiers, external interaction identifiers and administrative fields

idempotency_scopes:
  - invitation(sender_profile_id, target_profile_id, context_kind, context_id, idempotency_key)
  - application(classified_id, applicant_profile_id, idempotency_key)
  - offer_round(actor_party_id, idempotency_key, request_fingerprint)
  - saved_search_alert(saved_search_id, result_kind, result_id, result_version)
  - contact_context(thread_id, context_kind, context_id)
  - review_create(actor_party_id, idempotency_key, request_fingerprint)
  - analytics_event(actor_scope, event_name, idempotency_key)

privacy_projection:
  allowed_public_location_fields:
    - cityId
    - cityName
    - subdivisionName
    - countryCode
    - sectorLabel
    - approximateDistanceKm
    - precision
    - publicLatitude
    - publicLongitude
  forbidden_public_fields:
    - exactAddress
    - privateLatitude
    - privateLongitude
    - primaryEmail
    - primaryPhone
    - whatsapp
    - taxId
    - emergencyContact
    - credential
    - apiToken
    - evidencePayload
    - moderatorNotes
