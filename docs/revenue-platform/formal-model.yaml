version: 1
money:
  representation: signed_integer_minor_units
  required_currency: ISO_4217_uppercase
  invariants:
    - checkout.total_minor == sum(checkout_lines.total_minor) + checkout.fee_minor + checkout.tax_minor
    - checkout_line.total_minor == checkout_line.quantity * checkout_line.unit_minor - checkout_line.discount_minor + checkout_line.tax_minor
    - checkout snapshots are immutable after validated
    - captured amount and currency equal the immutable checkout total and currency
    - no browser request can transition a payment to paid or captured

state_machines:
  checkout:
    initial: draft
    transitions:
      draft: [validated, cancelled]
      validated: [holding, awaiting_payment, cancelled, expired]
      holding: [awaiting_payment, cancelled, expired]
      awaiting_payment: [processing, cancelled, expired, failed]
      processing: [paid, failed, cancelled]
      paid: [partially_refunded, refunded, disputed, chargeback]
      partially_refunded: [partially_refunded, refunded, disputed, chargeback]
      disputed: [paid, chargeback]
      failed: []
      cancelled: []
      expired: []
      refunded: []
      chargeback: []
  quote:
    initial: draft
    transitions:
      draft: [sent, cancelled]
      sent: [viewed, accepted, cancelled, expired]
      viewed: [accepted, cancelled, expired]
      accepted: [deposit_due, cancelled]
      deposit_due: [deposit_paid, cancelled, expired]
      deposit_paid: [in_progress, cancelled, refunded, partially_refunded]
      in_progress: [balance_due, cancelled]
      balance_due: [completed, cancelled]
      completed: []
      cancelled: []
      expired: []
      partially_refunded: [refunded]
      refunded: []
  distribution:
    initial: draft
    transitions:
      draft: [validation_failed, ready_for_review, archived]
      validation_failed: [draft, archived]
      ready_for_review: [rights_review, validation_failed, archived]
      rights_review: [payment_due, ready_for_review, archived]
      payment_due: [paid, archived]
      paid: [scheduled, refunded, partially_refunded]
      scheduled: [delivering, archived]
      delivering: [acknowledged, partially_rejected, rejected]
      acknowledged: [accepted, partially_rejected, rejected]
      partially_rejected: [scheduled, accepted, takedown_requested]
      rejected: [scheduled, archived]
      accepted: [live, live_confirmation_pending, takedown_requested]
      live_confirmation_pending: [live, takedown_requested]
      live: [reporting, takedown_requested]
      reporting: [reporting, takedown_requested]
      takedown_requested: [takedown_completed]
      takedown_completed: [archived]
      partially_refunded: [refunded, scheduled]
      refunded: [archived]
      archived: []
  royalty_statement:
    initial: ingested
    transitions:
      ingested: [normalized, rejected]
      normalized: [reconciled, variance_review]
      variance_review: [reconciled, rejected]
      reconciled: [allocated]
      allocated: [review]
      review: [issued, disputed]
      issued: [payable, disputed, corrected]
      payable: [paid, disputed, corrected]
      paid: [disputed, corrected]
      disputed: [review, corrected]
      corrected: [review]
      rejected: []

payment_fulfillment_separation:
  rule: payment transitions never directly imply fulfillment transitions
  examples:
    - paid != equipment_shipped
    - paid != rental_handed_off
    - paid != booking_completed
    - paid != tickets_checked_in
    - paid != distribution_sent
    - acknowledged != distribution_live
    - payable != payout_paid

idempotency:
  unique_scopes:
    - checkout(domain_type, domain_id, client_request_key)
    - provider_order(provider, merchant_account, provider_order_id)
    - provider_resource(provider, merchant_account, provider_resource_id)
    - provider_event(provider, merchant_account, provider_event_id)
    - provider_operation(provider_attempt_id, operation, idempotency_key)
    - refund(provider_attempt_id, provider_refund_id)
    - hold(resource_type, resource_id, active_time_range)
    - fulfillment_event(domain_type, domain_id, checkout_event_id)
    - delivery(release_version_id, recipient_profile_id, operation)
    - statement(source_report_id, beneficiary_id, allocation_version)
  retry_rule: same key and same canonical request returns the original result; different request is conflict

holds:
  requirements:
    - created and conflict-checked in one database transaction
    - active ranges cannot overlap for exclusive resources
    - ticket and course quantities cannot make remaining capacity negative
    - expiration is monotonic and releases inventory exactly once
    - paid checkout consumes its holds exactly once

provider_verification:
  required_bindings:
    - provider mode is compatible with checkout mode
    - merchant account or entity equals the stored binding
    - provider order and resource equal stored references
    - provider merchant reference equals internal checkout/order reference
    - amount and currency equal immutable checkout snapshot
    - provider status is an allowlisted success status
    - event signature and timestamp are valid when a signature contract exists
    - event or server verification has not already been applied
  sandbox_rule: sandbox or mocked evidence cannot transition production rows

manual_payment:
  selection_state: awaiting_manual_confirmation
  approval_requires:
    - immutable evidence record and checksum
    - authorized verifier distinct from submitter when configured
    - verified amount currency payer and reference
    - audit event and compensating correction path

ledger:
  invariants:
    - every posted transaction has at least two entries
    - sum(debits) == sum(credits) per transaction and currency
    - posted entries are immutable
    - refunds disputes chargebacks corrections and writeoffs use new compensating transactions
    - provider receivable cash fees tax revenue and third_party_payable are distinct accounts
    - payout cannot exceed available verified beneficiary balance

rights_and_distribution:
  invariants:
    - split basis points total 10000 for each rights scope and territory/term version
    - every participant acceptance references the exact split version
    - deliverable release version is immutable
    - every package references recipient profile version manifest assets checksums terms and message id
    - updates and takedowns reference prior accepted delivery chains
    - sent requires transport evidence; acknowledged requires recipient evidence; live requires store or partner evidence
    - mocked or sandbox responses cannot transition production deliveries
    - usage corrections append lineage and never overwrite financial history
